[project]
name = "baler"
version = "0.1.0"
description = "Ontology-agnostic building data platform: API-first, load-time-pluggable (Brick/Haystack/DBO), headless by design"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0.0",
    "requests>=2.31.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8.0",
    "cryptography>=42",  # source registry secrets at rest (baler.sources)
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "phable>=0.1.29", "openapi-spec-validator>=0.7.0", "jsonschema>=4.0.0", "ruff>=0.16.0", "mypy>=2.0.0", "radon>=6.0.0", "pytest-cov>=7.0.0", "pyoxigraph>=0.5.0"]
llm = ["anthropic>=0.69.0", "pydantic>=2.0.0"]
validate = ["pyshacl>=0.30.0"]
# Cx 3 (#39): ConStrain sequence items over history (commissioning.gl36).
# ConStrain itself is vendored, not a dependency - it pins rdflib 6 via
# brickschema==0.7.1; see todo/cx3-constrain-gl36-spike.md.
cx-gl36 = ["pandas>=2.1"]
# Cx 7 (#43): XLSX equipment schedules and point lists (commissioning.spec).
cx-spec = ["openpyxl>=3.1"]
# haystack_api.py (Project Haystack HTTP API). Built from source with
# maturin until openhay ships wheels to PyPI - needs a Rust toolchain.
haystack = ["openhay @ git+https://github.com/jacobnash/openhay@main#subdirectory=crates/openhay-py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live docker-compose services (oxigraph, postgres, mosquitto, jaeger)",
]

[tool.mypy]
ignore_missing_imports = true
