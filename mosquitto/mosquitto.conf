listener 1883
allow_anonymous false

# Backend accounts (MOSQUITTO_USERS -> passwd, see entrypoint.sh) and their ACLs.
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Edge-node accounts (Baler#36): per-site, created/rotated/revoked live by
# auth_api over $CONTROL/dynamic-security/v1 (baler.broker_accounts). Each may
# publish only under its site's topic prefixes and use its own cmd/<user>/#.
# Clients not in this plugin's config fall through to the files above.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
max_queued_messages 10000
# QoS 1 messages a client may hold unacknowledged (default 20). The
# listener acknowledges a reading only after its batch is committed
# (mqtt_listener.ReadingBatcher), so this is the largest batch it can
# ever see: at 20, batching collapsed to ~80 readings/s (Baler#190).
# Bounded, so a stalled listener still backs up into max_queued_messages.
max_inflight_messages 10000

# The TLS listener, when a cert is mounted (written by entrypoint.sh).
include_dir /mosquitto/data/conf.d
