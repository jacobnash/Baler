listener 1883
allow_anonymous false

# Backend accounts (MOSQUITTO_USERS -> passwd, see entrypoint.sh) and their ACLs.
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Edge-node accounts (Baler#36): per-site, created/rotated/revoked live by
# auth_api over $CONTROL/dynamic-security/v1 (baler.broker_accounts). Each may
# publish only under its site's topic prefixes and use its own cmd/<user>/#.
# Clients not in this plugin's config fall through to the files above.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
# Readings queued for a client that's offline or behind: each listener
# worker's persistent session across a restart (Baler#233). Per client, so
# N workers can queue N times this. Bounded, in memory: a buffer for a
# listener restart or a burst, not for an outage - Windrow's spool covers
# the uplink, and what's queued here does not survive a broker crash
# (persistence only saves on shutdown). Past either limit the broker drops
# readings it already acknowledged to the edge; mqtt_listener's supervisor
# logs and counts those drops ($SYS), and /ops/status shows them.
#   - messages: a worker gets 1/N of the load, so 500k is 500k / (rate/N)
#     seconds of it: 250 s of a small site's 2k/s on 1 worker, 100 s of the
#     100k-point ladder's 20k/s on 4. ~550 B of broker memory each
#     (measured, a 65 B reading): <= ~275 MB per worker queue.
#   - bytes (payload): the same budget for big messages - a tags storm is
#     ~0.5 KB a message - so a queue can't take 500k of those.
max_queued_messages 500000
max_queued_bytes 67108864
# QoS 1 messages a client may hold unacknowledged (default 20). The
# listener acknowledges a reading only after its batch is committed
# (mqtt_listener.ReadingBatcher), so this is the largest batch it can
# ever see: at 20, batching collapsed to ~80 readings/s (Baler#190).
# Bounded, so a stalled listener still backs up into max_queued_messages.
max_inflight_messages 10000

# The TLS listener, when a cert is mounted (written by entrypoint.sh).
include_dir /mosquitto/data/conf.d
