              expires_at: { type: string, format: date-time }
        plan_hash: { type: string, description: "sha256 of the plan; the typed confirmation repeats it" }
        status: { type: string, enum: [planned, confirmed, running, completed, stopped, aborted, expired, failed, cancelled] }
        window_start: { type: string, format: date-time }
