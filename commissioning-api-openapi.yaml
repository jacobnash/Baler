            max_concurrent: { type: integer }
            stagger_seconds: { type: integer }
            max_failures: { type: integer }
        members:
          type: array
          items:
            type: object
            required: [equip_uri, system, steps, slot_start, slot_end, state]
            properties:
              equip_uri: { type: string }
              dis: { type: [string, "null"] }
              system: { type: string, description: "The equipment that feeds it (brick:feeds / isFedBy), or (no system)" }
              steps: { type: array, items: { type: object } }
              minutes: { type: number }
              slot_start: { type: string, format: date-time, description: Never started before this }
              slot_end: { type: string, format: date-time }
              state: { type: string, enum: [pending, started, done, skipped, not_run] }
              run_id: { type: [string, "null"], description: Its own active run, once started }
              outcome: { type: [string, "null"], enum: [pass, fail, inconclusive, aborted, null] }
              started_at: { type: [string, "null"] }
              note: { type: [string, "null"] }
        skipped:
