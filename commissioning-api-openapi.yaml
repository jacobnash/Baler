      responses:
        "201":
          description: The case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavingsCase" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /savings-cases/{id}:
