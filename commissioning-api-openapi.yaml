  /packs/{id}/extract:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Packs]
      operationId: extractCxPackRows
      summary: Propose rows for a draft pack from a PDF you hold (operator)
      description: |
        Runs in the background (poll GET /pack-extractions/{id}). Each
        proposal cites the page and quotes the text it was read from; the
        quote must be on that page or the proposal is dropped. The PDF is
        not kept (only its sha256). Needs BALER_LLM_PROVIDER set to a model.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                filename: { type: string }
                data: { type: string, description: The PDF, base64 }
      responses:
        "202":
          description: The queued extraction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackExtraction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: No model is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
