                  results: { type: array, items: { $ref: "#/components/schemas/Result" } }
        issues: { type: array, items: { type: object } }
        active_runs: { type: array, items: { type: object }, description: "Cx 9: active tests and every write they made" }
    Template:
      type: object
      required: [id, label, target_class, requirements]
      properties:
        id: { type: string }
        label: { type: string }
        target_class: { type: string }
        requirements:
          type: array
          items:
            type: object
            required: [id, name, classes, severity]
            properties:
              id: { type: string }
              name: { type: string }
              classes: { type: array, items: { type: string } }
              severity: { type: string, enum: [required, expected, optional] }
              message: { type: string }
              haystack_markers: { type: array, items: { type: string } }
              xeto_spec: { type: [string, "null"] }
    ManualResult:
      type: object
      required: [id, project_id, procedure_id, test_run_id, equip_uri, step_id, status, recorded_by, recorded_at, observed_at, history]
      properties:
        id: { type: string }
        project_id: { type: string }
        procedure_id: { type: string }
        test_run_id: { type: string }
        equip_uri: { type: string }
        step_id: { type: string }
        status: { type: string, enum: [pass, fail, not_applicable] }
        note: { type: [string, "null"] }
        witness: { type: [object, "null"] }
        attachments:
          type: array
          items:
            type: object
            properties: { id: { type: string }, filename: { type: string }, media_type: { type: string }, size: { type: integer }, sha256: { type: string } }
        recorded_by: { type: string }
        recorded_email: { type: [string, "null"] }
        recorded_name: { type: [string, "null"] }
        recorded_role: { type: [string, "null"] }
        recorded_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }
        client_id: { type: [string, "null"] }
        history: { type: array, items: { type: object }, description: "Earlier versions: status, note, witness, attachments, replaced_at, replaced_by, reason" }
        updated_at: { type: string, format: date-time }
    SpaceSpec:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        kind: { type: string, enum: [building, floor, suite, zone, room] }
        space_type: { type: [string, "null"], description: "Slug, e.g. operating_room; what a pack's applies_to.space_type matches" }
        parent_id: { type: [string, "null"] }
        rec_class: { type: [string, "null"] }
        brick_class: { type: [string, "null"] }
        point_uris: { type: array, maxItems: 50, items: { type: string } }
        attributes: { type: object, description: "e.g. area_ft2, volume_ft3" }
    Space:
      type: object
      required: [id, project_id, name, kind, status, point_uris, attributes, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        kind: { type: string }
        space_type: { type: [string, "null"] }
        parent_id: { type: [string, "null"] }
        rec_class: { type: [string, "null"] }
        brick_class: { type: [string, "null"] }
        point_uris: { type: array, items: { type: string } }
        attributes: { type: object }
        status: { type: string, enum: [active, archived] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SpaceDetail:
      allOf:
        - { $ref: "#/components/schemas/Space" }
        - type: object
          required: [adjacent, serving, serving_chain, children]
          properties:
            adjacent:
              type: array
              items:
                type: object
                properties:
                  space_id: { type: string }
                  relation: { type: string }
            serving: { type: array, items: { type: string } }
            serving_chain:
              type: array
              description: The terminals (level 1) and what feeds them, from the graph's brick:feeds
              items:
                type: object
                properties:
                  equip_uri: { type: string }
                  feeds: { type: [string, "null"] }
                  level: { type: integer }
            children: { type: array, items: { $ref: "#/components/schemas/Space" } }
    ReadinessCriterion:
      type: object
      required: [status, items]
      properties:
        status: { type: string, enum: [pass, fail, inconclusive] }
        items: { type: array, items: { type: object } }
        note: { type: [string, "null"] }
    Readiness:
      type: object
      required: [project, space, generated_at, status, verdict, counts, rooms, limitations]
      properties:
        project: { type: object }
        space: { type: object }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [pass, fail, inconclusive] }
        verdict: { type: string, enum: [ready, incomplete, not_ready] }
        counts:
          type: object
          properties:
            ready: { type: integer }
            incomplete: { type: integer }
            not_ready: { type: integer }
        limitations: { type: array, items: { type: string } }
        rooms:
          type: array
          items:
            type: object
            required: [space_id, name, status, verdict, criteria, serving_chain]
            properties:
              space_id: { type: string }
              name: { type: string }
              space_type: { type: [string, "null"] }
              status: { type: string, enum: [pass, fail, inconclusive] }
              verdict: { type: string, enum: [ready, incomplete, not_ready] }
              serving_chain: { type: array, items: { type: object } }
              criteria:
                type: object
                required: [requirements, tests, tab_report, issues]
                properties:
                  requirements: { $ref: "#/components/schemas/ReadinessCriterion" }
                  tests: { $ref: "#/components/schemas/ReadinessCriterion" }
                  tab_report: { $ref: "#/components/schemas/ReadinessCriterion" }
                  issues: { $ref: "#/components/schemas/ReadinessCriterion" }
    PackRow:
      type: object
      required: [id, title, citation, applies_to, criterion, evidence, check]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 160 }
        citation:
          type: object
          required: [ref]
          additionalProperties: false
          properties:
            ref: { type: string, description: "Table, section or clause" }
            page: { type: [integer, string, "null"] }
        applies_to:
          type: object
          properties:
            space_type: { type: array, items: { type: string } }
            equip_class: { type: array, items: { type: string } }
            phase: { type: array, items: { type: string } }
        criterion:
          type: object
          properties:
            quantity: { type: [string, "null"] }
            op: { type: [string, "null"], enum: [">=", "<=", ">", "<", between, "==", null] }
            value: { type: [number, string, "null"] }
            min: { type: [number, "null"] }
            max: { type: [number, "null"] }
            unit: { type: [string, "null"] }
        evidence:
          type: object
          properties:
            point_class: { type: [string, "null"] }
            window_hours: { type: number }
            coverage: { type: number }
        check:
          type: object
          required: [engine]
          properties:
            engine: { type: string, enum: [cx, procedure, shacl, gl36] }
            check_id: { type: string }
            criterion: { type: string }
            template: { type: string }
            item: { type: string }
        verified_by: { type: [object, "null"] }
        note: { type: [string, "null"] }
    PackDocument:
      type: object
      required: [pack_id, version, title, source]
      properties:
        pack_id: { type: string }
        version: { type: string }
        title: { type: string }
        source:
          type: object
          required: [standard, edition]
          properties:
            standard: { type: string }
            edition: { type: string }
            publisher: { type: [string, "null"] }
            kind: { type: [string, "null"] }
        jurisdiction: { type: array, items: { type: string } }
        notice: { type: [string, "null"] }
        requirements: { type: array, items: { $ref: "#/components/schemas/PackRow" } }
    Pack:
      allOf:
        - { $ref: "#/components/schemas/PackDocument" }
        - type: object
          required: [id, org_id, status, summary, created_at]
          properties:
            id: { type: string }
            org_id: { type: string }
            status: { type: string, enum: [draft, published, retired] }
            history: { type: array, items: { type: object } }
            summary:
              type: object
              properties:
                rows: { type: integer }
                confirmed: { type: integer }
                blank: { type: integer }
                active: { type: integer }
            created_by: { type: [string, "null"] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            published_by: { type: [string, "null"] }
            published_at: { type: [string, "null"], format: date-time }
    PackAdoption:
      type: object
      required: [adoption, pack]
      properties:
        adoption:
          type: object
          properties:
            id: { type: string }
            project_id: { type: string }
            pack_ref: { type: string }
            pack_id: { type: string }
            version: { type: string }
            adopted_by: { type: [string, "null"] }
            adopted_at: { type: string, format: date-time }
            retired_at: { type: [string, "null"] }
        pack: { $ref: "#/components/schemas/Pack" }
    PackExtraction:
      type: object
      required: [id, pack_ref, filename, sha256, size, status, proposals]
      properties:
        id: { type: string }
        org_id: { type: string }
        pack_ref: { type: string }
        filename: { type: string }
        sha256: { type: string }
        size: { type: integer }
        status: { type: string, enum: [queued, running, completed, failed] }
        proposals: { type: integer }
        info: { type: [object, "null"] }
        error: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"] }
    PackProposal:
      type: object
      required: [id, pack_ref, row, source, status]
      properties:
        id: { type: string }
        org_id: { type: string }
        pack_ref: { type: string }
        extraction_id: { type: string }
        row: { $ref: "#/components/schemas/PackRow" }
        source:
          type: object
          properties:
            document: { type: string }
            sha256: { type: string }
            page: { type: integer }
            quote: { type: string, description: "Verbatim, from the user's own document; never copied into the pack" }
            quote_verified: { type: boolean }
        confidence: { type: [number, "null"] }
        status: { type: string, enum: [proposed, accepted, rejected] }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ComplianceRun:
      type: object
      required: [id, project_id, status, window_end, started_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed] }
        triggered_by: { type: [string, "null"] }
        window_end: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"] }
        summary: { type: [object, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    ComplianceLogRow:
      type: object
      required: [space_id, pack_id, version, row_id, title, citation, status, window_start, window_end, evidence]
      properties:
        id: { type: string }
        run_id: { type: string }
        space_id: { type: string }
        pack_ref: { type: string }
        pack_id: { type: string }
        version: { type: string }
        row_id: { type: string }
        title: { type: string }
        citation: { type: object }
        status: { type: string, enum: [pass, fail, inconclusive] }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        evidence: { type: object }
        note: { type: [string, "null"] }
    PerformanceBaseline:
      type: object
      required: [id, project_id, equip_uri, kind, points, fit_start, fit_end, model, status]
      properties:
        id: { type: string }
        project_id: { type: string }
        equip_uri: { type: string }
        asset_id: { type: [string, "null"] }
        kind: { type: string }
        points: { type: object }
        fit_start: { type: string, format: date-time }
        fit_end: { type: string, format: date-time }
        model:
          type: object
          properties:
            coefficients: { type: array, items: { type: number } }
            features: { type: array, items: { type: string } }
            n_hours: { type: integer }
            cvrmse_pct: { type: number }
            nmbe_pct: { type: number }
            ranges: { type: object }
            quality: { type: object }
        status: { type: string, enum: [active, superseded] }
        note: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    SavingsCase:
      type: object
      required: [id, project_id, equip_uri, title, assumptions, result, history]
      properties:
        id: { type: string }
        project_id: { type: string }
        equip_uri: { type: string }
        asset_id: { type: [string, "null"] }
        baseline_id: { type: [string, "null"] }
        title: { type: string }
        assumptions:
          type: object
          additionalProperties:
            type: object
            required: [value, unit, label, source]
            properties:
              value: { type: [number, "null"] }
              unit: { type: string }
              label: { type: string }
              source: { type: string, enum: [measured, user, default] }
              note: { type: [string, "null"] }
        result:
          type: object
          properties:
            annual_kwh_saved: { type: number }
            annual_savings: { type: number }
            simple_payback_years: { type: [number, "null"] }
            savings_over_remaining_life: { type: [number, "null"] }
            sensitivity: { type: array, items: { type: object } }
            formula: { type: string }
        history: { type: array, items: { type: object } }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
