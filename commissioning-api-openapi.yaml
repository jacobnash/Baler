openapi: 3.1.0
info:
  title: Baler Commissioning API
  version: 0.1.0
  description: |
    Commissioning (Cx) projects for a site: first-class, editable phases,
    a scoped equipment inventory read Brick-first and Haystack/Xeto-second,
    SHACL expected-point templates (`ontology/cx-expected-points.ttl`), and
    dated, reproducible verification runs. Slice Cx 1 (Baler#37) of the
    plan in `todo/commissioning-plan.md`.

    Every route needs a token whose org owns the project; a site-restricted
    login sees only projects on its own sites. Inventory and results are
    filtered by the caller's site scope inside the graph query. Roles are
    enforced by the gateway (`gateway/njs/policy.js`): reads are viewer,
    writes operator, archiving admin. Every change is recorded in the
    project's events.

    A check result is `pass`, `fail`, `inconclusive` (no data - never
    reported as a pass) or `not_applicable`. Failures name a certain
    symptom and candidate causes, each with what would tell it apart.
servers:
  - url: http://localhost:8080/cx
    description: >-
      Via the gateway (docker-compose) - the externally-reachable path.
      Every route is JWT-verified in nginx (gateway/njs/).
  - url: http://localhost:8009
    description: >-
      Direct - only from inside the Docker network or bare-metal; also
      needs the X-Gateway-Secret header the gateway adds.
tags:
  - name: Projects
  - name: Phases
  - name: Runs
  - name: Templates
  - name: Issues
  - name: Procedures
  - name: Spec
  - name: Faults
  - name: Active tests
  - name: Agent
paths:
  /projects:
    get:
      tags: [Projects]
      operationId: listCxProjects
      summary: Projects of the caller's org (and sites)
      parameters:
        - name: include_archived
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Projects, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Projects]
      operationId: createCxProject
      summary: Create a project (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phase]
              properties:
                name: { type: string }
                site_id:
                  type: [string, "null"]
                  description: >-
                    A site of the caller's org. Omit for an org-wide project
                    (not allowed for a site-restricted login).
                phase:
                  type: string
                  description: Key of the current phase. Always stated.
                phases:
                  type: array
                  description: >-
                    The project's own phase list, in order. Defaults to design,
                    construction, startup, functional, acceptance, warranty,
                    operations.
                  items: { $ref: "#/components/schemas/PhaseInput" }
                settings: { $ref: "#/components/schemas/Settings" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /projects/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Projects]
      operationId: getCxProject
      summary: One project, with its phases
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      operationId: updateCxProject
      summary: Rename or change settings (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                settings: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Projects]
      operationId: archiveCxProject
      summary: Archive a project (admin). Runs and events are kept.
      responses:
        "204": { description: Archived }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/phases:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    put:
      tags: [Phases]
      operationId: replaceCxPhases
      summary: Replace the phase list - rename, reorder, add, remove, skip (operator)
      description: >-
        Timestamps of phases that already existed are kept. Exactly one
        phase must remain active; move the current phase with
        POST .../phase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phases]
              properties:
                phases:
                  type: array
                  items: { $ref: "#/components/schemas/PhaseInput" }
      responses:
        "200":
          description: The updated project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/phase:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Phases]
      operationId: setCxPhase
      summary: Make a phase current (operator)
      description: >-
        Moving forward completes the phase being left; moving back returns
        it to pending. Moving forward into startup, functional, acceptance
        (or later) checks that phase's gate (GET .../gate) and, per
        settings.phase_gates, warns (the default), blocks, or doesn't check.
        A blocked move goes ahead with override true and a note saying why,
        recorded on the phase.set event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
                note: { type: string }
                override: { type: boolean, description: Move past an unmet gate in block mode (needs a note) }
      responses:
        "200":
          description: The updated project, plus the gate that was checked (null when the move isn't gated)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Project" }
                  - type: object
                    properties:
                      gate:
                        oneOf:
                          - { $ref: "#/components/schemas/PhaseGate" }
                          - { type: "null" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The gate isn't met and the project blocks on unmet gates
          content:
            application/json:
              schema:
                type: object
                required: [error, gate]
                properties:
                  error: { type: string }
                  gate: { $ref: "#/components/schemas/PhaseGate" }
  /projects/{id}/gate:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Phases]
      operationId: getCxPhaseGate
      summary: What moving into a phase would require, without moving
      description: >-
        startup: a completed verification run, every point reporting.
        functional: plus every power-on / start-up procedure's latest test
        run with no failing step. acceptance and later: plus every
        procedure's latest test run with no failing or inconclusive step,
        no issue left open (a resolved issue still needs a person to close
        it), and no inconclusive result in the latest run. An accepted risk
        on the issue for a (check, subject) waives it. Computed from the
        records each time.
      parameters:
        - { name: to, in: query, required: true, schema: { type: string }, description: The phase key }
      responses:
        "200":
          description: The gate
          content:
            application/json:
              schema:
                type: object
                required: [mode, gate]
                properties:
                  mode: { type: string, enum: [warn, block, "off"] }
                  gate: { $ref: "#/components/schemas/PhaseGate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/events:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Projects]
      operationId: listCxEvents
      summary: The project's audit trail, newest first
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/inventory:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Projects]
      operationId: getCxInventory
      summary: Live, scoped equipment and points, with the templates that apply
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: object
                required: [equipment]
                properties:
                  equipment:
                    type: array
                    items: { $ref: "#/components/schemas/InventoryEquip" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/runs:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Runs]
      operationId: listCxRuns
      summary: The project's runs, newest first
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Runs]
      operationId: createCxRun
      summary: Start a verification run (operator)
      description: >-
        Asynchronous (Baler#57): records a `queued` run and answers 202
        straight away; a background worker then runs inventory, template
        completeness and the verification ladder (rung 1 existence, rung 2
        liveness, rung 3 responsiveness) over the trailing window ending
        now, recorded against the current phase. Poll `GET /runs/{id}`
        until `status` is `completed` (summary and results filled in) or
        `failed` (`error` says why). One run per project at a time: a
        second request while one is queued or running gets 409 with that
        run's id.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                window_hours:
                  type: number
                  description: Defaults to the project's settings.window_hours, else 24.
      responses:
        "202":
          description: The queued run - poll GET /runs/{id}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The project is archived, or already has a run queued or running (`run_id` is that run)
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  run_id: { type: [string, "null"] }
  /runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Runs]
      operationId: getCxRun
      summary: A run and its results
      description: >-
        Poll this after POST /projects/{id}/runs. `results` is empty until
        `status` is `completed`.
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: equip_uri, in: query, schema: { type: string } }
        - name: check_id
          in: query
          description: Prefix match, e.g. `template:` or `exists`
          schema: { type: string }
      responses:
        "200":
          description: Run and results
          content:
            application/json:
              schema:
                type: object
                required: [run, results]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/Result" }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{id}/report:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Runs]
      operationId: getCxRunReport
      summary: The run as a report - JSON, or a printable HTML page
      description: >-
        Per equipment, failures first, with symptoms and candidate causes,
        plus the project's issues log once it has one. `format=html` is a
        single self-contained page (no script, nothing loaded) meant for
        printing or saving as PDF from the browser.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, html], default: json }
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
            text/html:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/gaps:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Templates]
      operationId: getCxGaps
      summary: Inventory gaps against the expected-point templates, now
      description: >-
        Evaluates the current inventory against
        `ontology/cx-expected-points.ttl` without starting a run: per
        equipment and template, the requirements nothing satisfies.
      responses:
        "200":
          description: Gaps
          content:
            application/json:
              schema:
                type: object
                required: [equipment, without_template]
                properties:
                  equipment:
                    type: array
                    items:
                      type: object
                      required: [equip_uri, dis, template, matched, expected, missing]
                      properties:
                        equip_uri: { type: string }
                        dis: { type: string }
                        brickClass: { type: [string, "null"] }
                        template: { type: string }
                        matched: { type: integer }
                        expected: { type: integer }
                        missing:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string }
                              classes: { type: array, items: { type: string } }
                              severity: { type: string }
                              message: { type: string }
                  without_template:
                    type: array
                    items: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
  /equipment-status:
    get:
      tags: [Runs]
      operationId: getCxEquipmentStatus
      summary: One Cx verdict per equipment, from each visible project's latest completed run
      description: >-
        What the equipment tree's Cx dot shows. Keyed by equipment URI; any
        failing check makes the equipment `fail`. Filtered by the caller's
        scope.
      responses:
        "200":
          description: Equipment URI to verdict
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { $ref: "#/components/schemas/EquipVerdict" }
  /projects/{id}/issues:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Issues]
      operationId: listCxIssues
      summary: The project's issues log
      description: >-
        Filtered by the caller's scope. Reading also expires accepted risks
        whose review_by has passed (the issue reopens).
      parameters:
        - name: status
          in: query
          description: Comma-separated statuses
          schema: { type: string }
      responses:
        "200":
          description: Issues, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Issues]
      operationId: createCxIssue
      summary: Open an issue by hand, or from a failing result (operator)
      description: >-
        With `from_result`, the issue is tied to that check and subject and
        closes only when a later run passes it. Without, it's a manual issue
        that closes by hand.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                equip_uri: { type: string }
                severity: { $ref: "#/components/schemas/IssueSeverity" }
                assignee: { type: string }
                from_result:
                  type: object
                  required: [run_id, check_id, subject]
                  properties:
                    run_id: { type: string }
                    check_id: { type: string }
                    subject: { type: string }
      responses:
        "201":
          description: The issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An active issue already tracks this check and subject (`issue_id`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  issue_id: { type: [string, "null"] }
  /projects/{id}/issues/import:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Issues]
      operationId: importCxIssues
      summary: Import external issues and punch items (operator)
      description: >-
        CSV text or a JSON list from CxAlloy, Facility Grid or a
        spreadsheet. Columns are matched by common names (id / issue #,
        title / name, description, status, assignee / responsible party,
        equipment / asset / tag, priority / severity, location, created).
        Each item keeps its source system and id: importing the same file
        again updates those issues instead of duplicating them. Equipment
        text is matched to an inventory URI when exactly one equipment's
        name fits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, description: "The system the items came from, e.g. cxalloy" }
                csv: { type: string }
                items: { type: array, items: { type: object } }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema:
                type: object
                required: [source, created, updated, unchanged, unmatched_equipment]
                properties:
                  source: { type: string }
                  created: { type: integer }
                  updated: { type: integer }
                  unchanged: { type: integer }
                  unmatched_equipment: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/issues/export:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Issues]
      operationId: exportCxIssues
      summary: Export the issues log as CSV or JSON
      description: >-
        `shape=cxalloy` and `shape=facilitygrid` name the columns the way
        those tools' spreadsheet imports usually do (best effort: map
        columns in the tool's import dialog if its template differs).
        Spreadsheet formula characters at the start of a CSV cell are
        quoted out.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
        - { name: shape, in: query, schema: { type: string, enum: [baler, cxalloy, facilitygrid], default: baler } }
      responses:
        "200":
          description: The export
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/risks:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Issues]
      operationId: listCxRisks
      summary: Accepted risks, standing (or all with include_revoked=true)
      parameters:
        - { name: include_revoked, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Risks
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - { $ref: "#/components/schemas/Risk" }
                    - type: object
                      properties:
                        issue: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{id}/issues:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Issues]
      operationId: createCxIssuesFromRun
      summary: Open an issue for each failing result no active issue tracks yet (operator)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                check_prefix: { type: string, description: "e.g. template: or pair:" }
                equip_uri: { type: string }
                severity: { type: string, enum: [required, expected, optional] }
      responses:
        "200":
          description: Opened issue ids, and how many failures already had one
          content:
            application/json:
              schema:
                type: object
                required: [opened, already_tracked]
                properties:
                  opened: { type: array, items: { type: string } }
                  already_tracked: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
  /issues/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Issues]
      operationId: getCxIssue
      summary: An issue with its events and every risk ever accepted on it
      responses:
        "200":
          description: The issue
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Issue" }
                  - type: object
                    required: [events, risks]
                    properties:
                      events: { type: array, items: { $ref: "#/components/schemas/Event" } }
                      risks: { type: array, items: { $ref: "#/components/schemas/Risk" } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Issues]
      operationId: updateCxIssue
      summary: Change status, assignee, severity or title, or add a note (operator)
      description: >-
        Status moves between open, in_progress and ready_for_retest freely;
        moving to ready_for_retest by hand claims the fix (event
        fix.claimed, resolved_at = now). Evidence resolves, only a person
        closes (#86): for an issue tied to a check, `closed` is refused
        (409) until it is ready_for_retest *and* a retest has passed - a
        later run or procedure test run resting on data from after
        resolved_at (`retest`). The close cites that retest (closed_run,
        event `close`). Manual and imported issues close by hand. An issue
        under an accepted risk can't change status until the risk is
        revoked.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [open, in_progress, ready_for_retest, closed] }
                assignee: { type: [string, "null"] }
                severity: { $ref: "#/components/schemas/IssueSeverity" }
                title: { type: string }
                note: { type: string }
      responses:
        "200":
          description: The issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /issues/{id}/events:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Issues]
      operationId: listCxIssueEvents
      summary: The issue's audit trail, newest first
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
  /issues/{id}/risk:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Issues]
      operationId: acceptCxRisk
      summary: Accept the issue as a risk (admin)
      description: >-
        Not a fault and not a closed issue. While the risk stands, the check
        failing again is recorded against it rather than reopening the
        issue. Once `review_by` passes, the risk lapses and the issue
        reopens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, review_by]
              properties:
                reason: { type: string }
                review_by: { type: string, format: date }
      responses:
        "201":
          description: The risk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Risk" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /risks/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    delete:
      tags: [Issues]
      operationId: revokeCxRisk
      summary: Revoke an accepted risk; the issue reopens (admin)
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /procedure-templates:
    get:
      tags: [Procedures]
      operationId: listCxProcedureTemplates
      summary: Seed start-up and power-on procedures (AHU, VAV, FCU, chiller, boiler, pump)
      responses:
        "200":
          description: Templates, in the same shape a project's procedure takes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProcedureSpec" }
  /projects/{id}/procedures:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Procedures]
      operationId: listCxProcedures
      summary: The project's test procedures
      parameters:
        - { name: include_archived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Procedures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Procedure" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Procedures]
      operationId: createCxProcedure
      summary: Add a procedure - your own, one seed template, or every seed (operator)
      description: >-
        Body is a procedure (ProcedureSpec), or `{"template": "<id>"}` (with
        optional name, equip_uris, window_hours, schedule, status
        overrides), or `{"seed": "all"}` to add every seed the project
        doesn't have yet (answers a list).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/ProcedureSpec" }
                - type: object
                  required: [template]
                  properties: { template: { type: string } }
                - type: object
                  required: [seed]
                  properties: { seed: { type: string, enum: [all] } }
      responses:
        "201":
          description: The procedure (or, for seed=all, the list added)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/Procedure" }
                  - { type: array, items: { $ref: "#/components/schemas/Procedure" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /procedures/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Procedures]
      operationId: getCxProcedure
      summary: A procedure
      responses:
        "200":
          description: The procedure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Procedure" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Procedures]
      operationId: updateCxProcedure
      summary: Change any field of a procedure (operator)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcedureSpec" }
      responses:
        "200":
          description: The procedure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Procedure" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Procedures]
      operationId: archiveCxProcedure
      summary: Archive a procedure; its test runs are kept (admin)
      responses:
        "204": { description: Archived }
        "404": { $ref: "#/components/responses/NotFound" }
  /procedures/{id}/runs:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Procedures]
      operationId: listCxTestRuns
      summary: The procedure's test runs, newest first (without per-equipment detail)
      responses:
        "200":
          description: Test runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TestRun" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Procedures]
      operationId: createCxTestRun
      summary: Run the procedure passively over history (operator)
      description: >-
        "Powered on / started at T": `started_at` is T (default: `hours`
        before now) and the procedure is judged on history from T for
        `hours` (default the procedure's window_hours), cut off at now.
        Nothing is commanded. Asynchronous like verification runs: 202,
        then poll GET /test-runs/{id}. The result is diffed per equipment
        and step against the procedure's previous completed test run.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                started_at: { type: string, format: date-time }
                hours: { type: number, exclusiveMinimum: 0, maximum: 744 }
      responses:
        "202":
          description: The queued test run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Archived, or a test run of this procedure is already in progress (`test_run_id`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  test_run_id: { type: [string, "null"] }
  /test-runs/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Procedures]
      operationId: getCxTestRun
      summary: A test run with its per-equipment, per-step verdicts and the diff against the previous one
      responses:
        "200":
          description: The test run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{id}/diff:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Runs]
      operationId: getCxRunDiff
      summary: Reconcile a run against an earlier one, per check and subject
      description: >-
        States, from PR #5's reconcile: new, gone, resolved (now passes),
        regressed (now fails), changed, still_failing. Default
        `against`: the project's previous completed run.
      parameters:
        - { name: against, in: query, schema: { type: string } }
      responses:
        "200":
          description: The diff
          content:
            application/json:
              schema:
                type: object
                required: [run_id, against, counts, changes]
                properties:
                  run_id: { type: string }
                  against: { type: [string, "null"] }
                  counts: { type: object, additionalProperties: { type: integer } }
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        check_id: { type: string }
                        subject: { type: string }
                        equip_uri: { type: [string, "null"] }
                        before: { type: [string, "null"] }
                        after: { type: [string, "null"] }
                        state: { type: string }
                        symptom: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/spec:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Spec]
      operationId: listCxSpecItems
      summary: The project's spec items (equipment, points, sequences)
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [equipment, point, sequence] } }
        - { name: status, in: query, schema: { type: string, enum: [proposed, accepted, rejected] } }
        - { name: document_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Spec items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpecItem" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/spec/import:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Spec]
      operationId: importCxSpec
      summary: Import an equipment schedule or point list, CSV or XLSX (operator)
      description: >-
        Columns are matched by common names (Tag / Mark, Type, Equipment,
        Point Name, Units, Location, ...). A row with a tag is equipment; a
        row with an equipment column and a point name is a point (or force
        it with `kind`). The type column, or else the tag's letters (AHU,
        VAV, FCU, CH, B, P, ...), gives the Brick class; inferred classes
        say so in properties.class_basis. Items are `accepted` (a person
        supplied the file) unless `status` is `proposed`. XLSX needs the
        server's cx-spec extra (openpyxl).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                format: { type: string, enum: [csv, xlsx], default: csv }
                data: { type: string, description: CSV text, or the XLSX file as base64 }
                filename: { type: string }
                kind: { type: string, enum: [auto, equipment, points], default: auto }
                status: { type: string, enum: [accepted, proposed], default: accepted }
      responses:
        "201":
          description: What was imported
          content:
            application/json:
              schema:
                type: object
                required: [document_id, items, rows, skipped_rows, unclassified]
                properties:
                  document_id: { type: string }
                  items: { type: integer }
                  rows: { type: integer }
                  skipped_rows: { type: integer }
                  unclassified: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/spec/extract:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Spec]
      operationId: extractCxSpec
      summary: Read a PDF (schedules, point lists, sequences) into proposed spec items (operator)
      description: >-
        Asynchronous: 202 with the document, then poll GET
        /spec-documents/{id}. Every extracted item is `proposed` and cites
        its page and the verbatim text it was read from; nothing is used
        (alignment ignores proposals) until a person accepts it. The PDF
        is held in memory for the extraction only and never stored. Tables
        (equipment schedules, point lists) are read locally first; the
        rest goes to the model BALER_LLM_PROVIDER names - anthropic (the
        llm extra, ANTHROPIC_API_KEY, BALER_CX_MODEL), openai (any
        OpenAI-compatible endpoint, BALER_LLM_BASE_URL/BALER_LLM_MODEL; it
        gets the PDF's text, and items whose quote isn't on the cited page
        are dropped), or none (tables only, document method `table`). 501
        when the configured provider can't run on this server. Up to 30 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: The PDF as base64 }
                filename: { type: string }
                media_type: { type: string, enum: [application/pdf] }
      responses:
        "202":
          description: The queued document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { description: The llm extra isn't installed on the server }
  /projects/{id}/spec/documents:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Spec]
      operationId: listCxSpecDocuments
      summary: Imported and extracted documents, newest first
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpecDocument" }
        "404": { $ref: "#/components/responses/NotFound" }
  /spec-documents/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Spec]
      operationId: getCxSpecDocument
      summary: An imported or extracted document (poll this after .../spec/extract)
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecDocument" }
        "404": { $ref: "#/components/responses/NotFound" }
  /spec-items/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    patch:
      tags: [Spec]
      operationId: reviewCxSpecItem
      summary: Accept, correct or reject a spec item (operator)
      description: Corrections keep what was proposed in source.corrected_from.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [proposed, accepted, rejected] }
                kind: { type: string, enum: [equipment, point, sequence] }
                tag: { type: string }
                name: { type: string }
                equip_tag: { type: [string, "null"] }
                brick_class: { type: [string, "null"] }
                properties: { type: object }
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/spec/review:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Spec]
      operationId: reviewCxSpecItems
      summary: Accept or reject many spec items at once (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids: { type: array, items: { type: string } }
                status: { type: string, enum: [accepted, rejected] }
      responses:
        "200":
          description: How many changed
          content:
            application/json:
              schema:
                type: object
                properties: { updated: { type: integer } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/alignment:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Spec]
      operationId: getCxAlignment
      summary: Accepted spec equipment against today's inventory, with deviations
      description: >-
        Computed on request: tag evidence (delimiters, case, leading zeros,
        known abbreviations) and Brick class agreement give each mapping a
        confidence - confirmed (a person), high, medium, low (with named
        alternatives) or unmatched. Deviations: spec_not_found (read per
        phase), type_mismatch, duplicate_claim, unspecified_in_field.
        Confirmed and high mappings list their points: present,
        specified_absent (never invented) and unspecified_present.
      responses:
        "200":
          description: The alignment
          content:
            application/json:
              schema:
                type: object
                required: [mappings, deviations, counts]
                properties:
                  mappings:
                    type: array
                    items:
                      type: object
                      required: [spec_item_id, spec_tag, equip_uri, confidence, basis, alternatives]
                      properties:
                        spec_item_id: { type: string }
                        spec_tag: { type: string }
                        equip_uri: { type: [string, "null"] }
                        confidence: { type: string, enum: [confirmed, high, medium, low, unmatched] }
                        basis: { type: array, items: { type: object } }
                        alternatives: { type: array, items: { type: object } }
                        decision: { type: [object, "null"] }
                        points: { type: array, items: { type: object } }
                  deviations: { type: array, items: { type: object } }
                  counts: { type: object, additionalProperties: { type: integer } }
                  proposed_items: { type: integer, description: Proposals still waiting for a person }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/alignment/decisions:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Spec]
      operationId: decideCxMapping
      summary: Confirm or reject a spec item's equipment (operator)
      description: >-
        With `write_back` (confirmations only) the mapping is written into
        the graph through record_edit and audited in record_edits: the spec
        tag as the `cxSpecTag` tag, and the spec's Brick class when the
        equipment has none (or always, with `write_class`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec_item_id, equip_uri, status]
              properties:
                spec_item_id: { type: string }
                equip_uri: { type: string }
                status: { type: string, enum: [confirmed, rejected] }
                write_back: { type: boolean }
                write_class: { type: boolean }
      responses:
        "201":
          description: The decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mapping" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /mappings/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    delete:
      tags: [Spec]
      operationId: undoCxMapping
      summary: Undo a decision (operator); a graph write-back stays and is undone in the record editor
      responses:
        "204": { description: Undone }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/faults:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Faults]
      operationId: listCxMirroredFaults
      summary: Open faults this project mirrored into the shared faults table
      description: >-
        Opt in with settings.fault_mirroring. Rule ids are `cx:<check_id>`
        and every fault is on a real urn:point:/urn:equip: URI, so the
        Alarms page, fault_api's scope filter and webhooks treat it like
        any other fault.
      responses:
        "200":
          description: Faults
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    rule_id: { type: string }
                    point_uri: { type: string }
                    status: { type: string }
                    started_at: { type: string, format: date-time }
                    ended_at: { type: [string, "null"], format: date-time }
                    detail: { type: [object, "null"] }
                    severity: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/faults/ingest:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Faults]
      operationId: ingestCxFaults
      summary: Faults into the issues log (operator)
      description: >-
        `{"source": "fault_detector"}` takes the open faults on this
        project's equipment from the shared faults table (never Cx's own
        cx: mirrors) and closes issues whose fault has since resolved.
        `{"source": "<tool>", "items": [...]}` takes an outside FDD tool's
        faults. Issues get source `fdd:<source>` and the fault's id, so a
        repeat ingest doesn't duplicate. Faults on equipment outside the
        project (or the caller's scope) are counted, not imported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,40}$" }
                items:
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
                      point_uri: { type: string }
                      equip_uri: { type: string }
                      rule: { type: string }
                      title: { type: string }
                      message: { type: string }
                      severity: { type: string, enum: [critical, warning, info] }
                      started_at: { type: string }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema:
                type: object
                required: [source, created, reopened, resolved, outside_project]
                properties:
                  source: { type: string }
                  created: { type: integer }
                  reopened: { type: integer }
                  resolved: { type: integer }
                  outside_project: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /active/status:
    get:
      tags: [Active tests]
      operationId: getCxActiveStatus
      summary: Whether this deployment allows active tests, and which are running
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [writes_allowed, executor, level, running]
                properties:
                  writes_allowed: { type: boolean, description: "BALER_CX_ALLOW_WRITES=1 on commissioning_api" }
                  executor: { type: boolean, description: A point_write route is configured }
                  level: { type: integer, description: The priority Cx writes at (8, manual operator) }
                  running: { type: array, items: { type: string } }
  /active/kill:
    post:
      tags: [Active tests]
      operationId: killCxActiveRuns
      summary: Kill switch - abort every running active test in your org and relinquish its writes now (admin)
      responses:
        "200":
          description: What was stopped and relinquished
          content:
            application/json:
              schema:
                type: object
                properties:
                  aborted: { type: array, items: { type: string } }
                  relinquished: { type: array, items: { type: string } }
        "403": { description: Not an admin }
  /projects/{id}/active-runs:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Active tests]
      operationId: listCxActiveRuns
      summary: The project's active test runs, newest first
      responses:
        "200":
          description: Active runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActiveRun" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Active tests]
      operationId: planCxActiveRun
      summary: Plan an active test - the dry run (admin)
      description: >-
        Lists every write (point, value, priority 8, hold, expires_at - never
        after the window end) and commands nothing. `command_response` is
        rung 4: for each command/status pair on the equipment, command on
        and off and expect the status to follow within response_minutes.
        `custom` takes steps: [{writes: [{point, value}], hold_minutes,
        expect: [{point, equals | min | max}], within_minutes}]. Written
        points must be this equipment's and marked `writable`. The window
        is at most 8 h.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equip_uri, window_start, window_end]
              properties:
                equip_uri: { type: string }
                window_start: { type: string, format: date-time }
                window_end: { type: string, format: date-time }
                kind: { type: string, enum: [command_response, custom], default: command_response }
                response_minutes: { type: number }
                steps: { type: array, items: { type: object } }
      responses:
        "201":
          description: The planned run (status planned)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ActiveRun" }
                  - type: object
                    properties:
                      writes_allowed: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Not an admin }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /active-runs/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Active tests]
      operationId: getCxActiveRun
      summary: An active run, with every write and relinquish it made
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /active-runs/{id}/confirm:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Active tests]
      operationId: confirmCxActiveRun
      summary: Start a planned run (admin, inside its window, with the switch on)
      description: >-
        The body repeats the run's id, as the confirmation of the plan.
        403 when BALER_CX_ALLOW_WRITES isn't 1; 409 outside the window or
        if the run isn't planned. Captures the before-state, then runs in
        the background: each step writes, watches, and relinquishes in a
        finally; the run relinquishes everything it wrote in an outer
        finally, and a sweeper relinquishes any Cx level left behind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: This run's id }
      responses:
        "202":
          description: Confirmed and starting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Not an admin, or active tests are switched off" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: No point_write route configured }
  /active-runs/{id}/abort:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Active tests]
      operationId: abortCxActiveRun
      summary: Kill switch for one run (operator) - a running run stops and relinquishes; a planned one is cancelled
      responses:
        "202":
          description: The run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/agent/sessions:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Agent]
      operationId: listCxAgentSessions
      summary: The project's agent conversations, newest first
      responses:
        "200":
          description: Sessions (without transcripts)
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Agent]
      operationId: startCxAgentSession
      summary: Start a conversation with the commissioning agent (operator)
      description: >-
        A tool-use loop over the Cx capabilities (inventory, runs,
        templates and gaps, issues, procedures and test runs, spec items
        and alignment, active-test status). It reads and runs passive work
        itself; everything else it proposes (GET .../agent/proposals) for a
        person to accept. It works with the starter's org and sites only.
        Asynchronous: 202, then poll GET /agent-sessions/{id} until status
        isn't `working`. Needs a model: BALER_LLM_PROVIDER=anthropic (the
        llm extra, ANTHROPIC_API_KEY, BALER_CX_MODEL) or openai (an
        OpenAI-compatible endpoint whose model supports function calling;
        a model that can't call tools fails the session with that error).
        501 with provider none or an incomplete configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties: { message: { type: string } }
      responses:
        "202":
          description: The session, working on the message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { description: The llm extra isn't installed on the server }
  /agent-sessions/{id}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Agent]
      operationId: getCxAgentSession
      summary: A conversation - status, last reply, readable transcript
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "404": { $ref: "#/components/responses/NotFound" }
  /agent-sessions/{id}/messages:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Agent]
      operationId: messageCxAgentSession
      summary: Send the next message (operator; the session's starter only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties: { message: { type: string } }
      responses:
        "202":
          description: Working on it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Not this session's starter }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Still working on the last message }
  /projects/{id}/agent/proposals:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Agent]
      operationId: listCxAgentProposals
      summary: What the agent proposed, newest first
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [proposed, accepted, rejected, failed] } }
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentProposal" }
        "404": { $ref: "#/components/responses/NotFound" }
  /agent-proposals/{id}/accept:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Agent]
      operationId: acceptCxAgentProposal
      summary: Carry out a proposal as yourself (operator; an active test needs an admin and stays planned)
      responses:
        "200":
          description: The proposal, accepted, with what was done in `result`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProposal" }
        "403": { description: Your role can't carry this one out }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /agent-proposals/{id}/reject:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Agent]
      operationId: rejectCxAgentProposal
      summary: Reject a proposal (operator)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { note: { type: string } }
      responses:
        "200":
          description: The proposal, rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentProposal" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /templates:
    get:
      tags: [Templates]
      operationId: listCxTemplates
      summary: Expected-point templates, from ontology/cx-expected-points.ttl
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Template" }
  /openapi.yaml:
    get:
      operationId: getCxOpenAPI
      summary: This OpenAPI document
      responses:
        "200": { description: YAML OpenAPI spec }
  /docs:
    get:
      operationId: getCxDocs
      summary: Interactive docs for this API
      responses:
        "200": { description: HTML }
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not via the gateway, or no verifiable token with an org
    Conflict:
      description: The change breaks a rule (the message says which)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such project/run, or not visible to the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Status:
      type: string
      enum: [pass, fail, inconclusive, not_applicable]
    Settings:
      type: object
      properties:
        window_hours: { type: number, exclusiveMinimum: 0, maximum: 744 }
        prefixes:
          type: array
          maxItems: 50
          items: { type: string }
          description: >-
            Topic prefixes the project covers, e.g. ["fbf/hospital-a"] for one
            building (Baler#75). Narrows the project's inventory, runs, issues and
            status to equipment under them, on top of the site (if any) and the
            caller's own scope - it never shows more than the caller can see.
        gl36:
          type: object
          description: >-
            Opt-in sequence verification with vendored PNNL ConStrain items
            (Cx 3, Baler#39; needs the server installed with the `cx-gl36`
            extra, else 400). Each key enables one item - `zone_deadband`,
            `sat_reset`, `chw_reset`, `hw_reset` - and holds its design
            parameters (ConStrain names, deg C unless `unit` is `F`), plus
            optional `step_minutes` (resampling grid, default 5). See
            todo/cx3-constrain-gl36-spike.md.
          additionalProperties:
            type: object
            properties:
              unit: { type: string, enum: [C, F] }
              step_minutes: { type: number, minimum: 1, maximum: 60 }
              max_fail_fraction:
                type: number
                minimum: 0
                exclusiveMaximum: 1
                description: >-
                  The project's pass threshold: the item passes while no more
                  than this share of tested steps fail. 0 (default) is
                  ConStrain's own rule - any failing step fails it.
            additionalProperties: { type: number }
          example:
            hw_reset: { unit: F, temperature_air_outdoor_min: 20, temperature_air_outdoor_max: 60,
                        temperature_water_hot_setpoint_max: 180, temperature_water_hot_setpoint_min: 140 }
        fault_mirroring:
          type: object
          description: >-
            Cx 8: mirror failing checks into the shared faults table as
            `cx:<check_id>` on real URIs. `equipment` confirmed (default:
            only equipment a person confirmed against the spec) or all;
            `checks` id prefixes (default exists, live, pair:, gl36:, cx:,
            ladder); `severity` of the faults. Accepted risks suppress it.
          properties:
            enabled: { type: boolean }
            equipment: { type: string, enum: [confirmed, all] }
            checks: { type: array, items: { type: string } }
            severity: { type: string, enum: [critical, warning, info] }
          additionalProperties: false
        phase_gates:
          type: string
          enum: [warn, block, "off"]
          description: >-
            What an unmet phase gate does (#86): warn (default; the move goes
            ahead and the phase.set event records what was unmet), block
            (409 unless the request sets override with a note), or off.
        schedule:
          type: [object, "null"]
          description: A verification run this often, as the project's org on its site (Cx 6)
          properties: { every_hours: { type: number, minimum: 1, maximum: 744 } }
        ladder:
          type: object
          description: >-
            Rung 2-3 knobs for this project (defaults in
            commissioning/ladder.py DEFAULTS): min_samples, flat_epsilon,
            pair_tolerance_minutes, status_agreement_min, tail_fraction, and
            `tolerances` {pair key: number} overriding a pair's own tolerance
            (zone_air_temperature and supply_air_temperature 3 degF,
            supply_air_static_pressure 0.3, air_flow 0.2 of setpoint).
          properties:
            min_samples: { type: number, minimum: 1 }
            flat_epsilon: { type: number, minimum: 0 }
            pair_tolerance_minutes: { type: number, minimum: 0.1, maximum: 1440 }
            status_agreement_min: { type: number, minimum: 0, maximum: 1 }
            tail_fraction: { type: number, minimum: 0.01, maximum: 1 }
            tolerances: { type: object, additionalProperties: { type: number, minimum: 0 } }
          additionalProperties: false
        economizer:
          type: object
          description: >-
            Baler's own air-side economizer checks (`cx:econ_high_limit`,
            90.1 6.5.1.1.3; `cx:econ_integrated`, 90.1 6.5.1.3) on every
            AHU. `high_limit` is the climate zone's fixed dry-bulb limit.
            Points are found by Brick class, markers or name, and can be
            bound explicitly per equipment in `points`.
          required: [high_limit]
          properties:
            high_limit: { type: number }
            unit: { type: string, enum: [C, F] }
            min_position: { type: number, minimum: 0, maximum: 100, description: "Damper minimum, % open (default 20)" }
            position_tolerance: { type: number }
            temperature_tolerance: { type: number }
            cooling_threshold: { type: number, description: "Cooling output above this (%) counts as on; binary points use on/off" }
            max_fail_fraction: { type: number, minimum: 0, maximum: 0.999 }
            step_minutes: { type: number, minimum: 1, maximum: 60 }
            checks: { type: array, items: { type: string, enum: [high_limit, integrated] } }
            points:
              type: object
              additionalProperties:
                type: object
                properties:
                  oat: { type: string }
                  oa_damper: { type: string }
                  cooling: { type: string }
                  rat: { type: string }
      additionalProperties: true
    PhaseInput:
      type: object
      required: [key]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{0,39}$" }
        name: { type: string }
        status: { type: string, enum: [pending, active, complete, skipped] }
    Phase:
      type: object
      required: [key, name, position, status, started_at, completed_at]
      properties:
        key: { type: string }
        name: { type: string }
        position: { type: integer }
        status: { type: string, enum: [pending, active, complete, skipped] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    Project:
      type: object
      required: [id, org_id, site_id, name, settings, phase, current_phase, phases, created_at, updated_at, archived_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        site_id: { type: [string, "null"] }
        name: { type: string }
        settings: { $ref: "#/components/schemas/Settings" }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
        phase:
          type: [string, "null"]
          description: The active phase's key - the same field POST /projects takes.
        current_phase: { type: [string, "null"], description: Same as `phase` (kept for existing clients) }
        phases:
          type: array
          items: { $ref: "#/components/schemas/Phase" }
    Event:
      type: object
      required: [id, ts, action, detail]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        action: { type: string }
        user_sub: { type: [string, "null"] }
        actor: { type: string, enum: [user, system], description: "system: runs and reconcile; user: a named person" }
        user_email: { type: [string, "null"] }
        detail: { type: object }
    InventoryPoint:
      type: object
      required: [id, dis, brickClass, tags, spec]
      properties:
        id: { type: string }
        point: { type: string }
        dis: { type: string }
        unit: { type: [string, "null"] }
        kind: { type: [string, "null"] }
        brickClass: { type: [string, "null"] }
        tags: { type: array, items: { type: string }, description: Haystack markers }
        equip: { type: [string, "null"] }
        equipDis: { type: [string, "null"] }
        spec: { type: [string, "null"], description: The ph Xeto spec the point fits }
    InventoryEquip:
      type: object
      required: [id, dis, brickClass, brickClasses, tags, spec, points]
      properties:
        id: { type: string }
        dis: { type: string }
        brickClass: { type: [string, "null"] }
        brickClasses: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        spec: { type: [string, "null"] }
        templates: { type: array, items: { type: string } }
        points:
          type: array
          items: { $ref: "#/components/schemas/InventoryPoint" }
    Run:
      type: object
      required: [id, project_id, phase, status, started_at, finished_at, window_start, window_end, scope, summary, progress, error]
      properties:
        id: { type: string }
        project_id: { type: string }
        phase: { type: [string, "null"], description: The project's phase when the run was requested }
        status:
          type: string
          enum: [queued, running, completed, failed]
          description: >-
            A run still queued or running when the API restarts is marked
            failed at startup (error starts with `interrupted`).
        started_at: { type: string, format: date-time, description: When the run was requested; the window ends here }
        finished_at: { type: [string, "null"], format: date-time, description: Null until completed or failed }
        progress:
          type: [object, "null"]
          description: While running, roughly every 2 s; null otherwise
          properties:
            stage: { type: string, enum: [starting, inventory, history, checks, gl36, economizer] }
            equipment_done: { type: integer }
            equipment_total: { type: [integer, "null"] }
            points: { type: [integer, "null"] }
        error: { type: [string, "null"], description: Why it failed }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        triggered_by: { type: [string, "null"] }
        scope:
          type: object
          description: What was in scope, so the run is reproducible
        summary:
          type: [object, "null"]
          description: Null until completed
          required: [equipment, points, by_status, by_check, freshness]
          properties:
            ladder:
              type: object
              description: How many equipment reached each rung (0-3)
              properties:
                highest_rung_passed: { type: object, additionalProperties: { type: integer } }
                rungs: { type: object }
            equipment: { type: integer }
            points: { type: integer }
            equipment_with_template: { type: integer }
            equipment_without_template: { type: array, items: { type: object } }
            unclassified_points: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            by_check: { type: object }
            required_missing: { type: integer }
            freshness: { type: string }
            phase: { type: [string, "null"] }
            window_hours: { type: number }
    Result:
      type: object
      required: [equip_uri, check_id, subject, status, evidence]
      properties:
        equip_uri: { type: string }
        check_id:
          type: string
          description: >-
            `exists` (rung 1, per point), `live` (rung 2, per sensor),
            `pair:<key>` (rung 3, subject `a|b`), `ladder` (per equipment:
            evidence.highest_rung_passed, rungs, fell_to_rung),
            `template:<requirement>`, or `gl36:<item>` (per equipment, when
            the project enables ConStrain items in settings.gl36).
        subject: { type: string, description: Point or equipment the result is about }
        status: { $ref: "#/components/schemas/Status" }
        severity: { type: [string, "null"], enum: [required, expected, optional, null] }
        symptom: { type: [string, "null"] }
        candidates:
          type: array
          items:
            type: object
            properties:
              cause: { type: string }
              distinguish: { type: string }
        evidence: { type: object }
    Criterion:
      type: object
      description: >-
        Either `check` (a Cx check id or prefix - `exists`, `live`,
        `pair:`, `template:`, `gl36:hw_reset`, `cx:econ_*` - optionally
        filtered by severity, pair_kind or point_class; `strict` counts
        inconclusive as failing) or `range` ({min, max, unit}) over a
        point_class's points or one named `point`, e.g. a derivation
        output. A criterion matching nothing is not_applicable unless
        `required`.
      properties:
        check: { type: string }
        strict: { type: boolean }
        severity: { type: string, enum: [required, expected, optional] }
        pair_kind: { type: string, enum: [cmd_status, track] }
        point_class: { type: string }
        point: { type: string }
        required: { type: boolean }
        range:
          type: object
          properties:
            min: { type: number }
            max: { type: number }
            unit: { type: string, enum: [C, F] }
    ProcedureSpec:
      type: object
      required: [name, kind, equip_class, steps]
      properties:
        name: { type: string }
        kind: { type: string, enum: [power_on, startup, functional, seasonal] }
        equip_class: { type: string, description: Brick equipment class, subclass-aware }
        equip_uris: { type: [array, "null"], items: { type: string } }
        description: { type: string }
        window_hours: { type: number }
        schedule:
          type: [object, "null"]
          properties: { every_hours: { type: number, minimum: 1, maximum: 744 } }
        status: { type: string, enum: [draft, active, archived] }
        template: { type: [string, "null"] }
        steps:
          type: array
          items:
            type: object
            required: [criteria]
            properties:
              id: { type: string }
              title: { type: string }
              instruction: { type: string }
              criteria: { type: array, items: { $ref: "#/components/schemas/Criterion" } }
    Procedure:
      allOf:
        - { $ref: "#/components/schemas/ProcedureSpec" }
        - type: object
          required: [id, project_id, created_at, updated_at]
          properties:
            id: { type: string }
            project_id: { type: string }
            created_by: { type: [string, "null"] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    TestRun:
      type: object
      required: [id, project_id, procedure_id, status, started_at, window_end, requested_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        procedure_id: { type: string }
        phase: { type: [string, "null"] }
        status: { type: string, enum: [queued, running, completed, failed] }
        started_at: { type: string, format: date-time, description: '"Powered on / started at": the window starts here' }
        window_end: { type: string, format: date-time }
        requested_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        triggered_by: { type: [string, "null"], description: "The user, or `schedule`" }
        scope: { type: object }
        procedure: { type: object, description: The procedure as it was run }
        equipment:
          type: [array, "null"]
          items:
            type: object
            properties:
              equip_uri: { type: string }
              dis: { type: [string, "null"] }
              status: { $ref: "#/components/schemas/Status" }
              steps:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    status: { $ref: "#/components/schemas/Status" }
                    criteria: { type: array, items: { type: object } }
        summary: { type: [object, "null"] }
        previous_id: { type: [string, "null"] }
        diff:
          type: [object, "null"]
          properties:
            counts: { type: object, additionalProperties: { type: integer } }
            changes: { type: array, items: { type: object } }
        error: { type: [string, "null"] }
    SpecItem:
      type: object
      required: [id, project_id, kind, tag, name, brick_class, properties, source, status]
      properties:
        id: { type: string }
        project_id: { type: string }
        document_id: { type: [string, "null"] }
        kind: { type: string, enum: [equipment, point, sequence] }
        tag: { type: string }
        name: { type: string }
        equip_tag: { type: [string, "null"] }
        brick_class: { type: [string, "null"] }
        properties: { type: object }
        source:
          type: object
          description: document, page, quote (extraction) or row (import), method, model, quote_verified (the quote was found in the PDF text), cited_page (when the quote was on another page), corrected_from
        confidence: { type: [number, "null"] }
        status: { type: string, enum: [proposed, accepted, rejected] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
    SpecDocument:
      type: object
      required: [id, project_id, filename, media_type, size, sha256, method, status, items]
      properties:
        id: { type: string }
        project_id: { type: string }
        filename: { type: string }
        media_type: { type: string }
        size: { type: integer }
        sha256: { type: string }
        method: { type: string, enum: [llm, table] }
        status: { type: string, enum: [queued, running, completed, failed] }
        items: { type: integer }
        info: { type: [object, "null"], description: "model, provider, notes, token usage, dropped (items whose quote wasn't in the PDF)" }
        error: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    Mapping:
      type: object
      required: [id, spec_item_id, equip_uri, status]
      properties:
        id: { type: string }
        project_id: { type: string }
        spec_item_id: { type: string }
        equip_uri: { type: [string, "null"] }
        confidence: { type: string }
        basis: { type: array, items: { type: object } }
        alternatives: { type: array, items: { type: object } }
        status: { type: string, enum: [proposed, confirmed, rejected] }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        written_back: { type: [object, "null"] }
        created_at: { type: string, format: date-time }
    ActiveRun:
      type: object
      required: [id, project_id, equip_uri, kind, steps, plan, status, window_start, window_end, writes, results]
      properties:
        id: { type: string }
        project_id: { type: string }
        equip_uri: { type: string }
        kind: { type: string, enum: [command_response, custom] }
        steps: { type: array, items: { type: object } }
        plan:
          type: array
          description: The dry run - every write
          items:
            type: object
            properties:
              step: { type: string }
              point: { type: string }
              value: { type: number }
              level: { type: integer }
              hold_minutes: { type: number }
              expires_at: { type: string, format: date-time }
        status: { type: string, enum: [planned, confirmed, running, completed, failed, aborted, expired, cancelled] }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        confirmed_by: { type: [string, "null"] }
        confirmed_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        before: { type: [object, "null"], description: "latest values and Baler's priority arrays before the first write" }
        writes: { type: array, items: { type: object }, description: Every write and relinquish, in order }
        results: { type: array, items: { type: object } }
        error: { type: [string, "null"] }
        abort_requested: { type: boolean }
    AgentSession:
      type: object
      required: [id, project_id, status, transcript]
      properties:
        id: { type: string }
        project_id: { type: string }
        created_by: { type: [string, "null"] }
        status: { type: string, enum: [idle, working, failed] }
        last_reply: { type: [string, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        transcript:
          type: array
          items:
            type: object
            properties:
              role: { type: string, enum: [user, assistant, tool] }
              text: { type: string }
              tool: { type: string }
              input: { type: [object, "null"] }
              error: { type: string }
    AgentProposal:
      type: object
      required: [id, project_id, kind, payload, reason, status]
      properties:
        id: { type: string }
        project_id: { type: string }
        session_id: { type: [string, "null"] }
        kind: { type: string, enum: [issue, procedure, phase, spec_item, mapping, active_test] }
        payload: { type: object }
        reason: { type: string }
        status: { type: string, enum: [proposed, accepted, rejected, failed] }
        result: { type: [object, "null"] }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    IssueSeverity:
      type: [string, "null"]
      enum: [critical, major, minor, info, null]
    Issue:
      type: object
      required: [id, project_id, equip_uri, check_id, subject, status, title, severity, assignee, detail, source,
                 source_id, created_at, updated_at, closed_at, risk]
      properties:
        id: { type: string }
        project_id: { type: string }
        equip_uri: { type: [string, "null"] }
        check_id: { type: [string, "null"], description: Null for manual and imported issues }
        subject: { type: [string, "null"] }
        status: { type: string, enum: [open, in_progress, ready_for_retest, closed, risk_accepted] }
        title: { type: string }
        severity: { $ref: "#/components/schemas/IssueSeverity" }
        assignee: { type: [string, "null"] }
        detail: { type: object }
        source: { type: string, description: "baler, or the system an imported item came from" }
        source_id: { type: [string, "null"] }
        opened_run: { type: [string, "null"] }
        last_seen_run: { type: [string, "null"] }
        closed_run: { type: [string, "null"], description: The retest (run or test run id) the person's close cited }
        resolved_at:
          type: [string, "null"]
          format: date-time
          description: When passing evidence (or a person claiming the fix) moved it to ready_for_retest
        resolved_by:
          type: [object, "null"]
          description: "{run_id} or {test_run_id} whose pass resolved it, or {user_sub} who claimed the fix"
        retest:
          type: [object, "null"]
          description: >-
            The passing retest since resolved_at: {run_id | test_run_id, kind, at, judged_from}.
            Required before a person can close a check-tied issue.
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        risk:
          oneOf:
            - { $ref: "#/components/schemas/Risk" }
            - { type: "null" }
    PhaseGate:
      type: object
      required: [target, rules, met, unmet]
      properties:
        target: { type: string }
        rules: { type: array, items: { type: string } }
        met: { type: boolean }
        unmet:
          type: array
          items:
            type: object
            required: [rule, message, count, items]
            properties:
              rule:
                type: string
                enum: [verification_run, points_reporting, early_procedures_pass, procedures_pass, no_open_issues,
                       no_unwaived_inconclusive]
              message: { type: string }
              count: { type: integer }
              items: { type: array, items: { type: object }, description: The first 50 offenders }
    Risk:
      type: object
      required: [id, issue_id, reason, review_by, created_at, revoked_at]
      properties:
        id: { type: string }
        issue_id: { type: string }
        accepted_by: { type: [string, "null"] }
        accepted_email: { type: [string, "null"] }
        reason: { type: string }
        review_by: { type: string, format: date }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revoked_by: { type: [string, "null"] }
    EquipVerdict:
      type: object
      required: [status, counts]
      properties:
        status: { $ref: "#/components/schemas/Status" }
        counts: { type: object, additionalProperties: { type: integer } }
        highest_rung_passed: { type: [integer, "null"] }
        run_id: { type: string }
        project_id: { type: string }
        project: { type: string }
        finished_at: { type: [string, "null"] }
    Report:
      type: object
      required: [project, run, equipment, issues]
      properties:
        project: { type: object }
        run: { $ref: "#/components/schemas/Run" }
        equipment:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/EquipVerdict" }
              - type: object
                required: [equip_uri, results]
                properties:
                  equip_uri: { type: string }
                  results: { type: array, items: { $ref: "#/components/schemas/Result" } }
        issues: { type: array, items: { type: object } }
        active_runs: { type: array, items: { type: object }, description: "Cx 9: active tests and every write they made" }
    Template:
      type: object
      required: [id, label, target_class, requirements]
      properties:
        id: { type: string }
        label: { type: string }
        target_class: { type: string }
        requirements:
          type: array
          items:
            type: object
            required: [id, name, classes, severity]
            properties:
              id: { type: string }
              name: { type: string }
              classes: { type: array, items: { type: string } }
              severity: { type: string, enum: [required, expected, optional] }
              message: { type: string }
              haystack_markers: { type: array, items: { type: string } }
              xeto_spec: { type: [string, "null"] }
