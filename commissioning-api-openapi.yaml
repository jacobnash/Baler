  /spaces/{id}/readiness:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Spaces]
      operationId: getCxSpaceReadiness
      summary: Readiness of a room, or of every room under a suite/zone/floor
      description: |
        Ready means every applicable requirement passes over its window, the
        required start-up/functional tests of the serving equipment passed,
        the TAB report is linked, and every open issue is resolved or
        accepted as a risk. No evidence is never a pass: a criterion with
        none is `inconclusive` and the verdict `incomplete`.
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [json, html] } }
      responses:
        "200":
          description: The report (text/html for format=html)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
            text/html:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /test-runs/{id}/manual-results:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Procedures]
      operationId: listCxManualResults
      summary: Every manual result recorded against a test run, oldest first
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ManualResult" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Procedures]
      operationId: recordCxManualResult
      summary: Record a person's pass / fail / N-A for one step on one equipment (operator, a person)
      description: >-
        Baler#275. Always recorded as the signed-in person (sub, email,
        display name, role from the token): there is no field for anyone
        else, and API keys are refused. The step must offer the manual
        method. `client_id` makes an offline resend idempotent (200 with
        the stored row); `observed_at` is when the person checked (at most
        14 days back). The run's statuses, summary and issues update: a
        manual fail opens an issue, a contradiction with the data opens
        one, and a later pass resolves or retests it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [equip_uri, step_id, status]
              additionalProperties: false
              properties:
                equip_uri: { type: string }
                step_id: { type: string }
                status: { type: string, enum: [pass, fail, not_applicable] }
                note: { type: string, maxLength: 4000 }
                witness:
                  type: object
                  required: [name]
                  properties: { name: { type: string }, org: { type: string }, role: { type: string } }
                attachments:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required: [media_type, data]
                    properties:
                      filename: { type: string }
                      media_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, application/pdf, text/plain] }
                      data: { type: string, description: base64, at most 5 MB decoded }
                client_id: { type: string, minLength: 8, maxLength: 80 }
                observed_at: { type: string, format: date-time }
      responses:
        "200":
          description: Already recorded (same client_id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualResult" }
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Not a person's session, or not operator" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /manual-results/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Procedures]
      operationId: editCxManualResult
      summary: Edit your own manual result; the previous version is kept in history (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                status: { type: string, enum: [pass, fail, not_applicable] }
                note: { type: string }
                witness: { type: [object, "null"] }
                attachments: { type: array, items: { type: object }, description: Added to the existing ones }
                reason: { type: string, description: Why it changed (kept in history) }
      responses:
        "200":
          description: Edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManualResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Only the person who recorded it can edit it }
        "404": { $ref: "#/components/responses/NotFound" }
  /manual-attachments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Procedures]
      operationId: getCxManualAttachment
      summary: A manual result's attachment (the file itself)
      responses:
        "200":
          description: The file, with its media type; ETag is its sha256
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/coverage:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Procedures]
      operationId: getCxCoverage
      summary: Test coverage per equipment class and method
      description: >-
        Baler#275. From each active procedure's latest completed test run:
        equipment of the class in scope, sampled by the procedure, tested
        (a step judged pass or fail), passed, and tested per method
        (manual / passive / active), automatically (passive or active) and
        witnessed.
      responses:
        "200":
          description: One row per equipment class
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [equip_class, in_class, sampled, tested, passed, by_method, automatic, witnessed, summary]
                  properties:
                    equip_class: { type: string }
                    in_class: { type: integer }
                    sampled: { type: integer }
                    tested: { type: integer }
                    passed: { type: integer }
                    failed: { type: integer }
                    untested: { type: integer }
                    automatic: { type: integer }
                    witnessed: { type: integer }
                    by_method:
                      type: object
                      properties: { manual: { type: integer }, passive: { type: integer }, active: { type: integer } }
                    procedures: { type: array, items: { type: object } }
                    summary: { type: string, description: "e.g. 220 of 220 tested: 220 automatically, 12 witnessed" }
        "404": { $ref: "#/components/responses/NotFound" }
  /active/library:
    get:
      tags: [Active tests]
      operationId: listCxActiveLibrary
      summary: The standard active tests, as data (Baler#275)
      description: >-
        VAV reheat, AHU, chilled-water loop. Each states its equipment
        class, the safety limits on every value it may command, its steps
        (writes and expectations by Brick class; relative values resolve
        against the latest samples when a run is planned) and its expected
        result. Plan one with POST /projects/{id}/active-runs
        {"kind": "library", "test": id}: every Cx 9 safeguard applies.
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, equip_class, limits, steps, expected]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    equip_class: { type: string }
                    description: { type: string }
                    limits: { type: object }
                    steps: { type: array, items: { type: object } }
                    expected: { type: string }
  /projects/{id}/writes:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Operator writes]
      operationId: listCxOperatorWrites
      summary: Every audited operator write on the project, newest first
      parameters:
        - { name: point, in: query, required: false, schema: { type: string }, description: "Also return Baler's priority array for this point" }
      responses:
        "200":
          description: Writes
          content:
            application/json:
              schema:
                type: object
                required: [writes, levels, max_hold_minutes]
                properties:
                  writes: { type: array, items: { $ref: "#/components/schemas/OperatorWrite" } }
                  levels: { type: array, items: { type: integer }, description: "Levels a UI write may use (8-16)" }
                  max_hold_minutes: { type: number }
                  priority_array: { type: object, additionalProperties: { type: object } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Operator writes]
      operationId: createCxOperatorPointWrite
      summary: Command a point, with a reason and an auto-relinquish time (operator, a person)
      description: >-
        Baler#213. Goes through point_write to the Windrow instance that
        owns the point (a BACnet WriteProperty at the level). Levels 8-16
        only; `reason` and `hold_minutes` (or `expires_at`, at most 24 h
        ahead) are required, and the level is relinquished by itself when
        it runs out. Refused for an API key (a person makes operator
        writes) and with 409 if a Cx active test holds the level, or
        another person does without `replace: true`. Baler's priority array
        records the level as `op:<write id>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [point, value, reason]
              properties:
                point: { type: string }
                value: { type: [number, boolean] }
                level: { type: integer, minimum: 8, maximum: 16, default: 8 }
                reason: { type: string, minLength: 3, maxLength: 500 }
                hold_minutes: { type: number, exclusiveMinimum: 0, maximum: 1440 }
                expires_at: { type: string, format: date-time }
                replace: { type: boolean, description: "Take a level another person holds (their value is kept in `before`)" }
      responses:
        "201":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorWrite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Not a person's session, or not operator" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { description: The site refused the write or didn't answer (recorded as failed) }
        "503": { description: No Windrow command channel configured }
  /writes/{id}/relinquish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Operator writes]
      operationId: relinquishCxOperatorWrite
      summary: Release an operator point write before it expires (operator, a person)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        "200":
          description: Relinquished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorWrite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { description: The relinquish wasn't applied; the sweeper retries at expiry }
  /projects/{id}/schedule-targets:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    get:
      tags: [Operator writes]
      operationId: listCxScheduleTargets
      summary: Schedule and calendar objects on a Windrow instance's in-scope connections, read live (operator)
      parameters:
        - { name: site, in: query, required: true, schema: { type: string } }
        - { name: instance, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Objects per connection
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    connection_id: { type: string }
                    topic_prefix: { type: string }
                    schedules: { type: array, items: { type: object } }
                    calendars: { type: array, items: { type: object } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /projects/{id}/schedule-writes:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
    post:
      tags: [Operator writes]
      operationId: createCxScheduleWrite
      summary: Change a BACnet Schedule or Calendar, with a reason and a revert time (admin, a person)
      description: >-
        Sent over the command channel as Windrow's `write_schedule` /
        `write_calendar` (the Windrow#26 contract; see docs-site
        operator-writes). The object is read first and kept as `before`;
        at `revert_at` the sweeper writes the changed fields back, unless
        someone has changed the object since (`conflict`, left alone).
        Without `revert_at`, `permanent: true` must be said.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site, instance, connection_id, object, reason]
              properties:
                site: { type: string }
                instance: { type: string }
                connection_id: { type: string }
                kind: { type: string, enum: [schedule, calendar], default: schedule }
                object: { type: string, description: "schedule,N or calendar,N" }
                weekly: { type: object }
                exceptions: { type: array, items: { type: object } }
                default: {}
                effective_period: { type: array, items: { type: string } }
                dates: { type: array, items: { type: object } }
                reason: { type: string, minLength: 3, maxLength: 500 }
                revert_at: { type: string, format: date-time }
                permanent: { type: boolean }
      responses:
        "201":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorWrite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Not a person's admin session }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: The site refused the write or didn't answer (recorded as failed) }
        "503": { description: No Windrow command channel configured }
  /writes/{id}/revert:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Operator writes]
      operationId: revertCxScheduleWrite
      summary: Write a schedule/calendar write's before-state back now (admin, a person)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        "200":
          description: Reverted (or conflict, when the object changed since)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorWrite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { description: The revert wasn't applied }
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReportOrigin:
      name: origin
      in: query
      description: >-
        Where Baler is, as scheme and host (e.g. https://baler.example.com).
        Trend links in the HTML report point there, so they still work from
        a saved file or the UI's blob: page, where a root-relative link
        resolves to nothing (Baler#125). Omitted: root-relative links.
      schema: { type: string, pattern: "^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$" }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not via the gateway, or no verifiable token with an org
    Conflict:
      description: The change breaks a rule (the message says which)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such project/run, or not visible to the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    OperatorWrite:
      type: object
      required: [id, project_id, kind, target, reason, status, created_at, log]
      properties:
        id: { type: string }
        project_id: { type: string }
        kind: { type: string, enum: [point, schedule, calendar] }
        target: { type: string, description: "The point URI, or site/instance/connection/object" }
        equip_uri: { type: [string, "null"] }
        site: { type: [string, "null"] }
        instance: { type: [string, "null"] }
        connection_id: { type: [string, "null"] }
        level: { type: [integer, "null"] }
        value: {}
        before: { type: [object, "null"] }
        reason: { type: string }
        who: { type: [string, "null"] }
        user_sub: { type: [string, "null"] }
        role: { type: [string, "null"] }
        status: { type: string, enum: [pending, active, permanent, relinquished, expired, superseded, reverted, conflict, failed] }
        expires_at: { type: [string, "null"], format: date-time, description: "Auto-relinquish (points) or revert (schedules)" }
        created_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        ended_by: { type: [string, "null"] }
        end_reason: { type: [string, "null"] }
        error: { type: [string, "null"] }
        log: { type: array, items: { type: object } }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Status:
      type: string
      enum: [pass, fail, inconclusive, not_applicable]
    Settings:
      type: object
      properties:
        window_hours: { type: number, exclusiveMinimum: 0, maximum: 744 }
        prefixes:
          type: array
          maxItems: 50
          items: { type: string }
          description: >-
            Topic prefixes the project covers, e.g. ["fbf/hospital-a"] for one
            building (Baler#75). Narrows the project's inventory, runs, issues and
            status to equipment under them, on top of the site (if any) and the
            caller's own scope - it never shows more than the caller can see.
        gl36:
          type: object
          description: >-
            Opt-in sequence verification with vendored PNNL ConStrain items
            (Cx 3, Baler#39; needs the server installed with the `cx-gl36`
            extra, else 400). Each key enables one item - `zone_deadband`,
            `sat_reset`, `chw_reset`, `hw_reset` - and holds its design
            parameters (ConStrain names, deg C unless `unit` is `F`), plus
            optional `step_minutes` (resampling grid, default 5). See
            todo/cx3-constrain-gl36-spike.md.
          additionalProperties:
            type: object
            properties:
              unit: { type: string, enum: [C, F] }
              step_minutes: { type: number, minimum: 1, maximum: 60 }
              max_fail_fraction:
                type: number
                minimum: 0
                exclusiveMaximum: 1
                description: >-
                  The project's pass threshold: the item passes while no more
                  than this share of tested steps fail. 0 (default) is
                  ConStrain's own rule - any failing step fails it.
            additionalProperties: { type: number }
          example:
            hw_reset: { unit: F, temperature_air_outdoor_min: 20, temperature_air_outdoor_max: 60,
                        temperature_water_hot_setpoint_max: 180, temperature_water_hot_setpoint_min: 140 }
        fault_mirroring:
          type: object
          description: >-
            Cx 8: mirror failing checks into the shared faults table as
            `cx:<check_id>` on real URIs. `equipment` confirmed (default:
            only equipment a person confirmed against the spec) or all;
            `checks` id prefixes (default exists, live, pair:, gl36:, cx:,
            ladder); `severity` of the faults. Accepted risks suppress it.
          properties:
            enabled: { type: boolean }
            equipment: { type: string, enum: [confirmed, all] }
            checks: { type: array, items: { type: string } }
            severity: { type: string, enum: [critical, warning, info] }
          additionalProperties: false
        phase_gates:
          type: string
          enum: [warn, block, "off"]
          description: >-
            What an unmet phase gate does (#86): warn (default; the move goes
            ahead and the phase.set event records what was unmet), block
            (409 unless the request sets override with a note), or off.
        schedule:
          type: [object, "null"]
          description: A verification run this often, as the project's org on its site (Cx 6)
          properties: { every_hours: { type: number, minimum: 1, maximum: 744 } }
        ladder:
          type: object
          description: >-
            Rung 2-3 knobs for this project (defaults in
            commissioning/ladder.py DEFAULTS): min_samples, flat_epsilon,
            pair_tolerance_minutes, status_agreement_min, tail_fraction, and
            `tolerances` {pair key: number} overriding a pair's own tolerance
            (zone_air_temperature and supply_air_temperature 3 degF,
            supply_air_static_pressure 0.3, air_flow 0.2 of setpoint).
          properties:
            min_samples: { type: number, minimum: 1 }
            flat_epsilon: { type: number, minimum: 0 }
            pair_tolerance_minutes: { type: number, minimum: 0.1, maximum: 1440 }
            status_agreement_min: { type: number, minimum: 0, maximum: 1 }
            tail_fraction: { type: number, minimum: 0.01, maximum: 1 }
            tolerances: { type: object, additionalProperties: { type: number, minimum: 0 } }
          additionalProperties: false
        overrides:
          type: object
          description: >-
            Passive override tests (Baler#212): every override of a setpoint
            or command found in history (minus Baler's own writes, the
            schedule's own changes and releases; annotated with the
            priority-array level when Windrow reports it) is judged as
            `override:<pair>` - did the controlled variable reach it within
            `within_minutes` - and a setpoint override while the equipment
            was scheduled unoccupied is not_applicable, never a fail. Off
            unless `enabled`.
          properties:
            enabled: { type: boolean }
            within_minutes: { type: number, minimum: 1, maximum: 1440, description: "Time to reach the override (default 30)" }
            min_hold_minutes: { type: number, minimum: 0, maximum: 1440, description: "A step must hold this long to count (default 10)" }
            schedule_slack_minutes: { type: number, minimum: 0, maximum: 120 }
            baler_slack_minutes: { type: number, minimum: 0, maximum: 120 }
            refresh_minutes: { type: number, minimum: 0, maximum: 1440, description: "Re-read schedules and priority arrays this often; 0 = on request only (default 15)" }
            basis: { type: string, enum: [any, priority_array], description: "priority_array: only overrides a priority-array observation confirms" }
            tz: { type: [string, "null"], description: "IANA time zone the controllers' schedules run in" }
            tolerances: { type: object, additionalProperties: { type: number, minimum: 0 } }
            min_step: { type: object, additionalProperties: { type: number, minimum: 0 } }
            unoccupied_values: { type: array, items: { type: [number, string, boolean] } }
          additionalProperties: false
        economizer:
          type: object
          description: >-
            Baler's own air-side economizer checks (`cx:econ_high_limit`,
            90.1 6.5.1.1.3; `cx:econ_integrated`, 90.1 6.5.1.3) on every
            AHU. `high_limit` is the climate zone's fixed dry-bulb limit.
            Points are found by Brick class, markers or name, and can be
            bound explicitly per equipment in `points`.
          required: [high_limit]
          properties:
            high_limit: { type: number }
            unit: { type: string, enum: [C, F] }
            min_position: { type: number, minimum: 0, maximum: 100, description: "Damper minimum, % open (default 20)" }
            position_tolerance: { type: number }
            temperature_tolerance: { type: number }
            cooling_threshold: { type: number, description: "Cooling output above this (%) counts as on; binary points use on/off" }
            max_fail_fraction: { type: number, minimum: 0, maximum: 0.999 }
            step_minutes: { type: number, minimum: 1, maximum: 60 }
            checks: { type: array, items: { type: string, enum: [high_limit, integrated] } }
            points:
              type: object
              additionalProperties:
                type: object
                properties:
                  oat: { type: string }
                  oa_damper: { type: string }
                  cooling: { type: string }
                  rat: { type: string }
      additionalProperties: true
    PhaseInput:
      type: object
      required: [key]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_-]{0,39}$" }
        name: { type: string }
        status: { type: string, enum: [pending, active, complete, skipped] }
    Phase:
      type: object
      required: [key, name, position, status, started_at, completed_at]
      properties:
        key: { type: string }
        name: { type: string }
        position: { type: integer }
        status: { type: string, enum: [pending, active, complete, skipped] }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    Project:
      type: object
      required: [id, org_id, site_id, name, settings, phase, current_phase, phases, created_at, updated_at, archived_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        site_id: { type: [string, "null"] }
        name: { type: string }
        settings: { $ref: "#/components/schemas/Settings" }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
        phase:
          type: [string, "null"]
          description: The active phase's key - the same field POST /projects takes.
        current_phase: { type: [string, "null"], description: Same as `phase` (kept for existing clients) }
        phases:
          type: array
          items: { $ref: "#/components/schemas/Phase" }
    Event:
      type: object
      required: [id, ts, action, detail]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        action: { type: string }
        user_sub: { type: [string, "null"] }
        actor: { type: string, enum: [user, system], description: "system: runs and reconcile; user: a named person" }
        user_email: { type: [string, "null"] }
        detail: { type: object }
    InventoryPoint:
      type: object
      required: [id, dis, brickClass, tags, spec]
      properties:
        id: { type: string }
        point: { type: string }
        dis: { type: string }
        unit: { type: [string, "null"] }
        kind: { type: [string, "null"] }
        brickClass: { type: [string, "null"] }
        tags: { type: array, items: { type: string }, description: Haystack markers }
        equip: { type: [string, "null"] }
        equipDis: { type: [string, "null"] }
        spec: { type: [string, "null"], description: The ph Xeto spec the point fits }
    InventoryEquip:
      type: object
      required: [id, dis, brickClass, brickClasses, tags, spec, points]
      properties:
        id: { type: string }
        dis: { type: string }
        brickClass: { type: [string, "null"] }
        brickClasses: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        spec: { type: [string, "null"] }
        templates: { type: array, items: { type: string } }
        points:
          type: array
          items: { $ref: "#/components/schemas/InventoryPoint" }
    Run:
      type: object
      required: [id, project_id, phase, status, started_at, finished_at, window_start, window_end, scope, summary, progress, error]
      properties:
        id: { type: string }
        project_id: { type: string }
        phase: { type: [string, "null"], description: The project's phase when the run was requested }
        status:
          type: string
          enum: [queued, running, completed, failed]
          description: >-
            A run still queued or running when the API restarts is marked
            failed at startup (error starts with `interrupted`).
        started_at: { type: string, format: date-time, description: When the run was requested; the window ends here }
        finished_at: { type: [string, "null"], format: date-time, description: Null until completed or failed }
        progress:
          type: [object, "null"]
          description: While running, roughly every 2 s; null otherwise
          properties:
            stage: { type: string, enum: [starting, inventory, history, checks, gl36, economizer, overrides] }
            equipment_done: { type: integer }
            equipment_total: { type: [integer, "null"] }
            points: { type: [integer, "null"] }
        error: { type: [string, "null"], description: Why it failed }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        triggered_by: { type: [string, "null"] }
        scope:
          type: object
          description: What was in scope, so the run is reproducible
        summary:
          type: [object, "null"]
          description: Null until completed
          required: [equipment, points, by_status, by_check, freshness]
          properties:
            ladder:
              type: object
              description: How many equipment reached each rung (0-3)
              properties:
                highest_rung_passed: { type: object, additionalProperties: { type: integer } }
                rungs: { type: object }
            equipment: { type: integer }
            points: { type: integer }
            equipment_with_template: { type: integer }
            equipment_without_template: { type: array, items: { type: object } }
            unclassified_points: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            by_check: { type: object }
            required_missing: { type: integer }
            freshness: { type: string }
            phase: { type: [string, "null"] }
            window_hours: { type: number }
    Result:
      type: object
      required: [equip_uri, check_id, subject, status, evidence]
      properties:
        equip_uri: { type: string }
        check_id:
          type: string
          description: >-
            `exists` (rung 1, per point), `live` (rung 2, per sensor),
            `pair:<key>` (rung 3, subject `a|b`), `ladder` (per equipment:
            evidence.highest_rung_passed, rungs, fell_to_rung),
            `template:<requirement>`, or `gl36:<item>` (per equipment, when
            the project enables ConStrain items in settings.gl36).
        subject: { type: string, description: Point or equipment the result is about }
        status: { $ref: "#/components/schemas/Status" }
        severity: { type: [string, "null"], enum: [required, expected, optional, null] }
        symptom: { type: [string, "null"] }
        candidates:
          type: array
          items:
            type: object
            properties:
              cause: { type: string }
              distinguish: { type: string }
        evidence: { type: object }
    Criterion:
      type: object
      description: >-
        Exactly one of: `check` (a Cx check id or prefix - `exists`, `live`,
        `pair:`, `template:`, `gl36:hw_reset`, `cx:econ_*` - optionally
        filtered by severity, pair_kind or point_class; `strict` counts
        inconclusive as failing); `range` ({min, max, unit, hours}) over a
        point_class's points or one named `point`, with `hours` limiting it
        to local occupied hours (S2); `availability` ({min_pct,
        max_gap_minutes}): the point reported at least every max_gap
        minutes for min_pct of the window (S3); or `response` ({when:
        {point|point_class, equals}, then: {point|point_class, changes_by,
        within_minutes}}): each time `when` starts, `then` moves at least
        changes_by within that time; never started is inconclusive (S1). A
        criterion matching nothing is not_applicable unless `required`.
        Evaluated criteria carry `observed` per point (min/max/last, sample
        count, availability, the edges judged) - passing ones too.
      properties:
        check: { type: string }
        strict: { type: boolean }
        severity: { type: string, enum: [required, expected, optional] }
        pair_kind: { type: string, enum: [cmd_status, track] }
        point_class: { type: string }
        point: { type: string }
        required: { type: boolean }
        range:
          type: object
          properties:
            min: { type: number }
            max: { type: number }
            unit: { type: string, enum: [C, F] }
            hours:
              type: object
              properties:
                from: { type: integer, minimum: 0, maximum: 23 }
                to: { type: integer, minimum: 1, maximum: 24 }
                days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: "0 = Monday" }
                tz: { type: string, description: IANA time zone; UTC when omitted }
        availability:
          type: object
          required: [min_pct, max_gap_minutes]
          properties:
            min_pct: { type: number, exclusiveMinimum: 0, maximum: 100 }
            max_gap_minutes: { type: number, exclusiveMinimum: 0 }
        response:
          type: object
          required: [when, then]
          properties:
            when:
              type: object
              properties:
                point: { type: string }
                point_class: { type: string }
                equals: { description: The value that starts it, e.g. 1, true, "active" }
            then:
              type: object
              properties:
                point: { type: string }
                point_class: { type: string }
                changes_by: { type: number, exclusiveMinimum: 0 }
                within_minutes: { type: number, exclusiveMinimum: 0 }
    ProcedureSpec:
      type: object
      required: [name, kind, equip_class, steps]
      properties:
        name: { type: string }
        kind: { type: string, enum: [power_on, startup, functional, seasonal] }
        equip_class: { type: string, description: Brick equipment class, subclass-aware }
        equip_uris: { type: [array, "null"], items: { type: string } }
        description: { type: string }
        window_hours: { type: number }
        schedule:
          type: [object, "null"]
          properties: { every_hours: { type: number, minimum: 1, maximum: 744 } }
        status: { type: string, enum: [draft, active, archived] }
        template: { type: [string, "null"] }
        steps:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              instruction: { type: string }
              criteria:
                type: array
                items: { $ref: "#/components/schemas/Criterion" }
                description: Required (1-20) when the step offers passive; a manual-only step may have none
              methods:
                type: array
                items: { type: string, enum: [manual, passive, active] }
                description: "Baler#275: how the step can be judged (default [passive]); a test run picks one"
              active:
                type: object
                properties:
                  kind: { type: string, enum: [command_response, library] }
                  test: { type: string, description: "kind library: the standard test's id" }
                description: The Cx 9 active test whose outcome judges the step (methods include active)
              witness_required: { type: boolean, description: A manual result for this step needs a witness }
    Procedure:
      allOf:
        - { $ref: "#/components/schemas/ProcedureSpec" }
        - type: object
          required: [id, project_id, created_at, updated_at]
          properties:
            id: { type: string }
            project_id: { type: string }
            created_by: { type: [string, "null"] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    TestRun:
      type: object
      required: [id, project_id, procedure_id, status, started_at, window_end, requested_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        procedure_id: { type: string }
        phase: { type: [string, "null"] }
        status: { type: string, enum: [queued, running, completed, failed] }
        started_at: { type: string, format: date-time, description: '"Powered on / started at": the window starts here' }
        window_end: { type: string, format: date-time }
        requested_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        triggered_by: { type: [string, "null"], description: "The user, or `schedule`" }
        scope: { type: object }
        procedure: { type: object, description: The procedure as it was run }
        equipment:
          type: [array, "null"]
          items:
            type: object
            properties:
              equip_uri: { type: string }
              dis: { type: [string, "null"] }
              status: { $ref: "#/components/schemas/Status" }
              steps:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    status: { $ref: "#/components/schemas/Status" }
                    criteria: { type: array, items: { type: object } }
                    method: { type: string, enum: [manual, passive, active], description: The method that produced `status` }
                    machine_status: { type: [string, "null"], description: "The criteria's own verdict, always kept (never overwritten by a typed value)" }
                    manual: { type: [object, "null"], description: "The current manual result: who, role, when, status, note, witness, attachments, edits" }
                    active: { type: [object, "null"], description: The active run that judged it }
                    contradiction: { type: boolean, description: "A person's pass/fail disagrees with the data's" }
                    reason: { type: string }
        summary: { type: [object, "null"] }
        previous_id: { type: [string, "null"] }
        diff:
          type: [object, "null"]
          properties:
            counts: { type: object, additionalProperties: { type: integer } }
            changes: { type: array, items: { type: object } }
        error: { type: [string, "null"] }
    SpecItem:
      type: object
      required: [id, project_id, kind, tag, name, brick_class, properties, source, status]
      properties:
        id: { type: string }
        project_id: { type: string }
        document_id: { type: [string, "null"] }
        kind: { type: string, enum: [equipment, point, sequence] }
        tag: { type: string }
        name: { type: string }
        equip_tag: { type: [string, "null"] }
        brick_class: { type: [string, "null"] }
        properties: { type: object }
        source:
          type: object
          description: document, page, quote (extraction) or row (import), method, model, quote_verified (the quote was found in the PDF text), cited_page (when the quote was on another page), corrected_from
        confidence: { type: [number, "null"] }
        status: { type: string, enum: [proposed, accepted, rejected] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        reviewed_by: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
    SpecDocument:
      type: object
      required: [id, project_id, filename, media_type, size, sha256, method, status, items]
      properties:
        id: { type: string }
        project_id: { type: string }
        filename: { type: string }
        media_type: { type: string }
        size: { type: integer }
        sha256: { type: string }
        method: { type: string, enum: [llm, table] }
        status: { type: string, enum: [queued, running, completed, failed] }
        items: { type: integer }
        info: { type: [object, "null"], description: "model, provider, notes, token usage, dropped (items whose quote wasn't in the PDF)" }
        error: { type: [string, "null"] }
        created_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    Mapping:
      type: object
