# Renamed from Timberdoodle. Every BALER_* setting below falls back to its
# old TIMBERDOODLE_* name, and the Postgres role/database and volume names
# are variables, so an install made under the old name keeps its .env and
# its data unchanged - see deploy/MIGRATING-TO-BALER.md.
x-daemon-env: &daemon-env
  BALER_PG_DSN: postgresql://${BALER_PG_USER:-baler}:${POSTGRES_PASSWORD:-${BALER_PG_USER:-baler}}@postgres:5432/${BALER_PG_DB:-baler}
  OXIGRAPH_URL: http://oxigraph:7878
  MQTT_HOST: mosquitto
  MQTT_USERNAME: baler
  MQTT_PASSWORD: ${MQTT_PASSWORD:?set in .env - see .env.example}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  BALER_ALLOW_PRIVATE_WEBHOOKS: ${BALER_ALLOW_PRIVATE_WEBHOOKS:-${TIMBERDOODLE_ALLOW_PRIVATE_WEBHOOKS:-}}
  # Blank-safe; only ingest_api.py's GET /his reads it (default tz for
  # hisRead spans - see .env.example). Blank means UTC.
  BALER_TZ: ${BALER_TZ:-${TIMBERDOODLE_TZ:-}}
  # Blank-safe like the var above, not required (:?) - only auth_api.py
  # and the gateway need this so far (incremental gateway-auth rollout,
  # see the plan doc's Phase 2 migration path); other daemons never
  # check it. Set it in .env once you're actually using auth_api/the new
  # gateway auth - until then the stack runs exactly as before.
  BALER_GATEWAY_SECRET: ${BALER_GATEWAY_SECRET:-${TIMBERDOODLE_GATEWAY_SECRET:-}}
  # Only auth_api.py (issues tokens) actually needs this - blanket-added
  # to the anchor like the var above, harmless for daemons that never
  # read it.
  BALER_JWT_SECRET: ${BALER_JWT_SECRET:-${TIMBERDOODLE_JWT_SECRET:-}}

x-daemon-depends-on: &daemon-depends-on
  postgres:
    condition: service_healthy
  oxigraph:
    condition: service_started
  mosquitto:
    condition: service_started
  # One-shot data migration (baler.migrate) - every daemon waits for it to
  # finish, so a deploy never runs new code against old-named graph data.
  migrate:
    condition: service_completed_successfully

# Lets containers resolve the host machine as host.docker.internal (Docker
# Desktop provides this automatically; plain Linux Docker needs the explicit
# host-gateway mapping). fault_api validates and fault_detector delivers
# webhook URLs, and the e2e webhook tests point them at a receiver running on
# the host - see the webhook_receiver fixture / CLAUDE.md.
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  # Idempotent: rewrites urn:baler: IRIs to urn:baler: once, then
  # finds nothing to do on every later `up`. See src/baler/migrate.py.
  migrate:
    build: .
    command: python -m baler.migrate
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on:
      oxigraph:
        condition: service_started
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["/mosquitto/config/entrypoint.sh"]
    environment:
      # baler is the trusted backend account (mqtt_listener,
      # fault_detector, derivation_engine, integration tests - see
      # mosquitto/acl). Add "site-id:password" pairs here per Windrow site
      # once the command channel (multi-site.mdx) is actually in use -
      # each site's username *is* its cmd/<username>/# scope.
      MOSQUITTO_USERS: baler:${MQTT_PASSWORD:?set in .env - see .env.example}
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: serve -l /data -b 0.0.0.0:7878 --cors --union-default-graph
    volumes:
      - oxigraph-data:/data
    ports:
      - "7878:7878"

  postgres:
    image: timescale/timescaledb:latest-pg16
    command: postgres -c log_statement=all
    # Docker's default 64 MB /dev/shm is too small for Postgres parallel
    # queries over point_history (nash-srv hit "could not resize shared
    # memory segment"); the host disk was fine.
    shm_size: 512mb
    environment:
      POSTGRES_USER: ${BALER_PG_USER:-baler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${BALER_PG_USER:-baler}}
      POSTGRES_DB: ${BALER_PG_DB:-baler}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BALER_PG_USER:-baler}"]
      interval: 2s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Default in-memory storage has no cap (0 = unlimited) - left running
      # for days this grows without bound; it hit 26GB (85% of nash-srv's
      # RAM, on a box shared with other projects) before this was set.
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANON_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${BALER_PG_USER:-baler}}
      BALER_PG_USER: ${BALER_PG_USER:-baler}
      BALER_PG_DB: ${BALER_PG_DB:-baler}
      # Grafana's newer apiserver-backed provisioning path (feature toggle
      # "provisioning", on by default in recent grafana-oss:latest) throws
      # "Datasource provisioning error: data source not found" against our
      # classic file-based grafana/provisioning/ YAML - disabling it falls
      # back to the classic provisioner, which works correctly.
      GF_FEATURE_TOGGLES_DISABLE: "provisioning"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3033:3000"

  mqtt_listener:
    build: .
    command: python -m baler.mqtt_listener
    # Pure daemons connect to Postgres/MQTT eagerly at startup and exit on
    # failure. On a fresh DB volume, postgres' first-boot init briefly passes
    # its healthcheck then restarts, refusing that first connection (a race the
    # HTTP APIs dodge by connecting lazily). Restart so the daemon recovers
    # instead of staying dead - otherwise the mqtt_listener/fault_detector-
    # dependent e2e tests fail intermittently (seen on CI's fresh volumes).
    restart: unless-stopped
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  ingest_api:
    build: .
    command: python -m baler.ingest_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck: &http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.yaml')"]
      interval: 2s
      timeout: 3s
      retries: 30

  fault_api:
    build: .
    command: python -m baler.fault_api
    # Unlike the other HTTP APIs, this one calls connect_pool() eagerly in
    # main() before serving - same DB-not-ready-yet startup race as the
    # pure daemons below (see mqtt_listener), just via an HTTP API. Seen
    # live in CI twice: fault_api exits on a fresh volume's first-boot
    # restart, and gateway's depends_on: service_healthy then fails the
    # whole stack since nothing brings it back.
    restart: unless-stopped
    environment: *daemon-env
    extra_hosts: *host-gateway
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/openapi.yaml')"]

  fault_detector:
    build: .
    command: python -m baler.fault_detector
    restart: unless-stopped  # see mqtt_listener - recover from the DB-not-ready-yet startup race
    environment: *daemon-env
    extra_hosts: *host-gateway
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  derivation_api:
    build: .
    command: python -m baler.derivation_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/openapi.yaml')"]

  derivation_engine:
    build: .
    command: python -m baler.derivation_engine
    restart: unless-stopped  # see mqtt_listener - recover from the DB-not-ready-yet startup race
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  validate_api:
    build: .
    command: python -m baler.validate_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/openapi.yaml')"]

  auth_api:
    build: .
    command: python -m baler.auth_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/openapi.yaml')"]

  ops_api:
    build: .
    command: python -m baler.ops_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/openapi.yaml')"]

  # Project Haystack HTTP API at /api/{project}/{op} - what SkySpark,
  # Haxall, nhaystack and pyhaystack clients point at. Also issues session
  # JWTs via Haystack SCRAM login, so it reads BALER_JWT_SECRET.
  haystack_api:
    build: .
    command: python -m baler.haystack_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/openapi.yaml')"]

  haystack_puller:
    build: .
    command: python -m baler.haystack_puller
    profiles: ["haystack-pull"]
    environment:
      <<: *daemon-env
      REMOTE_HAYSTACK_URL: ${REMOTE_HAYSTACK_URL:-}
      REMOTE_HAYSTACK_USER: ${REMOTE_HAYSTACK_USER:-}
      REMOTE_HAYSTACK_PASSWORD: ${REMOTE_HAYSTACK_PASSWORD:-}
      REMOTE_HAYSTACK_SOURCE_ID: ${REMOTE_HAYSTACK_SOURCE_ID:-haxall}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started

  sql_puller:
    build: .
    command: python -m baler.sql_puller
    profiles: ["sql-pull"]
    environment:
      <<: *daemon-env
      REMOTE_SQL_DSN: ${REMOTE_SQL_DSN:-}
      REMOTE_SQL_QUERY: ${REMOTE_SQL_QUERY:-}
      REMOTE_SQL_SOURCE_ID: ${REMOTE_SQL_SOURCE_ID:-sql}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started

  energystar_puller:
    build: .
    command: python -m baler.energystar_puller
    profiles: ["energystar-pull"]
    environment:
      <<: *daemon-env
      ENERGYSTAR_USERNAME: ${ENERGYSTAR_USERNAME:-}
      ENERGYSTAR_PASSWORD: ${ENERGYSTAR_PASSWORD:-}
      ENERGYSTAR_ACCOUNT_ID: ${ENERGYSTAR_ACCOUNT_ID:-}
      ENERGYSTAR_LIVE: ${ENERGYSTAR_LIVE:-}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started

  openmeteo_puller:
    build: .
    command: python -m baler.openmeteo_puller
    profiles: ["openmeteo-pull"]
    environment:
      <<: *daemon-env
      OPENMETEO_LATITUDE: ${OPENMETEO_LATITUDE:-}
      OPENMETEO_LONGITUDE: ${OPENMETEO_LONGITUDE:-}
      OPENMETEO_STATION_ID: ${OPENMETEO_STATION_ID:-openmeteo}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    environment:
      # Required now (not blank-safe like the daemon-env anchor's copies
      # of these) - every location is cut over to js_access as of the
      # Phase 2 migration path's final step, so an unset secret here
      # means the gateway can't verify anything at all, not just one
      # not-yet-migrated route.
      BALER_JWT_SECRET: ${BALER_JWT_SECRET:-${TIMBERDOODLE_JWT_SECRET:?set BALER_JWT_SECRET in .env - see .env.example}}
      BALER_GATEWAY_SECRET: ${BALER_GATEWAY_SECRET:-${TIMBERDOODLE_GATEWAY_SECRET:?set BALER_GATEWAY_SECRET in .env - see .env.example}}
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/njs:/etc/nginx/njs:ro
      - ./ui:/usr/share/nginx/ui:ro
    depends_on:
      ingest_api:
        condition: service_healthy
      fault_api:
        condition: service_healthy
      derivation_api:
        condition: service_healthy
      validate_api:
        condition: service_healthy
      auth_api:
        condition: service_healthy
      ops_api:
        condition: service_healthy
      haystack_api:
        condition: service_healthy

# Explicit names so a rename of the checkout directory (= compose project)
# can't silently swap in fresh empty volumes. An install created as
# Timberdoodle sets BALER_VOLUME_PREFIX=timberdoodle to keep its data.
volumes:
  oxigraph-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_oxigraph-data
  postgres-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_postgres-data
  grafana-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_grafana-data
  mosquitto-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_mosquitto-data
