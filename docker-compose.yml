# Renamed from Timberdoodle. Every BALER_* setting below falls back to its
# old TIMBERDOODLE_* name, and the Postgres role/database and volume names
# are variables, so an install made under the old name keeps its .env and
# its data unchanged - see deploy/MIGRATING-TO-BALER.md.
x-daemon-env: &daemon-env
  # Bytecode caches go inside the container, not into the bind-mounted
  # checkout (.:/app): containers run as root, so __pycache__ written there
  # is root-owned and the next deploy's actions/checkout can't clean it
  # (EACCES) - the #25 fast path's `restart` made that race routine (#29).
  PYTHONPYCACHEPREFIX: /tmp/pycache
  BALER_PG_DSN: postgresql://${BALER_PG_USER:-baler}:${POSTGRES_PASSWORD:-${BALER_PG_USER:-baler}}@postgres:5432/${BALER_PG_DB:-baler}
  OXIGRAPH_URL: http://oxigraph:7878
  MQTT_HOST: mosquitto
  MQTT_USERNAME: baler
  MQTT_PASSWORD: ${MQTT_PASSWORD:?set in .env - see .env.example}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
  BALER_ALLOW_PRIVATE_WEBHOOKS: ${BALER_ALLOW_PRIVATE_WEBHOOKS:-${TIMBERDOODLE_ALLOW_PRIVATE_WEBHOOKS:-}}
  # Blank-safe; only ingest_api.py's GET /his reads it (default tz for
  # hisRead spans - see .env.example). Blank means UTC.
  BALER_TZ: ${BALER_TZ:-${TIMBERDOODLE_TZ:-}}
  # Blank-safe like the var above, not required (:?) - only auth_api.py
  # and the gateway need this so far (incremental gateway-auth rollout,
  # see the plan doc's Phase 2 migration path); other daemons never
  # check it. Set it in .env once you're actually using auth_api/the new
  # gateway auth - until then the stack runs exactly as before.
  BALER_GATEWAY_SECRET: ${BALER_GATEWAY_SECRET:-${TIMBERDOODLE_GATEWAY_SECRET:-}}
  BALER_SOURCES_KEY: ${BALER_SOURCES_KEY:-}
  # Blank-safe (blank = 7 days): when point_history chunks get compressed.
  # The migrate service and every process keep the policy in step at start.
  BALER_HISTORY_COMPRESS_AFTER: ${BALER_HISTORY_COMPRESS_AFTER:-}
  # Blank-safe (blank = left as it is: 7-day chunks, policy every 12 h):
  # point_history's chunk length and the compression policy's schedule
  # (baler.history_chunks, #245). Only high-rate sites set them.
  BALER_HISTORY_CHUNK_INTERVAL: ${BALER_HISTORY_CHUNK_INTERVAL:-}
  BALER_HISTORY_COMPRESS_SCHEDULE: ${BALER_HISTORY_COMPRESS_SCHEDULE:-}
  # Blank-safe (blank = 600): how long the reading feed keeps a batch a
  # rule daemon hasn't read yet (mqtt_listener prunes; #243).
  BALER_FEED_RETENTION_S: ${BALER_FEED_RETENTION_S:-}
  # Blank-safe (blank = 1): mqtt_listener's worker processes on the shared
  # subscription (#233). Only mqtt_listener reads it. One worker stores
  # ~15k readings/s on nash-srv; give the container a CPU per worker.
  BALER_LISTENER_WORKERS: ${BALER_LISTENER_WORKERS:-}
  # Blank-safe (blank = 1000): page sizes for reads with no limit of their
  # own - haystack_api's read-by-filter, ingest_api's /his series (#244).
  BALER_READ_LIMIT: ${BALER_READ_LIMIT:-}
  BALER_HIS_SERIES_LIMIT: ${BALER_HIS_SERIES_LIMIT:-}
  # Blank-safe: only ops_api reads it (the Connectors page's local Windrow).
  WINDROW_API_URL: ${WINDROW_API_URL:-}
  # Only auth_api.py (issues tokens) actually needs this - blanket-added
  # to the anchor like the var above, harmless for daemons that never
  # read it.
  BALER_JWT_SECRET: ${BALER_JWT_SECRET:-${TIMBERDOODLE_JWT_SECRET:-}}
  # Where edge nodes connect (auth_api shows it with a new broker password).
  BALER_MQTT_PUBLIC_HOST: ${BALER_MQTT_PUBLIC_HOST:-}
  BALER_MQTT_PUBLIC_PORT: ${BALER_MQTT_PUBLIC_PORT:-1883}
  BALER_MQTT_PUBLIC_TLS_PORT: ${BALER_MQTT_PUBLIC_TLS_PORT:-}

x-daemon-depends-on: &daemon-depends-on
  postgres:
    condition: service_healthy
  oxigraph:
    condition: service_started
  mosquitto:
    condition: service_started
  # One-shot migrations (baler.migrate) - every daemon waits for them to
  # finish, so a deploy never runs new code against an old schema or
  # old-named graph data.
  migrate:
    condition: service_completed_successfully

# Lets containers resolve the host machine as host.docker.internal (Docker
# Desktop provides this automatically; plain Linux Docker needs the explicit
# host-gateway mapping). fault_api validates and fault_detector delivers
# webhook URLs, and the e2e webhook tests point them at a receiver running on
# the host - see the webhook_receiver fixture / CLAUDE.md.
x-host-gateway: &host-gateway
  - "host.docker.internal:host-gateway"

services:
  # Idempotent: applies pending Postgres schema migrations (baler.schema,
  # #194), and rewrites urn:timberdoodle: IRIs to urn:baler: once; on every
  # later `up` both find nothing to do. See src/baler/migrate.py.
  migrate:
    build: .
    command: python -m baler.migrate
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started
    restart: "no"

  mosquitto:
    restart: unless-stopped
    # 2.1.2 by digest: Docker Hub publishes no 2.1.2 (or 2.1) tag (#23)
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    entrypoint: ["/mosquitto/config/entrypoint.sh"]
    environment:
      # baler is the trusted backend account (mqtt_listener,
      # fault_detector, derivation_engine, integration tests - see
      # mosquitto/acl). Add "site-id:password" pairs here per Windrow site
      # once the command channel (multi-site.mdx) is actually in use -
      # each site's username *is* its cmd/<username>/# scope.
      MOSQUITTO_USERS: baler:${MQTT_PASSWORD:?set in .env - see .env.example}
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      # TLS for edge nodes (Baler#36): a dir holding cert.pem + key.pem
      # (readable by uid 1883) turns on the 8883 listener. The default is
      # an empty placeholder in the checkout, so nothing gets created.
      - ${BALER_MQTT_TLS_DIR:-./mosquitto/tls}:/mosquitto/tls:ro
    ports:
      - "1883:1883"
      - "8883:8883"
    healthcheck:
      # Logs in as the healthcheck account and reads one retained $SYS
      # message: passes only if the broker is up and accepts a correct
      # password (Baler#109). The password is generated per start by
      # entrypoint.sh into a root-only file, so it isn't in `docker inspect`;
      # the old refused-login check logged "not authorised" every 10 s.
      # A successful login still logs three connect/disconnect lines (only
      # connection_messages false hides them, and that also hides real
      # "not authorised" lines), so steady state checks once a minute;
      # start_interval keeps startup (depends_on, up --wait) fast.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u healthcheck -P \"$$(cat /run/mosquitto-health/password)\" -t '$$SYS/broker/uptime' -C 1 -W 4 >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

  oxigraph:
    restart: unless-stopped
    # pinned (#23): holds the graph - tag and digest of what nash-srv runs
    image: ghcr.io/oxigraph/oxigraph:0.5.13@sha256:260454ee29c091d2cdb99dd156212594ff3127850627adb4cfdcd9b1e425d480
    command: serve -l /data -b 0.0.0.0:7878 --cors --union-default-graph
    volumes:
      - oxigraph-data:/data
    ports:
      - "7878:7878"

  postgres:
    restart: unless-stopped
    # pinned (#23): holds history and auth - tag and digest of what nash-srv runs
    image: timescale/timescaledb:2.30.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731
    # Statement logging off by default: log_statement=all wrote ~73 GB/day of
    # container log at 10k points (#245). Slow statements are still logged.
    command: postgres -c log_statement=${BALER_PG_LOG_STATEMENT:-none} -c log_min_duration_statement=${BALER_PG_LOG_MIN_DURATION_MS:-1000}
    # Docker's default 64 MB /dev/shm is too small for Postgres parallel
    # queries over point_history (nash-srv hit "could not resize shared
    # memory segment"); the host disk was fine.
    shm_size: 512mb
    environment:
      POSTGRES_USER: ${BALER_PG_USER:-baler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${BALER_PG_USER:-baler}}
      POSTGRES_DB: ${BALER_PG_DB:-baler}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BALER_PG_USER:-baler}"]
      interval: 2s
      timeout: 3s
      retries: 20

  jaeger:
    restart: unless-stopped
    # Jaeger v2 (OpenTelemetry Collector based; v1 all-in-one is superseded -
    # Baler#26). Same UI (16686) and OTLP HTTP (4318) ports. In-memory
    # storage needs a cap: uncapped, v1 hit 26GB (85% of nash-srv's RAM, on
    # a box shared with other projects) - jaeger/config.yaml sets 50000 traces.
    image: jaegertracing/jaeger:2.23.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANON_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${BALER_PG_USER:-baler}}
      BALER_PG_USER: ${BALER_PG_USER:-baler}
      BALER_PG_DB: ${BALER_PG_DB:-baler}
      # Grafana's newer apiserver-backed provisioning path (feature toggle
      # "provisioning", on by default in recent grafana-oss:latest) throws
      # "Datasource provisioning error: data source not found" against our
      # classic file-based grafana/provisioning/ YAML - disabling it falls
      # back to the classic provisioner, which works correctly.
      GF_FEATURE_TOGGLES_DISABLE: "provisioning"
      # First boot on a fresh volume: grafana's startup modules contend for
      # its SQLite file, give up after the default 5 transaction retries
      # ("database is locked (5) (SQLITE_BUSY)") and the process exits -
      # which with `compose up --wait` failed whole CI jobs (#77, #97). WAL
      # lets readers and the writer coexist; more retries cover the rest,
      # and a restart covers anything left.
      GF_DATABASE_WAL: "true"
      GF_DATABASE_TRANSACTION_RETRIES: "30"
      GF_DATABASE_QUERY_RETRIES: "10"
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3033:3000"

  mqtt_listener:
    build: .
    # A supervisor: BALER_LISTENER_WORKERS worker processes, each its own
    # MQTT client id and session, plus the tag path (#233). Scale with that
    # variable, not `--scale`/replicas: worker ids must be stable per
    # index, and a second container would retire the first one's sessions.
    command: python -m baler.mqtt_listener
    # Pure daemons connect to Postgres/MQTT eagerly at startup and exit on
    # failure. On a fresh DB volume, postgres' first-boot init briefly passes
    # its healthcheck then restarts, refusing that first connection (a race the
    # HTTP APIs dodge by connecting lazily). Restart so the daemon recovers
    # instead of staying dead - otherwise the mqtt_listener/fault_detector-
    # dependent e2e tests fail intermittently (seen on CI's fresh volumes).
    restart: unless-stopped
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  ingest_api:
    restart: unless-stopped
    build: .
    command: python -m baler.ingest_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck: &http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.yaml')"]
      interval: 2s
      timeout: 3s
      retries: 30

  fault_api:
    build: .
    command: python -m baler.fault_api
    # Unlike the other HTTP APIs, this one calls connect_pool() eagerly in
    # main() before serving - same DB-not-ready-yet startup race as the
    # pure daemons below (see mqtt_listener), just via an HTTP API. Seen
    # live in CI twice: fault_api exits on a fresh volume's first-boot
    # restart, and gateway's depends_on: service_healthy then fails the
    # whole stack since nothing brings it back.
    restart: unless-stopped
    environment:
      <<: *daemon-env
      # rules/webhooks/derivations stores: a volume, not the checkout (#30)
      BALER_DATA_DIR: /data
    extra_hosts: *host-gateway
    volumes:
      - .:/app
      - baler-data:/data
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/openapi.yaml')"]

  fault_detector:
    build: .
    command: python -m baler.fault_detector
    restart: unless-stopped  # see mqtt_listener - recover from the DB-not-ready-yet startup race
    environment:
      <<: *daemon-env
      # rules/webhooks/derivations stores: a volume, not the checkout (#30)
      BALER_DATA_DIR: /data
    extra_hosts: *host-gateway
    volumes:
      - .:/app
      - baler-data:/data
    depends_on: *daemon-depends-on

  derivation_api:
    restart: unless-stopped
    build: .
    command: python -m baler.derivation_api
    environment:
      <<: *daemon-env
      # rules/webhooks/derivations stores: a volume, not the checkout (#30)
      BALER_DATA_DIR: /data
    volumes:
      - .:/app
      - baler-data:/data
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/openapi.yaml')"]

  derivation_engine:
    build: .
    command: python -m baler.derivation_engine
    restart: unless-stopped  # see mqtt_listener - recover from the DB-not-ready-yet startup race
    environment:
      <<: *daemon-env
      # rules/webhooks/derivations stores: a volume, not the checkout (#30)
      BALER_DATA_DIR: /data
    volumes:
      - .:/app
      - baler-data:/data
    depends_on: *daemon-depends-on

  validate_api:
    restart: unless-stopped
    build: .
    command: python -m baler.validate_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/openapi.yaml')"]

  auth_api:
    restart: unless-stopped
    build: .
    command: python -m baler.auth_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/openapi.yaml')"]

  ops_api:
    restart: unless-stopped
    build: .
    command: python -m baler.ops_api
    environment:
      <<: *daemon-env
      # reads derivations.json to find computed points whose derivation is gone
      BALER_DATA_DIR: /data
    volumes:
      - .:/app
      - baler-data:/data:ro
      # the gateway's 5xx log, for GET /ops/gateway-errors (Baler#178)
      - gateway-logs:/gateway-logs:ro
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/openapi.yaml')"]

  # Commissioning (Baler#32/#37): projects, phases, scoped inventory,
  # SHACL expected-point templates, verification runs. Gateway /cx/.
  # Creates cx_* tables at startup (after auth's orgs/sites).
  commissioning_api:
    build: .
    command: python -m baler.commissioning_api
    restart: unless-stopped  # connects eagerly in main() - same first-boot DB race as fault_api
    environment:
      <<: *daemon-env
      # Spec PDF extraction (Cx 7) and the commissioning agent (Cx 10):
      # BALER_LLM_PROVIDER anthropic (Claude), openai (any OpenAI-compatible
      # endpoint - Ollama, Groq, Gemini, OpenRouter) or none (PDF tables
      # only, no agent). All blank: none; the rest of Cx works regardless.
      # See .env.example for the free options.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BALER_CX_MODEL: ${BALER_CX_MODEL:-}
      BALER_LLM_PROVIDER: ${BALER_LLM_PROVIDER:-}
      BALER_LLM_BASE_URL: ${BALER_LLM_BASE_URL:-}
      BALER_LLM_API_KEY: ${BALER_LLM_API_KEY:-}
      BALER_LLM_MODEL: ${BALER_LLM_MODEL:-}
      BALER_LLM_TIMEOUT: ${BALER_LLM_TIMEOUT:-}
      BALER_LLM_MAX_CHARS: ${BALER_LLM_MAX_CHARS:-}
      BALER_LLM_MAX_TOKENS: ${BALER_LLM_MAX_TOKENS:-}
      # Active tests (Cx 9) command equipment through point_write only when
      # this is 1. Blank/unset: planning (the dry run) works, nothing is written.
      BALER_CX_ALLOW_WRITES: ${BALER_CX_ALLOW_WRITES:-}
      # Mirrored faults (Cx 8) fire webhooks.json's webhooks, like fault_detector
      BALER_DATA_DIR: /data
    extra_hosts: *host-gateway
    volumes:
      - .:/app
      - baler-data:/data
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/openapi.yaml')"]

  # Project Haystack HTTP API at /api/{project}/{op} - what SkySpark,
  # Haxall, nhaystack and pyhaystack clients point at. Also issues session
  # JWTs via Haystack SCRAM login, so it reads BALER_JWT_SECRET.
  haystack_api:
    restart: unless-stopped
    build: .
    command: python -m baler.haystack_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    healthcheck:
      <<: *http-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/openapi.yaml')"]

  haystack_puller:
    restart: unless-stopped
    build: .
    command: python -m baler.haystack_puller
    profiles: ["haystack-pull"]
    environment:
      <<: *daemon-env
      REMOTE_HAYSTACK_URL: ${REMOTE_HAYSTACK_URL:-}
      REMOTE_HAYSTACK_USER: ${REMOTE_HAYSTACK_USER:-}
      REMOTE_HAYSTACK_PASSWORD: ${REMOTE_HAYSTACK_PASSWORD:-}
      REMOTE_HAYSTACK_SOURCE_ID: ${REMOTE_HAYSTACK_SOURCE_ID:-haxall}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started

  sql_puller:
    restart: unless-stopped
    build: .
    command: python -m baler.sql_puller
    profiles: ["sql-pull"]
    environment:
      <<: *daemon-env
      REMOTE_SQL_DSN: ${REMOTE_SQL_DSN:-}
      REMOTE_SQL_QUERY: ${REMOTE_SQL_QUERY:-}
      REMOTE_SQL_SOURCE_ID: ${REMOTE_SQL_SOURCE_ID:-sql}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started

  energystar_puller:
    restart: unless-stopped
    build: .
    command: python -m baler.energystar_puller
    profiles: ["energystar-pull"]
    environment:
      <<: *daemon-env
      ENERGYSTAR_USERNAME: ${ENERGYSTAR_USERNAME:-}
      ENERGYSTAR_PASSWORD: ${ENERGYSTAR_PASSWORD:-}
      ENERGYSTAR_ACCOUNT_ID: ${ENERGYSTAR_ACCOUNT_ID:-}
      ENERGYSTAR_LIVE: ${ENERGYSTAR_LIVE:-}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started

  # Runs every source configured in Ops -> Sources (the registry,
  # baler.sources - Baler#20): Haystack servers, SQL, Open-Meteo, ENERGY
  # STAR, each on its own interval with health shown in the UI. Idle until a
  # source is enabled. The per-kind *_puller services below are the older
  # env-configured way, kept behind their profiles for existing installs.
  source_runner:
    build: .
    command: python -m baler.source_runner
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on
    restart: unless-stopped

  openmeteo_puller:
    restart: unless-stopped
    build: .
    command: python -m baler.openmeteo_puller
    profiles: ["openmeteo-pull"]
    environment:
      <<: *daemon-env
      OPENMETEO_LATITUDE: ${OPENMETEO_LATITUDE:-}
      OPENMETEO_LONGITUDE: ${OPENMETEO_LONGITUDE:-}
      OPENMETEO_STATION_ID: ${OPENMETEO_STATION_ID:-openmeteo}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      oxigraph:
        condition: service_started

  # Baler Notebooks (#90): JupyterLab with pandas, phable and baler_fn,
  # reaching Baler through the gateway with an API key like any other
  # client - Baler never runs notebook code. Opt-in:
  #   docker compose --profile notebook up -d          (stack + notebook)
  #   docker compose --profile notebook up -d jupyter  (notebook only, e.g. BALER_NOTEBOOK_URL at a remote Baler)
  # Refuses to start without BALER_JUPYTER_TOKEN (docker/notebook-start.sh).
  # Published on loopback only. It does not bind-mount the checkout, so it
  # can't leave root-owned files in it (#29): notebooks live in the
  # `notebooks` volume, and baler_fn is baked into the image (rebuild with
  # --build after changing src/baler_fn). See docs-site/pages/code/notebooks.mdx.
  jupyter:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/notebook.Dockerfile
    # A fixed tag so a function project's image can build FROM it
    # (templates/function-project/Dockerfile).
    image: baler-notebook:local
    profiles: ["notebook"]
    ports:
      - "127.0.0.1:${BALER_JUPYTER_PORT:-8888}:8888"
    environment:
      BALER_URL: ${BALER_NOTEBOOK_URL:-http://gateway}
      BALER_API_KEY: ${BALER_NOTEBOOK_API_KEY:-}
      BALER_PROJECT: ${BALER_NOTEBOOK_PROJECT:-demo}
      JUPYTER_TOKEN: ${BALER_JUPYTER_TOKEN:-}
    volumes:
      - notebooks:/home/jovyan/work

  gateway:
    restart: unless-stopped
    image: nginx:1.31.8-alpine
    ports:
      - "8080:80"
    environment:
      # Required now (not blank-safe like the daemon-env anchor's copies
      # of these) - every location is cut over to js_access as of the
      # Phase 2 migration path's final step, so an unset secret here
      # means the gateway can't verify anything at all, not just one
      # not-yet-migrated route.
      BALER_JWT_SECRET: ${BALER_JWT_SECRET:-${TIMBERDOODLE_JWT_SECRET:?set BALER_JWT_SECRET in .env - see .env.example}}
      BALER_GATEWAY_SECRET: ${BALER_GATEWAY_SECRET:-${TIMBERDOODLE_GATEWAY_SECRET:?set BALER_GATEWAY_SECRET in .env - see .env.example}}
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/njs:/etc/nginx/njs:ro
      - ./ui:/usr/share/nginx/ui:ro
      # 5xx answers, one JSON line each (gateway/nginx.conf); ops_api reads
      # them for GET /ops/gateway-errors (Baler#178).
      - gateway-logs:/var/log/baler-gateway
    # Serves /ui/ and its own config, nothing behind it - so it stays healthy
    # (and keeps answering) while backends restart. The deploy waits on it.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ui/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    # Started after the backends, not gated on their health: its upstreams
    # re-resolve at runtime (gateway/nginx.conf), so a backend that is down
    # or restarting costs only that backend's routes, never the whole
    # gateway and UI (Baler#108).
    depends_on:
      ingest_api:
        condition: service_started
      fault_api:
        condition: service_started
      derivation_api:
        condition: service_started
      validate_api:
        condition: service_started
      auth_api:
        condition: service_started
      ops_api:
        condition: service_started
      haystack_api:
        condition: service_started
      commissioning_api:
        condition: service_started

  # A local, free model for Cx 7/10 (BALER_LLM_PROVIDER=openai,
  # BALER_LLM_BASE_URL=http://ollama:11434/v1). Commented out, and under the
  # llm-local profile once uncommented, so it never starts by default. To use:
  # uncomment it and its volume below, then
  #   docker compose --profile llm-local up -d ollama
  #   docker compose exec ollama ollama pull qwen2.5:7b   # ~4.7 GB; llama3.1:8b works too
  # and set BALER_LLM_MODEL=qwen2.5:7b. CPU-only works but is slow (minutes per
  # PDF chunk); 8 GB+ of free RAM for a 7-8B model. Ollama's default context is
  # small - OLLAMA_CONTEXT_LENGTH below lets a page chunk and the tools fit.
  # ollama:
  #   image: ollama/ollama:latest  # pin a release tag for anything long-lived
  #   profiles: ["llm-local"]
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_CONTEXT_LENGTH: "16384"
  #   volumes:
  #     - ollama-models:/root/.ollama

# Explicit names so a rename of the checkout directory (= compose project)
# can't silently swap in fresh empty volumes. An install created as
# Timberdoodle sets BALER_VOLUME_PREFIX=timberdoodle to keep its data.
volumes:
  # API-created fault rules, webhooks and derivations (BALER_DATA_DIR, #30):
  # in the checkout they were tracked files every deploy reverted.
  baler-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_app-data
  oxigraph-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_oxigraph-data
  postgres-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_postgres-data
  grafana-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_grafana-data
  mosquitto-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_mosquitto-data
  # The gateway's 5xx log (gateway/nginx.conf), read by ops_api (Baler#178).
  gateway-logs:
    name: ${BALER_VOLUME_PREFIX:-baler}_gateway-logs
  # The jupyter service's notebooks (profile "notebook").
  notebooks:
    name: ${BALER_VOLUME_PREFIX:-baler}_notebooks
  # ollama-models:  # the commented-out ollama service above
  #   name: ${BALER_VOLUME_PREFIX:-baler}_ollama-models
