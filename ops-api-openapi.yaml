openapi: 3.1.0
info:
  title: Baler Ops API
  version: 0.1.0
  description: >
    Building-engineer control-plane status. Aggregates platform and job
    health into plain-language states (ok / quiet / degraded / down).
paths:
  /status:
    get:
      operationId: getOpsStatus
      summary: Aggregated Ops status
      description: >-
        Service states come from a background probe round every 10 s (a probe that
        hasn't answered within 2.5 s counts as down), so this answers without
        waiting on any probe. The Building counts are read per request, for the
        caller's sites.
      responses:
        "200":
          description: Status document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
        "401":
          description: Missing or invalid gateway secret
  /openapi.yaml:
    get:
      operationId: getOpsOpenAPI
      summary: This OpenAPI document
      responses:
        "200":
          description: YAML OpenAPI spec
  /sources/kinds:
    get:
      operationId: listSourceKinds
      summary: The source kinds and the settings each declares (admin)
      responses:
        "200":
          description: kind -> {label, help, fields[{name, label, required, secret, type, default, help}]}
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /orphans:
    get:
      operationId: listOrphanedPoints
      summary: Points nothing maintains any more
      description: >-
        admin-only, limited to the caller's sites. `derivation_gone`: a computed output
        whose derivation was deleted (nothing will write it again). `no_equip`: a point
        linked to no equipment. Each with its last value, for review before removing.
      responses:
        "200":
          description: Orphaned points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrphanedPoint" }
        "401":
          description: Not through the gateway.
  /orphans/remove:
    post:
      operationId: removeOrphanedPoints
      summary: Remove orphaned points
      description: >-
        admin-only. Deletes each point's graph record (and its history rows only if
        `purge_history`), logged in the record edit audit. Ids that aren't currently
        orphans the caller can see are skipped, not touched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
                purge_history: { type: boolean, default: false }
      responses:
        "200":
          description: What was removed and what was skipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
        "400":
          description: Malformed body.
        "401":
          description: Not through the gateway.
  /sources:
    get:
      operationId: listSources
      summary: Every configured source with its health (admin)
      description: >-
        health is disabled, misconfigured (missing lists the required
        settings), pending (enabled, not run yet), failing (last_error says
        why) or ok. Secret settings are never returned - secrets_set names
        the ones that are set. Baler#20.
      responses:
        "200":
          description: Sources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Source" }
    post:
      operationId: createSource
      summary: Add a source (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string, enum: [haystack, sql, openmeteo, energystar] }
                name: { type: string }
                settings: { type: object, additionalProperties: true }
                enabled: { type: boolean, description: "needs every required setting" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400":
          description: Unknown kind or setting, a bad value, or enabled while settings are missing.
  /sources/{id}:
    patch:
      operationId: updateSource
      summary: Rename, change settings, enable or disable (admin)
      description: >-
        Settings merge; a null or empty value clears one. A secret is replaced
        only when sent. Enabling needs every required setting. The runner
        picks changes up within 30s.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                settings: { type: object, additionalProperties: true }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400":
          description: A bad setting, or enabling with settings missing.
        "404":
          description: No such source.
    delete:
      operationId: deleteSource
      summary: Remove a source (admin); data it already pulled stays
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such source.
  /edges:
    get:
      summary: Edge nodes (Windrow instances) the Connectors page can manage
      description: >-
        The Windrow beside Baler (WINDROW_API_URL, reached over HTTP) as
        site_id/instance_id "local", plus every remote Windrow that has
        published a cmd/<site>/<instance>/status heartbeat. A remote node is
        online while its last heartbeat says so and is under 3 minutes old.
        Viewer; whole-org logins only.
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EdgeNode" } }
        "401": { description: Not through the gateway }
        "502": { description: "No local Windrow, and the MQTT broker can't be reached" }
  /edges/{site}/{instance}/actions/{action}:
    post:
      summary: Run one action on an edge node
      description: >-
        Windrow's command-channel vocabulary, the same for local and remote
        nodes. Reads (viewer) - list_devices, list_connections,
        modbus_list_connections, list_announced (devices that announced
        themselves: name, address, services, online, last_seen, history). Changes and scans (admin) - add_device,
        set_device_status {id, status}, recheck_credentials {id},
        set_credential {target device|connection|modbus_connection, id,
        credential}, create_connection, update_connection {id, ...} (both,
        and the modbus_ versions, take device_name: the name a device
        announces itself under, or a DNS name; BACnet updates may change
        device_address),
        delete_connection {id}, the modbus_ versions, discover, learn
        {device_address, device_instance}, modbus_discover {cidr},
        modbus_test_read {host, register, port?, device_id?} (reads one
        holding register once; stores nothing), and background jobs for the
        slow ones - start_job {job: discover|learn|modbus_discover, ...that
        action's fields} answers at once with a job id, get_job {id} returns
        its state (running|done|failed), progress ({done, total} for a sweep)
        and result, list_jobs. Use the jobs for scans and learns: the edge
        node gives up on a synchronous one after 15 s. The body is the
        action's fields. list_connections and modbus_list_connections results carry
        each connection's poll_status (state, last_poll_at,
        last_success_at, last_value_at, last_error, last_error_at,
        failing_count, failing_points) when the node's Windrow reports it.
      parameters:
        - { name: site, in: path, required: true, schema: { type: string }, description: '"local" for the Windrow beside Baler' }
        - { name: instance, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The node's answer
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result: {}
        "400": { description: "Unknown action, bad body, a topic_prefix outside the node's allowed prefixes (checked on create, and on update when it changes the prefix), or the node refused it" }
        "404": { description: No local Windrow configured }
        "502": { description: "The node errored or can't be reached" }
        "504": { description: "A remote node didn't answer in time (offline commands expire, never apply late)" }
  /freshness:
    get:
      operationId: getFreshness
      summary: Ingest rate and per-point freshness under a topic prefix
      description: >-
        Read-only, for post-deploy verification (tools/live-check, Baler#178)
        so it needs no database access. rows_last_60s counts point_history
        rows of the last 60 s; points lists every point under the prefix
        that reported in the last 7 days, with when it last did. poll_s is
        not stored anywhere Baler sees: it is the point's mean sample spacing
        over its last hour of data (null with a single sample), which is the
        poll interval for an ordinary point and longer for a COV one. Counts
        and points are limited to the caller's sites. Viewer.
      parameters:
        - { name: prefix, in: query, required: true, schema: { type: string, example: fbf/home },
            description: "A topic prefix: letters, digits, - _ . ~ separated by /" }
      responses:
        "200":
          description: Freshness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Freshness" }
        "400": { description: Missing or malformed prefix }
        "401": { description: Not through the gateway }
  /gateway-errors:
    get:
      operationId: getGatewayErrors
      summary: The gateway's 5xx answers in a time window
      description: >-
        Read-only, for post-deploy verification (Baler#178): every 5xx the
        gateway answered between since and until, from the 5xx-only log
        gateway/nginx.conf writes to the gateway-logs volume (path only, ids
        folded to :id; never query strings or headers). available is false
        when that log isn't there, which means "can't tell", not zero.
        Operator; whole-org logins only (the log spans every org and site).
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: 5xx answers in the window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayErrors" }
        "400": { description: since or until isn't an ISO 8601 time }
        "401": { description: Not through the gateway }
components:
  schemas:
    Freshness:
      type: object
      required: [prefix, generated_at, rows_last_60s, prefix_rows_last_60s, points]
      properties:
        prefix: { type: string }
        generated_at: { type: string, format: date-time }
        rows_last_60s: { type: integer, description: point_history rows of the last 60 s (caller's sites) }
        prefix_rows_last_60s: { type: integer }
        poll_s_source: { type: string }
        points:
          type: array
          items:
            type: object
            required: [uri, last_ts, age_s, poll_s, samples_last_hour]
            properties:
              uri: { type: string }
              last_ts: { type: string, format: date-time }
              age_s: { type: number, description: Seconds since last_ts, by the database clock }
              poll_s: { type: [number, "null"] }
              samples_last_hour: { type: integer }
    GatewayErrors:
      type: object
      required: [available, since, until, count, by_status, by_route, first, last, samples]
      properties:
        available: { type: boolean }
        detail: { type: string }
        since: { type: [string, "null"] }
        until: { type: [string, "null"] }
        count: { type: integer }
        by_status: { type: object, additionalProperties: { type: integer } }
        by_route:
          type: array
          items:
            type: object
            required: [route, status, count]
            properties:
              route: { type: string, example: "GET /api/read" }
              status: { type: integer }
              count: { type: integer }
        first: { type: [string, "null"] }
        last: { type: [string, "null"] }
        samples:
          type: array
          items:
            type: object
            properties:
              ts: { type: string }
              status: { type: integer }
              route: { type: string }
              upstream_status: { type: [string, "null"] }
    OrphanedPoint:
      type: object
      required: [id, kind, reason]
      properties:
        id: { type: string }
        kind: { type: string, enum: [derivation_gone, no_equip] }
        reason: { type: string }
        dis: { type: [string, "null"] }
        equip: { type: [string, "null"] }
        last_ts: { type: [string, "null"], format: date-time }
        last_value: {}
    Source:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true }
        secrets_set: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        health: { type: string, enum: [disabled, misconfigured, pending, failing, ok] }
        last_run_at: { type: [string, "null"], format: date-time }
        last_ok_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        last_result: {}
    ComponentState:
      type: object
      required: [id, label, layer, service, state]
      properties:
        id: { type: string }
        label: { type: string }
        layer: { type: string, enum: [platform, jobs, tools, building] }
        service: { type: string }
        state: { type: string, enum: [ok, quiet, degraded, down] }
        detail: { type: ["string", "null"] }
        href:
          type: string
          description: A page to go to about this card (building cards only).
    EdgeNode:
      type: object
      required: [site_id, instance_id, kind, label, online]
      properties:
        site_id: { type: string }
        instance_id: { type: string }
        kind: { type: string, enum: [local, remote] }
        label: { type: string }
        online: { type: boolean }
        last_seen: { type: [string, "null"] }
        version: { type: [string, "null"] }
        started_at: { type: [string, "null"] }
        devices: { type: [integer, "null"] }
        pending_devices: { type: [integer, "null"] }
        bacnet_connections: { type: [integer, "null"] }
        modbus_connections: { type: [integer, "null"] }
        networks:
          type: array
          items: { type: string }
          description: Subnets the node sits on, as CIDRs, when its Windrow reports them (prefills a Modbus sweep).
        allowed_prefixes:
          type: array
          items: { type: string }
          description: >-
            Topic prefixes this node's connectors must sit under: "fbf" for the
            local node (what mqtt_listener ingests), the site's topic_prefixes
            for a remote node's broker account (the broker drops the rest).
            Absent when unknown.
        site_name: { type: string, description: "Remote nodes: the Baler site its broker account belongs to." }
        announced: { type: integer, description: "Devices that have announced themselves to this node (Windrow device announce). Absent from a Windrow without announce." }
        announced_online: { type: integer, description: Of those, how many announced within the last 3 intervals. }
        announce_rejected: { type: integer, description: "Announcement datagrams the node refused (source outside --announce-allow, bad signature, too old)." }
        error: { type: [string, "null"] }
    OpsStatus:
      type: object
      required: [summary, generated_at, building, platform, jobs, tools, attention, first_actions]
      properties:
        summary: { type: string, enum: [ok, degraded, down] }
        generated_at: { type: string, format: date-time }
        building:
          type: object
          required: [points_seen_last_hour, open_faults, disabled_derivation_targets, needs_first_org, cards]
          properties:
            last_ingest_at:
              type: ["string", "null"]
              format: date-time
            points_seen_last_hour: { type: integer }
            open_faults: { type: integer }
            disabled_derivation_targets: { type: integer }
            needs_first_org: { type: boolean }
            cards:
              type: array
              description: >-
                The Building row, judged server-side. A card that isn't ok also
                appears in `attention` and counts toward `summary`.
              items: { $ref: "#/components/schemas/ComponentState" }
        platform:
          type: array
          items: { $ref: "#/components/schemas/ComponentState" }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/ComponentState" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ComponentState" }
        attention:
          type: array
          items: { $ref: "#/components/schemas/ComponentState" }
        first_actions:
          type: array
          items:
            type: object
            required: [id, label, href, description, enabled]
            properties:
              id: { type: string }
              label: { type: string }
              href: { type: string }
              description: { type: string }
              enabled: { type: boolean }
