openapi: 3.1.0
info:
  title: Baler Ops API
  version: 0.1.0
  description: >
    Building-engineer control-plane status. Aggregates platform and job
    health into plain-language states (ok / quiet / degraded / down, and
    off for a job this install doesn't run, such as backups that never reported).
paths:
  /status:
    get:
      operationId: getOpsStatus
      summary: Aggregated Ops status
      description: >-
        Service states come from a background probe round every 10 s (a probe that
        hasn't answered within 2.5 s counts as down), so this answers without
        waiting on any probe. The Building counts are read per request, for the
        caller's sites.
      responses:
        "200":
          description: Status document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsStatus"
        "401":
          description: Missing or invalid gateway secret
  /openapi.yaml:
    get:
      operationId: getOpsOpenAPI
      summary: This OpenAPI document
      responses:
        "200":
          description: YAML OpenAPI spec
  /sources/kinds:
    get:
      operationId: listSourceKinds
      summary: The source kinds and the settings each declares (admin)
      responses:
        "200":
          description: kind -> {label, help, fields[{name, label, required, secret, type, default, help}]}
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /orphans:
    get:
      operationId: listOrphanedPoints
      summary: Points nothing maintains any more
      description: >-
        admin-only, limited to the caller's sites. `derivation_gone`: a computed output
        whose derivation was deleted (nothing will write it again). `no_equip`: a point
        linked to no equipment. Each with its last value, for review before removing.
      responses:
        "200":
          description: Orphaned points.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrphanedPoint" }
        "401":
          description: Not through the gateway.
  /orphans/remove:
    post:
      operationId: removeOrphanedPoints
      summary: Remove orphaned points
      description: >-
        admin-only. Deletes each point's graph record (and its history rows only if
        `purge_history`), logged in the record edit audit. Ids that aren't currently
        orphans the caller can see are skipped, not touched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
                purge_history: { type: boolean, default: false }
      responses:
        "200":
          description: What was removed and what was skipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: array, items: { type: string } }
                  skipped: { type: array, items: { type: string } }
        "400":
          description: Malformed body.
        "401":
          description: Not through the gateway.
  /sources:
    get:
      operationId: listSources
      summary: Every configured source with its health (admin)
      description: >-
        health is disabled, misconfigured (missing lists the required
        settings), pending (enabled, not run yet), failing (last_error says
        why) or ok. Secret settings are never returned - secrets_set names
        the ones that are set. Baler#20.
      responses:
        "200":
          description: Sources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Source" }
    post:
      operationId: createSource
      summary: Add a source (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string, enum: [haystack, sql, openmeteo, energystar] }
                name: { type: string }
                settings: { type: object, additionalProperties: true }
                enabled: { type: boolean, description: "needs every required setting" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400":
          description: Unknown kind or setting, a bad value, or enabled while settings are missing.
  /sources/{id}:
    patch:
      operationId: updateSource
      summary: Rename, change settings, enable or disable (admin)
      description: >-
        Settings merge; a null or empty value clears one. A secret is replaced
        only when sent. Enabling needs every required setting. The runner
        picks changes up within 30s.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                settings: { type: object, additionalProperties: true }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400":
          description: A bad setting, or enabling with settings missing.
        "404":
          description: No such source.
    delete:
      operationId: deleteSource
      summary: Remove a source (admin); data it already pulled stays
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted.
        "404":
          description: No such source.
  /edges:
    get:
      summary: Edge nodes (Windrow instances) the Connectors page can manage
      description: >-
        The Windrow beside Baler (WINDROW_API_URL, reached over HTTP) as
        site_id/instance_id "local", plus every remote Windrow that has
        published a cmd/<site>/<instance>/status heartbeat. A remote node is
        online while its last heartbeat says so and is under 3 minutes old.
        Viewer; whole-org logins only.
      responses:
        "200":
          description: Nodes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EdgeNode" } }
        "401": { description: Not through the gateway }
        "502": { description: "No local Windrow, and the MQTT broker can't be reached" }
  /edges/{site}/{instance}/actions/{action}:
    post:
      summary: Run one action on an edge node
      description: >-
        Windrow's command-channel vocabulary, the same for local and remote
        nodes. Reads (viewer) - list_devices, list_connections,
        modbus_list_connections, list_announced (devices that announced
        themselves: name, address, services, online, last_seen, history). Changes and scans (admin) - add_device,
        set_device_status {id, status}, recheck_credentials {id},
        set_credential {target device|connection|modbus_connection, id,
        credential}, create_connection, update_connection {id, ...} (both,
        and the modbus_ versions, take device_name: the name a device
        announces itself under, or a DNS name; BACnet updates may change
        device_address),
        delete_connection {id}, the modbus_ versions, discover, learn
        {device_address, device_instance}, modbus_discover {cidr},
        modbus_test_read {host, register, port?, device_id?} (reads one
        holding register once; stores nothing), and background jobs for the
        slow ones - start_job {job: discover|learn|modbus_discover, ...that
        action's fields} answers at once with a job id, get_job {id} returns
        its state (running|done|failed), progress ({done, total} for a sweep)
        and result, list_jobs. Use the jobs for scans and learns: the edge
        node gives up on a synchronous one after 15 s. The body is the
        action's fields. list_connections and modbus_list_connections results carry
        each connection's poll_status (state, last_poll_at,
        last_success_at, last_value_at, last_error, last_error_at,
        failing_count, failing_points) when the node's Windrow reports it.
      parameters:
        - { name: site, in: path, required: true, schema: { type: string }, description: '"local" for the Windrow beside Baler' }
        - { name: instance, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The node's answer
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result: {}
        "400": { description: "Unknown action, bad body, a topic_prefix outside the node's allowed prefixes (checked on create, and on update when it changes the prefix), or the node refused it" }
        "404": { description: No local Windrow configured }
        "502": { description: "The node errored or can't be reached" }
        "504": { description: "A remote node didn't answer in time (offline commands expire, never apply late)" }
  /mapping/proposals:
    get:
      operationId: listMappingProposals
      summary: The mapping review queue, grouped by naming pattern
      description: >-
        Held mapping proposals (proposed or escalated, from the tagging model step)
        grouped by naming pattern and ranked by impact: tier 1 when a fault rule needs a
        member (its topic_glob matches, or a candidate is a class a brick_class rule
        targets), tier 2 when a member is on a site with an active Cx project, tier 3 the
        rest; larger groups first within a tier. Scoped to the caller's sites.
      responses:
        "200":
          description: Ranked groups.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MappingGroup" }
        "401":
          description: Not through the gateway.
  /mapping/summary:
    get:
      operationId: mappingSummary
      summary: How much of the building Baler understands
      description: >-
        Points by state: classified by a rule, a site rule (an approved pattern), memory,
        the model step or a person; proposed; escalated; unmapped. Scoped to the
        caller's sites.
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                required: [total, understood, understood_pct, states]
                properties:
                  total: { type: integer }
                  understood: { type: integer }
                  understood_pct: { type: number }
                  states:
                    type: object
                    additionalProperties: { type: integer }
                    description: rule, site_rule, memory, model, person, proposed, escalated, unmapped.
        "401":
          description: Not through the gateway.
  /mapping/decide:
    post:
      operationId: decideMappingProposals
      summary: Answer one proposal or a whole pattern group
      description: >-
        operator. `accept` writes `brick_class` (checked against Brick) to every proposal's
        entity through the same path as a hand edit, logged in the record edit audit;
        `save_rule` also saves each pattern as a site rule the model step applies to later
        points. `escalate` assigns them to `assignee` and notifies through the webhook
        registry (event `mapping.escalated`). `site_visit` records that the points need
        identifying on site and opens a Cx issue on the active project covering them, if
        there is one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, items: { type: string } }
                action: { type: string, enum: [accept, escalate, site_visit] }
                brick_class: { type: string, description: "accept: the class, a candidate or any other Brick class." }
                save_rule: { type: boolean, default: false }
                assignee: { type: string, description: "escalate: who should answer." }
                note: { type: string }
      responses:
        "200":
          description: What was done.
          content:
            application/json:
              schema:
                type: object
                required: [action, decided]
                properties:
                  action: { type: string }
                  decided: { type: integer }
                  brick_class: { type: string }
                  site_rules: { type: array, items: { type: string } }
                  assignee: { type: string }
                  notified: { type: integer }
                  cx_issue: { type: [string, "null"] }
                  hint: { type: [string, "null"] }
        "400":
          description: Bad action, unknown Brick class, or no assignee to escalate to.
        "401":
          description: Not through the gateway.
        "404":
          description: A proposal id that doesn't exist or isn't on the caller's sites.
        "409":
          description: A proposal that was already decided.
  /mapping/relationships:
    get:
      operationId: listRelationshipProposals
      summary: Open equipment relationship proposals
      description: >-
        Proposed equipment groupings (points with no equipment, grouped by their topic's
        parent: predicate hasPoint) and feeds edges (an AHU whose supply air temperature a
        VAV's discharge air temperature tracks), each with its evidence. Scoped to the
        caller's sites.
      responses:
        "200":
          description: Open proposals.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    subject: { type: string }
                    predicate: { type: string, enum: [hasPoint, feeds] }
                    objects: { type: array, items: { type: string } }
                    evidence: { type: object }
                    status: { type: string }
        "401":
          description: Not through the gateway.
  /mapping/relationships/decide:
    post:
      operationId: decideRelationshipProposals
      summary: Accept (write the edges) or reject relationship proposals
      description: >-
        operator. Accepting a hasPoint proposal creates the equipment and links its points;
        a feeds proposal writes brick:feeds and brick:isFedBy. Logged in the record edit
        audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids: { type: array, items: { type: string } }
                action: { type: string, enum: [accept, reject] }
      responses:
        "200":
          description: How many were decided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  action: { type: string }
                  decided: { type: integer }
        "400":
          description: Malformed body.
        "401":
          description: Not through the gateway.
        "404":
          description: A proposal that isn't open or isn't on the caller's sites.
  /conventions:
    get:
      operationId: listConventions
      summary: Saved site naming conventions
      responses:
        "200":
          description: Every saved convention.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Convention" }
        "401":
          description: Not through the gateway.
    post:
      operationId: saveConvention
      summary: Save (create, or update by id) a naming convention
      description: operator. Every code's class is checked against Brick; an unknown one is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Convention" }
      responses:
        "200":
          description: The saved convention, codes normalised and classes in Brick's spelling.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Convention" }
        "400":
          description: A malformed annotation, or a class Brick doesn't have.
        "401":
          description: Not through the gateway.
  /conventions/preview:
    post:
      operationId: previewConvention
      summary: Dry-run a convention over the caller's points
      description: >-
        Writes nothing. How many points the templates match and classify, the unknown
        point and equipment codes ranked by how many points each would settle (with
        example labels), and a sample of labels no template matched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Convention"
                - type: object
                  properties:
                    only_unclassified: { type: boolean, default: true, description: Count only points with no Brick class yet. }
      responses:
        "200":
          description: What the convention would do.
          content:
            application/json:
              schema:
                type: object
                required: [points, matched, classified, unknown_point_codes]
                properties:
                  points: { type: integer }
                  matched: { type: integer }
                  classified: { type: integer }
                  by_template: { type: array, items: { type: integer } }
                  unknown_point_codes:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        points: { type: integer }
                        examples: { type: array, items: { type: string } }
                  unknown_equip_codes:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        points: { type: integer }
                  equipment: { type: integer }
                  unmatched_sample: { type: array, items: { type: string } }
        "400":
          description: A malformed annotation, or a class Brick doesn't have.
        "401":
          description: Not through the gateway.
  /conventions/{id}/apply:
    post:
      operationId: applyConvention
      summary: Classify every point (and its equipment) a saved convention settles
      description: >-
        operator. Points with a known code and no Brick class yet get the code's class,
        written like a hand edit and logged in the record edit audit (action
        `convention`); their equipment gets the equip code's class when all its matched
        points agree. Never overrides an existing class.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: How many were classified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  points: { type: integer }
                  equipment: { type: integer }
        "401":
          description: Not through the gateway.
        "404":
          description: No such convention.
  /conventions/{id}:
    delete:
      operationId: deleteConvention
      summary: Delete a saved convention (classes it wrote stay)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted.
        "401":
          description: Not through the gateway.
        "404":
          description: No such convention.
  /freshness:
    get:
      operationId: getFreshness
      summary: Ingest rate and per-point freshness under a topic prefix
      description: >-
        Read-only, for post-deploy verification (tools/live-check, Baler#178)
        so it needs no database access. rows_last_60s counts point_history
        rows of the last 60 s; points lists every point under the prefix
        that reported in the last 7 days, with when it last did. poll_s is
        not stored anywhere Baler sees: it is the point's mean sample spacing
        over its last hour of data (null with a single sample), which is the
        poll interval for an ordinary point and longer for a COV one. Counts
        and points are limited to the caller's sites. Viewer.
      parameters:
        - { name: prefix, in: query, required: true, schema: { type: string, example: fbf/home },
            description: "A topic prefix: letters, digits, - _ . ~ separated by /" }
      responses:
        "200":
          description: Freshness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Freshness" }
        "400": { description: Missing or malformed prefix }
        "401": { description: Not through the gateway }
  /metrics:
    get:
      operationId: getOpsMetrics
      summary: Overload signals as Prometheus text
      description: >-
        Prometheus text exposition (format 0.0.4) of what /status judges ingest
        and the rule daemons by (#235): end-to-end ingest lag
        (baler_ingest_newest_reading_age_seconds) and per source prefix,
        the listener's queue depth, the age of its oldest uncommitted reading,
        last batch write time, redelivered (DUP) messages and throughput, the
        broker's dropped-message counter, each rule daemon's reading-feed lag
        and misses, and their cycle times and evaluations. The scale ladder
        and the post-deploy verify job read the same endpoint. Process-wide
        numbers, so a site-restricted login can't read it (gateway resource
        "metrics"); per-prefix lines are limited to the caller's sites.
        Viewer, or an API key.
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: { type: string }
        "401": { description: Not through the gateway }
  /gateway-errors:
    get:
      operationId: getGatewayErrors
      summary: The gateway's 5xx answers in a time window
      description: >-
        Read-only, for post-deploy verification (Baler#178): every 5xx the
        gateway answered between since and until, from the 5xx-only log
        gateway/nginx.conf writes to the gateway-logs volume (path only, ids
        folded to :id; never query strings or headers). available is false
        when that log isn't there, which means "can't tell", not zero.
        Operator; whole-org logins only (the log spans every org and site).
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: 5xx answers in the window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayErrors" }
        "400": { description: since or until isn't an ISO 8601 time }
        "401": { description: Not through the gateway }
  # Building lifecycle record (epic #221): the document store (#201).
  # Full detail: docs-site/pages/documents.mdx.
  /documents:
    get:
      operationId: listDocuments
      summary: The org's documents (filters kind, target_kind, target)
      responses:
        "200": {description: Documents, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: uploadDocument
      summary: Upload a file (the body is the file; filename, kind, title in the query)
      parameters:
        - {name: filename, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: title, in: query, schema: {type: string}}
      requestBody: {content: {application/octet-stream: {schema: {type: string, format: binary}}}}
      responses:
        "200": {description: "Already stored: the existing document", content: {application/json: {schema: {type: object}}}}
        "201": {description: Stored, content: {application/json: {schema: {type: object}}}}
        "413": {description: Over 100 MB}
  /documents/search:
    get:
      operationId: searchDocuments
      summary: Pages matching q, best first, each with a citation (document and page)
      parameters: [{name: q, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: Hits, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /documents/kinds:
    get:
      operationId: documentKinds
      summary: Document kinds and link target kinds
      responses:
        "200": {description: Kinds, content: {application/json: {schema: {type: object}}}}
  /documents/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getDocument
      summary: A document's metadata and links
      responses:
        "200": {description: The document, content: {application/json: {schema: {type: object}}}}
        "404": {description: No such document}
    patch:
      operationId: patchDocument
      summary: Edit title, kind, notes, site_id, filename (audited)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: The document, content: {application/json: {schema: {type: object}}}}
    delete:
      operationId: deleteDocument
      summary: Soft delete (admin)
      responses:
        "200": {description: Deleted, content: {application/json: {schema: {type: object}}}}
  /documents/{id}/{part}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: part, in: path, required: true, schema: {type: string, enum: [content, verify, audit]}}
    get:
      operationId: getDocumentPart
      summary: The file itself, an integrity re-hash, or the audit trail
      responses:
        "200": {description: The file (content) or JSON}
  /documents/{id}/pages/{page}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: page, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getDocumentPage
      summary: One page's text and citation
      responses:
        "200": {description: The page, content: {application/json: {schema: {type: object}}}}
  /documents/{id}/links:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      operationId: linkDocument
      summary: Link the document (or a page) to a position, asset, space, system or phase
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: The link, content: {application/json: {schema: {type: object}}}}
  /documents/{id}/links/{link_id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: link_id, in: path, required: true, schema: {type: string}}
    delete:
      operationId: unlinkDocument
      summary: Remove a link
      responses:
        "200": {description: Removed, content: {application/json: {schema: {type: object}}}}
  # Building lifecycle record (epic #221): positions vs assets (#197).
  # Full field list: docs-site/pages/assets.mdx.
  /assets:
    get:
      operationId: listAssets
      summary: Assets of the caller's org (filters q, status, position, manufacturer, type)
      responses:
        "200": {description: Assets with status and current position, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: createAsset
      summary: Add an asset (make, model, serial, cost ...)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: The asset, content: {application/json: {schema: {type: object}}}}
        "400": {description: Invalid fields}
  /assets/changes:
    get:
      operationId: assetChanges
      summary: Replacements in a window (since, until, type, manufacturer)
      responses:
        "200": {description: Replacements, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /assets/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: getAsset
      summary: An asset and its install/remove history
      responses:
        "200": {description: The asset, content: {application/json: {schema: {type: object}}}}
        "404": {description: No such asset}
    patch:
      operationId: patchAsset
      summary: Correct an asset's fields (audited)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: The asset, content: {application/json: {schema: {type: object}}}}
  /assets/{id}/{action}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: action, in: path, required: true, schema: {type: string, enum: [install, remove, retire]}}
    post:
      operationId: assetAction
      summary: Install into a position, remove (reason required), or retire
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: The appended event, content: {application/json: {schema: {type: object}}}}
        "409": {description: The position or asset isn't free}
  /assets/{id}/audit:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: assetAudit
      summary: Every change to the asset, newest first
      responses:
        "200": {description: Audit entries, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /positions/history:
    get:
      operationId: positionHistory
      summary: Every asset a position has held
      parameters: [{name: uri, in: query, required: true, schema: {type: string}}]
      responses:
        "200": {description: History, content: {application/json: {schema: {type: object}}}}
  /positions/asset-at:
    get:
      operationId: positionAssetAt
      summary: Which asset was in a position at a moment
      parameters:
        - {name: uri, in: query, required: true, schema: {type: string}}
        - {name: at, in: query, schema: {type: string}}
      responses:
        "200": {description: "The interval and asset (asset null if empty)", content: {application/json: {schema: {type: object}}}}
  /positions/replace:
    post:
      operationId: replaceInPosition
      summary: Remove what's in a position and install another asset at the same instant
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: The removed and installed events, content: {application/json: {schema: {type: object}}}}
  # Deferred maintenance, service life, FCI (#200). docs-site/pages/deferred-maintenance.mdx.
  /deferred:
    get:
      operationId: listDeferred
      summary: The deferred-maintenance register (filter status)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: createDeferred
      summary: Add deferred work (cost, risk, asset or position)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: OK, content: {application/json: {schema: {type: object}}}}
  /deferred/fci:
    get:
      operationId: deferredFCI
      summary: FCI roll-up, with how many assets lack a replacement value
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
  /deferred/capital-plan:
    get:
      operationId: capitalPlan
      summary: Per year, end-of-life assets and targeted deferred work
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /deferred/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      operationId: patchDeferred
      summary: Edit or close (closing needs a resolution)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
  /service-life:
    get:
      operationId: listServiceLife
      summary: The org's service-life references
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: setServiceLife
      summary: Set a type's expected life with its reference and retrieval date
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: object}}}}
  /service-life/assets:
    get:
      operationId: serviceLifeAssets
      summary: Installed assets with age and remaining life
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /assets/{id}/values:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: listAssetValues
      summary: Replacement-value history
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: addAssetValue
      summary: Add a dated replacement-value estimate
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: OK, content: {application/json: {schema: {type: object}}}}
  # PM schedules (#199). docs-site/pages/pm-schedules.mdx.
  /pm/tasks:
    get:
      operationId: listPMTasks
      summary: Every PM task
      responses:
        "200": {description: Tasks, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: createPMTask
      summary: Add a PM task (calendar, run_hours or condition)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: The task, content: {application/json: {schema: {type: object}}}}
  /pm/tasks/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      operationId: patchPMTask
      summary: Edit or pause a task (audited)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: The task, content: {application/json: {schema: {type: object}}}}
  /pm/tasks/{id}/complete:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      operationId: completePMTask
      summary: Record PM done on an asset
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: The completion, content: {application/json: {schema: {type: object}}}}
  /pm/tasks/{id}/completions:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: listPMCompletions
      summary: Completions of a task
      responses:
        "200": {description: Completions, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /pm/due:
    get:
      operationId: pmDue
      summary: Due PM work, most urgent first (filter status)
      responses:
        "200": {description: Due items, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /pm/due/export:
    get:
      operationId: pmDueExport
      summary: Due work as CSV, or active tasks as COBie Job rows (format csv or cobie-job)
      responses:
        "200": {description: CSV, content: {text/csv: {schema: {type: string}}}}
  # Warranties on assets (#198). docs-site/pages/warranties.mdx.
  /assets/{id}/warranties:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: listAssetWarranties
      summary: The asset's warranties with status and days left
      responses:
        "200": {description: Warranties, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: createWarranty
      summary: Add a warranty (kind, provider, starts_on, ends_on or duration_months, terms, source)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "201": {description: The warranty, content: {application/json: {schema: {type: object}}}}
  /warranties:
    get:
      operationId: listWarranties
      summary: All warranties (filter status)
      responses:
        "200": {description: Warranties, content: {application/json: {schema: {type: array, items: {type: object}}}}}
  /warranties/alerts:
    get:
      operationId: warrantyAlerts
      summary: Warranties expiring within within_days, and failures under warranty
      responses:
        "200": {description: Alerts, content: {application/json: {schema: {type: object}}}}
  /warranties/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    patch:
      operationId: patchWarranty
      summary: Correct a warranty (audited)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: The warranty, content: {application/json: {schema: {type: object}}}}
  /warranties/{id}/void:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    post:
      operationId: voidWarranty
      summary: Void a warranty entered in error (reason)
      requestBody: {content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: The warranty, content: {application/json: {schema: {type: object}}}}
components:
  schemas:
    Freshness:
      type: object
      required: [prefix, generated_at, rows_last_60s, prefix_rows_last_60s, points]
      properties:
        prefix: { type: string }
        generated_at: { type: string, format: date-time }
        rows_last_60s: { type: integer, description: point_history rows of the last 60 s (caller's sites) }
        prefix_rows_last_60s: { type: integer }
        poll_s_source: { type: string }
        points:
          type: array
          items:
            type: object
            required: [uri, last_ts, age_s, poll_s, samples_last_hour]
            properties:
              uri: { type: string }
              last_ts: { type: string, format: date-time }
              age_s: { type: number, description: Seconds since last_ts, by the database clock }
              poll_s: { type: [number, "null"] }
              samples_last_hour: { type: integer }
    GatewayErrors:
      type: object
      required: [available, since, until, count, by_status, by_route, first, last, samples]
      properties:
        available: { type: boolean }
        detail: { type: string }
        since: { type: [string, "null"] }
        until: { type: [string, "null"] }
        count: { type: integer }
        by_status: { type: object, additionalProperties: { type: integer } }
        by_route:
          type: array
          items:
            type: object
            required: [route, status, count]
            properties:
              route: { type: string, example: "GET /api/read" }
              status: { type: integer }
              count: { type: integer }
        first: { type: [string, "null"] }
        last: { type: [string, "null"] }
        samples:
          type: array
          items:
            type: object
            properties:
              ts: { type: string }
              status: { type: integer }
              route: { type: string }
              upstream_status: { type: [string, "null"] }
    Convention:
      type: object
      required: [templates]
      properties:
        id: { type: string, description: Omit to create. }
        name: { type: string }
        scope_prefix: { type: string, description: "The topic prefix it applies under; empty for every point you can see." }
        templates:
          type: array
          items: { type: string }
          description: >-
            Annotated labels, tried in order: literal text with `{role:text}` fields,
            roles equip_type, equip_id, point and ignore, e.g.
            `fbf/{equip_type:ahu}-{equip_id:1}/{point:DIS-AIR-TEM}-{ignore:12}`.
        point_codes:
          type: object
          additionalProperties: { type: string }
          description: Point code (any case and punctuation) -> Brick class.
        equip_codes:
          type: object
          additionalProperties: { type: string }
          description: Equipment code -> Brick class.
    MappingGroup:
      type: object
      required: [pattern, label, kind, count, tier, candidates, refused_because, members]
      properties:
        pattern: { type: string, description: "kind|label shape|markers|unit - digits as {n}." }
        label: { type: string }
        kind: { type: string, enum: [point, equip] }
        count: { type: integer }
        tier: { type: integer, enum: [1, 2, 3] }
        why_first: { type: string }
        candidates:
          type: array
          items:
            type: object
            properties:
              brick_class: { type: string }
              reason: { type: string }
              source: { type: string, description: "model, ranker or site rule." }
        candidate_classes: { type: array, items: { type: string } }
        refused_because: { type: string }
        escalated: { type: integer }
        assignee: { type: [string, "null"] }
        evidence: { type: object, description: "What the model step saw for the first member: label, markers, values, siblings, value_stats." }
        asks: { type: array, items: { type: object } }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              uri: { type: string }
              label: { type: string }
              status: { type: string, enum: [proposed, escalated] }
              assignee: { type: [string, "null"] }
              note: { type: [string, "null"] }
              unit: { type: [string, "null"] }
              value_stats: { type: [object, "null"] }
    OrphanedPoint:
      type: object
      required: [id, kind, reason]
      properties:
        id: { type: string }
        kind: { type: string, enum: [derivation_gone, no_equip] }
        reason: { type: string }
        dis: { type: [string, "null"] }
        equip: { type: [string, "null"] }
        last_ts: { type: [string, "null"], format: date-time }
        last_value: {}
    Source:
      type: object
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true }
        secrets_set: { type: array, items: { type: string } }
        missing: { type: array, items: { type: string } }
        health: { type: string, enum: [disabled, misconfigured, pending, failing, ok] }
        last_run_at: { type: [string, "null"], format: date-time }
        last_ok_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        last_result: {}
    ComponentState:
      type: object
      required: [id, label, layer, service, state]
      properties:
        id: { type: string }
        label: { type: string }
        layer: { type: string, enum: [platform, jobs, tools, building] }
        service: { type: string }
        state: { type: string, enum: [ok, quiet, degraded, down, off] }
        detail: { type: ["string", "null"] }
        href:
          type: string
          description: A page to go to about this card (building cards only).
    EdgeNode:
      type: object
      required: [site_id, instance_id, kind, label, online]
      properties:
        site_id: { type: string }
        instance_id: { type: string }
        kind: { type: string, enum: [local, remote] }
        label: { type: string }
        online: { type: boolean }
        last_seen: { type: [string, "null"] }
        version: { type: [string, "null"] }
        started_at: { type: [string, "null"] }
        devices: { type: [integer, "null"] }
        pending_devices: { type: [integer, "null"] }
        bacnet_connections: { type: [integer, "null"] }
        modbus_connections: { type: [integer, "null"] }
        networks:
          type: array
          items: { type: string }
          description: Subnets the node sits on, as CIDRs, when its Windrow reports them (prefills a Modbus sweep).
        allowed_prefixes:
          type: array
          items: { type: string }
          description: >-
            Topic prefixes this node's connectors must sit under: "fbf" for the
            local node (what mqtt_listener ingests), the site's topic_prefixes
            for a remote node's broker account (the broker drops the rest).
            Absent when unknown.
        site_name: { type: string, description: "Remote nodes: the Baler site its broker account belongs to." }
        announced: { type: integer, description: "Devices that have announced themselves to this node (Windrow device announce). Absent from a Windrow without announce." }
        announced_online: { type: integer, description: Of those, how many announced within the last 3 intervals. }
        announce_rejected: { type: integer, description: "Announcement datagrams the node refused (source outside --announce-allow, bad signature, too old)." }
        error: { type: [string, "null"] }
    OpsStatus:
      type: object
      required: [summary, generated_at, building, platform, jobs, tools, attention, first_actions]
      properties:
        summary: { type: string, enum: [ok, degraded, down] }
        generated_at: { type: string, format: date-time }
        building:
          type: object
          required: [points_seen_last_hour, open_faults, disabled_derivation_targets, needs_first_org, cards]
          properties:
            last_ingest_at:
              type: ["string", "null"]
              format: date-time
            points_seen_last_hour: { type: integer }
            open_faults: { type: integer }
            disabled_derivation_targets: { type: integer }
            needs_first_org: { type: boolean }
            reading_feed:
              type: object
              description: >-
                Each rule daemon's place in the reading feed (#243), by consumer
                (fault_detector, derivation_engine): readings waiting for it, how old
                the oldest is, and readings it missed because it fell more than the
                feed's retention window behind (BALER_FEED_RETENTION_S). A miss, or
                lag over OPS_FEED_LAG_DEGRADED_SECONDS, turns its card degraded.
              additionalProperties:
                type: object
                properties:
                  seq: { type: integer, description: The last feed batch it finished. }
                  lag_batches: { type: integer }
                  lag_readings: { type: integer }
                  lag_s: { type: number, description: Age in seconds of the oldest batch it hasn't read. }
                  missed_readings: { type: integer }
                  missed_batches: { type: integer }
                  last_missed_at: { type: ["string", "null"], format: date-time }
                  updated_at: { type: string, format: date-time }
            ingest:
              type: object
              description: >-
                Overload numbers (#235), the same ones GET /metrics exports: lag_s is
                now minus the newest stored reading; the queue figures are the busiest
                listener worker's. An oldest uncommitted reading older than
                OPS_QUEUE_AGE_DEGRADED_SECONDS (or a queue 80% full) turns the Ingest
                listener card degraded, older than OPS_QUEUE_AGE_DOWN_SECONDS down;
                a broker drop in the last hour degraded. Null fields: not reported
                (no listener heartbeat yet).
              properties:
                lag_s: { type: ["number", "null"] }
                queue: { type: ["integer", "null"] }
                queue_max: { type: ["integer", "null"] }
                queue_oldest_age_s: { type: ["number", "null"] }
                last_flush_s: { type: ["number", "null"] }
                readings_per_s: { type: ["number", "null"] }
                redelivered: { type: ["integer", "null"] }
                workers: { type: ["integer", "null"] }
                broker_dropped_since_start: { type: ["integer", "null"] }
                broker_last_drop_at: { type: ["string", "null"], format: date-time }
            cards:
              type: array
              description: >-
                The Building row, judged server-side. A card that isn't ok also
                appears in `attention` and counts toward `summary`.
              items: { $ref: "#/components/schemas/ComponentState" }
        platform:
          type: array
          items: { $ref: "#/components/schemas/ComponentState" }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/ComponentState" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ComponentState" }
        attention:
          type: array
          items: { $ref: "#/components/schemas/ComponentState" }
        alerts:
          type: array
          description: >-
            Alerts baler.alerts has sent and not yet cleared (#277). Empty for a
            caller limited to some sites, and before the alerter has run.
          items:
            type: object
            required: [key, state, severity, title]
            properties:
              key: { type: string, description: "e.g. component:data_api, disk:/pgdata, restarts:baler-fault-detector" }
              state: { type: string, enum: [firing] }
              severity: { type: string, enum: [critical, warning] }
              title: { type: string }
              detail: { type: ["string", "null"] }
              opened_at: { type: ["string", "null"], format: date-time }
              last_seen_at: { type: ["string", "null"], format: date-time }
              last_sent_at: { type: ["string", "null"], format: date-time }
        processes:
          type: array
          description: >-
            Per process (tracing service name): starts and unhandled exceptions
            counted by baler.errors (#277). Empty for a caller limited to some sites.
          items:
            type: object
            required: [service, starts, errors]
            properties:
              service: { type: string }
              starts: { type: integer }
              errors: { type: integer }
              last_error_at: { type: ["string", "null"], format: date-time }
              last_error: { type: ["string", "null"] }
              last_start_at: { type: ["string", "null"], format: date-time }
        first_actions:
          type: array
          items:
            type: object
            required: [id, label, href, description, enabled]
            properties:
              id: { type: string }
              label: { type: string }
              href: { type: string }
              description: { type: string }
              enabled: { type: boolean }
