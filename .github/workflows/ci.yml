name: CI

on:
  push:
    branches: [main]
    # Plans and notes only: no CI run, so no redeploy of the nash-srv demo
    # (deploy.yml runs off a finished CI run).
    paths-ignore: ["todo/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # windrow/: mock_hospital is the mapping eval's corpus (#180)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # openhay's Rust build is the slow part of the install (~1 min): build
      # its wheel once per openhay commit and cache it (#23).
      - id: openhay
        # the commit pyproject.toml's haystack extra pins, not openhay's main
        run: echo "sha=$(grep -oP 'openhay@\K[0-9a-f]{40}' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: openhay-wheel
        with:
          path: openhay-wheel
          key: openhay-wheel-${{ steps.openhay.outputs.sha }}
      - if: steps.openhay-wheel.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w openhay-wheel "openhay @ git+https://github.com/jacobnash/openhay@${{ steps.openhay.outputs.sha }}#subdirectory=crates/openhay-py"
      - run: pip install openhay-wheel/openhay-*.whl
      # Not the `haystack` extra: that's openhay alone, already installed from
      # the cached wheel, and pip would rebuild it from git (a different URL).
      # Without openhay tests/test_haystack_api.py skips; without the
      # cx-gl36 extra (pandas) tests/test_commissioning_gl36.py does, and
      # without cx-spec (pdfplumber) the PDF tests in test_commissioning_llm.py.
      - run: pip install -e ".[dev,validate,cx-gl36,cx-spec,export,offsite]"
      # parallel across the runner's cores: ~3 min serial (#27)
      - run: pytest -m "not integration" -n auto
      # Mapping eval (#180): rules only, no model key, a few seconds. Prints
      # the score to the log and fails on a regression against the baseline.
      - run: python -m baler.mapping_eval --check

  # The static checks and the live LLM check, split out of `unit` so they run
  # beside its pytest instead of after it (~35 s off what was, once the
  # integration shards got faster, CI's critical path - #27). Same install as
  # `unit` (openhay included), so mypy sees exactly what it saw there.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # openhay's Rust build is the slow part of the install (~1 min): build
      # its wheel once per openhay commit and cache it (#23).
      - id: openhay
        # the commit pyproject.toml's haystack extra pins, not openhay's main
        run: echo "sha=$(grep -oP 'openhay@\K[0-9a-f]{40}' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: openhay-wheel
        with:
          path: openhay-wheel
          key: openhay-wheel-${{ steps.openhay.outputs.sha }}
      - if: steps.openhay-wheel.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w openhay-wheel "openhay @ git+https://github.com/jacobnash/openhay@${{ steps.openhay.outputs.sha }}#subdirectory=crates/openhay-py"
      - run: pip install openhay-wheel/openhay-*.whl
      - run: pip install -e ".[dev,validate,cx-gl36,cx-spec,export,offsite]"
      - run: openapi-spec-validator openapi.yaml fault-api-openapi.yaml derivation-api-openapi.yaml validate-api-openapi.yaml auth-api-openapi.yaml haystack-api-openapi.yaml commissioning-api-openapi.yaml
      # Both blocking (PLAN.md Guardrails): ruff went 63 -> 0 and mypy
      # 19 -> 0 against the rule sets in ruff.toml/pyproject.toml, see
      # BASELINE.md. Fix or scoped-noqa-with-reason new findings; don't
      # loosen the gate.
      - run: ruff check src/ tests/
      - run: mypy src/baler && mypy src/baler_fn  # separately: one run over both trips a duplicate-module error in vendor_constrain
      # Clone-detection is reporting-only (PLAN.md Guardrails) - alerts on
      # new duplication without blocking; baseline is ~3.7% Python
      # (BASELINE.md). Node is preinstalled on GitHub Actions runners.
      - run: npx --yes jscpd@4 src/baler tests ui gateway/njs --min-lines 5 --min-tokens 40 --ignore "**/__pycache__/**"
        continue-on-error: true
      # gateway/njs/ has no pytest equivalent - plain node runs the same
      # WebCrypto-based logic njs runs inside nginx (GitHub Actions
      # runners have Node preinstalled, no setup-node action needed).
      - run: node gateway/njs/test_jwt.mjs && node gateway/njs/test_policy.mjs && node gateway/njs/test_ratelimit.mjs
      # ui/apibase.js: the ?api=/?ingest=/... base-URL overrides only accept
      # same-origin paths; plain node runs it in a vm against a fake location.
      - run: node --test ui/apibase.test.mjs
      # tools/live-check (post-deploy verification, #178): budget, freshness,
      # edge and issue-sync logic on fixtures, and a --dry-run against a stub
      # install. Needs no npm install: Playwright loads only for the
      # browser modules, which these tests don't run.
      - run: node --test
        working-directory: tools/live-check
      # Live check of the non-Anthropic LLM path (Cx 7/10) against Gemini's free
      # tier: a real PDF extraction and agent turn. Skips without the
      # GEMINI_API_KEY repo secret; informational only - a free-tier rate
      # limit or "high demand" 503 must never turn main red and block deploys.
      - name: Live LLM check (Gemini free tier, non-blocking)
        continue-on-error: true
        env:
          BALER_LIVE_LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest tests/test_llm_live.py -ra

  # docs-site: the same npm ci + build the deploy runs (deploy.yml), so a
  # dependency bump that breaks the docs build turns the PR red instead of
  # failing the deploy on main.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # the build reads windrow/openapi.yaml
      - run: npm ci
        working-directory: docs-site
      - run: npm run lint
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site

  integration:
    runs-on: ubuntu-latest
    # Three shards, each with its own stack, split the integration files
    # (tests/conftest.py, BALER_SHARD, balanced by measured per-file time) -
    # this job was CI's critical path (#27). test_gateway_auth.py alone is
    # ~50 s, so a fourth shard wouldn't shorten the slowest one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Job-level so every docker-compose step (up, ps, logs) can interpolate
    # them, not just `up`. These are throwaway CI-only values so the stack can
    # start at all (auth_api/gateway refuse to start without the two secrets;
    # mosquitto and every MQTT daemon refuse to start without MQTT_PASSWORD)
    # and tests/test_gateway_auth.py has a real gateway to test against - never
    # real secrets, never committed. BALER_ALLOW_PRIVATE_WEBHOOKS lets
    # the webhook e2e tests register/deliver to their on-host receiver.
    env:
      BALER_JWT_SECRET: ci-only-jwt-secret-needs-32-bytes-minimum
      BALER_GATEWAY_SECRET: ci-only-gateway-secret-value
      # Bare-metal test clients authenticate to mosquitto as this user (the
      # daemon containers get it from docker-compose's daemon-env). Without
      # MQTT_USERNAME set, mqtt_util.make_client() connects anonymously and
      # the broker (auth now required) rejects it, so the real-broker tests
      # publish into the void and their reads come back empty.
      MQTT_USERNAME: baler
      MQTT_PASSWORD: ci-only-mqtt-password
      BALER_ALLOW_PRIVATE_WEBHOOKS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: tests/test_schema_upgrade.py builds a
          # database with each release's own code (git archive <tag>) and
          # upgrades it to this commit (#194).
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,validate,export,offsite]"
      # docker-container builder + Actions cache token: the type=gha layer
      # cache in .github/ci/build-app-image.sh needs both (#27)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487  # v4.0.0
      # One app image build for every service (not one per service), from
      # the Actions layer cache; shard 1 writes the cache for the next run.
      - run: .github/ci/build-app-image.sh ${{ matrix.shard == 1 && '--write-cache' || '' }}
      # --wait: every healthcheck green (postgres, mosquitto, each API, the
      # gateway) before pytest starts, instead of a postgres-only poll loop.
      # It costs ~1 s: the gateway already waits on the APIs' health.
      - run: docker compose up -d --no-build --wait --wait-timeout 300
      # Coverage is reporting-only for now (PLAN.md Stage 0.2/Guardrails) -
      # baseline is 81% (BASELINE.md). No --cov-fail-under yet: the floor
      # should ratchet up from a real baseline, not block on day one.
      # Integration tests only: the unit job runs the rest, and re-running all
      # of them here was most of this job's ~5 min of pytest (#27).
      - run: pytest -m integration --cov=baler --cov-report=term-missing --durations=15
        env:
          BALER_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Regression guard for #29: the app containers run as root with the
      # checkout bind-mounted, so any directory they create in it is
      # root-owned, and on nash-srv the next actions/checkout can't clean it
      # and the deploy dies with EACCES. Root-owned *files* in runner-owned
      # directories are still deletable, so only directories are checked.
      - name: Containers left no root-owned directories in the checkout
        run: |
          found=$(find . -path ./.git -prune -o -type d ! -user "$(id -u)" -print)
          if [ -n "$found" ]; then
            echo "::error::containers created directories the runner user can't delete (#29):"
            echo "$found" | head -50
            exit 1
          fi
      - if: always()
        run: docker compose logs

  # Haystack conformance matrix: Baler's /api and Haxall (the open-source
  # reference server) side by side, with openhay and phable as clients.
  # Baler cells and openhay-vs-Haxall cells are gated; the full table lands
  # in the job summary.
  haxall-matrix:
    runs-on: ubuntu-latest
    env:
      BALER_JWT_SECRET: ci-only-jwt-secret-needs-32-bytes-minimum
      BALER_GATEWAY_SECRET: ci-only-gateway-secret-value
      MQTT_USERNAME: baler
      MQTT_PASSWORD: ci-only-mqtt-password
      MATRIX_REQUIRED: "1"
      HAXALL_API: http://localhost:8280/api/sys
      HAXALL_SU_USERNAME: su
      HAXALL_SU_PASSWORD: ci-only-haxall-password
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # windrow/docker/haxall.Dockerfile builds the Haxall image
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # openhay's Rust build is the slow part of the install (~1 min): build
      # its wheel once per openhay commit and cache it (#23).
      - id: openhay
        # the commit pyproject.toml's haystack extra pins, not openhay's main
        run: echo "sha=$(grep -oP 'openhay@\K[0-9a-f]{40}' pyproject.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: openhay-wheel
        with:
          path: openhay-wheel
          key: openhay-wheel-${{ steps.openhay.outputs.sha }}
      - if: steps.openhay-wheel.outputs.cache-hit != 'true'
        run: pip wheel --no-deps -w openhay-wheel "openhay @ git+https://github.com/jacobnash/openhay@${{ steps.openhay.outputs.sha }}#subdirectory=crates/openhay-py"
      - run: pip install openhay-wheel/openhay-*.whl
      - run: pip install -e ".[dev,validate]"  # openhay: the cached wheel above
      # The image downloads the Haxall release zip from GitHub releases, which
      # returns intermittent 504s to Actions runners (it failed haxall-matrix
      # on many PRs on 2026-11-09 even with retries). Cache the built image,
      # keyed on its Dockerfile, so the download happens once per Dockerfile
      # change rather than on every run; a cold cache still retries with
      # backoff (up to ~7.5 min).
      - name: Restore the cached Haxall image
        id: haxall-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/haxall-image.tar
          key: haxall-image-${{ hashFiles('windrow/docker/haxall.Dockerfile') }}
      - name: Build the Haxall image (cached; retried on transient download errors)
        run: |
          if [ -f /tmp/haxall-image.tar ] && docker load -i /tmp/haxall-image.tar; then
            echo "haxall image restored from cache"; exit 0
          fi
          for i in 1 2 3 4 5 6; do
            if docker build -t haxall:ci -f windrow/docker/haxall.Dockerfile windrow/docker; then
              docker save haxall:ci -o /tmp/haxall-image.tar; exit 0
            fi
            [ "$i" = 6 ] || { echo "haxall image build failed (attempt $i), retrying in $((i * 30)) s"; sleep $((i * 30)); }
          done
          exit 1
      # Saved right after the build, not at job end, so a later failing test
      # step doesn't throw the downloaded image away.
      - name: Save the Haxall image to the cache
        if: steps.haxall-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/haxall-image.tar
          key: ${{ steps.haxall-cache.outputs.cache-primary-key }}
      - run: >-
          docker run -d --name haxall -p 8280:8080 haxall:ci sh -c
          "bin/hx init -headless -suUser su -suPass $HAXALL_SU_PASSWORD -httpPort 8080 /haxall/var/ci && bin/hx run /haxall/var/ci"
      # docker-container builder + Actions cache token: the type=gha layer
      # cache in .github/ci/build-app-image.sh needs both (#27)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487  # v4.0.0
      - run: .github/ci/build-app-image.sh  # reads the cache; integration (1) writes it
      - run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Wait for Haxall
        run: |
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8280/api/sys/about || true)
            [ "$code" != "000" ] && exit 0
            sleep 2
          done
          docker logs haxall; exit 1
      - run: pytest tests/test_haystack_matrix.py -m integration -s -ra
      - if: failure()
        run: docker logs haxall | tail -50; docker compose logs | tail -200

