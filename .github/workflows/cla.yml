name: CLA Assistant
on:
  pull_request_target:
    types: [opened, closed, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Needs a PAT with repo scope, stored as the PERSONAL_ACCESS_TOKEN
          # secret, so signatures persist to a file this repo owns (not
          # wiped between runs like GITHUB_TOKEN-only setups).
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/jacobnash/baler/blob/main/CLA.md"
          branch: "main"
          # Sole maintainer, plus commits Claude Code authors for him
          # and bots. Claude's commits (noreply@anthropic.com) resolve to the
          # GitHub login "claude", and the match is case-sensitive, so both
          # spellings are listed. Outside contributors still have to sign.
          allowlist: jacobnash,claude,Claude,*[bot]
