name: Deploy

# Fires only after the CI workflow finishes on main, and only deploys if it
# passed - a broken build never reaches nash-srv. See
# docs-site/pages/nash-srv-deploy.mdx for the full setup this depends on
# (self-hosted runner, deploy wrapper, Caddy, DNS).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual redeploy (Actions -> Deploy -> Run workflow) - e.g. after
  # re-running setup-runner.sh on the box to pick up a wrapper change,
  # without needing a throwaway commit just to trigger a fresh run.
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Skip the deploy; only run the post-deploy verification (verify job) against what is live now"
        type: boolean
        default: false

permissions:
  contents: read

# Two queues, one per job (#260): `deploy-nash-srv` for the deploy job and
# `verify-nash-srv` for the verify job, so a new deploy waits only on the
# previous *deploy*, never on a previous verify (which sleeps 5 minutes before
# its warm phase). See docs-site/pages/post-deploy-verify.mdx, "The deploy
# and verify queues".

jobs:
  deploy:
    # The head_repository check matters now that the repo is public: without
    # it, a completed CI run from an outside fork's pull request would also
    # satisfy "workflow_run ... conclusion == success" and fire this job on
    # the self-hosted runner. workflow_dispatch is inherently safe - GitHub
    # only lets collaborators with write access trigger it.
    if: (github.event_name == 'workflow_dispatch' && !inputs.verify_only) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, nash-srv, baler]
    # One deploy at a time, and only the newest waiting one: a burst of pushes
    # deploys once (the running deploy finishes; older queued ones are dropped
    # in favour of the latest), instead of one full deploy per commit (#23).
    concurrency:
      group: deploy-nash-srv
      cancel-in-progress: false
    # The deploy window, for verify's "no 5xx during the deploy" check (#178).
    outputs:
      started_at: ${{ steps.started.outputs.at }}
      finished_at: ${{ steps.finished.outputs.at }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated, not just "main" (which
          # may have moved on again by the time this job starts) - falls
          # back to the dispatch event's own sha when triggered manually
          # (workflow_run.head_sha doesn't exist on that event).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # windrow/ is a public submodule now - checkout can clone it directly,
          # no separate step or deploy key needed.
          submodules: true
          # full history, so the docs step can diff against the last build
          fetch-depth: 0

      - name: Note the deploy start
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy stack
        # The only command this runner user can run as root - see
        # deploy/nash-srv/setup-runner.sh. Rebuilds/recreates containers and
        # restarts gateway; postgres-data/oxigraph-data volumes are untouched.
        run: sudo /usr/local/sbin/baler-deploy.sh

      - name: Note the deploy end
        id: finished
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Seed demo account if needed
        # Exists -> nothing; missing -> create; auth_api not answering (5xx,
        # no answer) -> retry, then fail, never create (Baler#174). See the
        # script's header for how it tells them apart.
        env:
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
        run: bash deploy/nash-srv/seed-demo-account.sh

      - name: Build and publish docs
        # Only when docs-site/ changed since the commit the published docs were
        # built from (~100s saved on every code-only deploy, #23). No marker
        # yet, or an unknown commit: build.
        run: |
          set -euo pipefail
          marker=/var/www/timberdoodle-docs/.built-from
          if [ -f "$marker" ] && git cat-file -e "$(cat "$marker")^{commit}" 2>/dev/null \
             && git diff --quiet "$(cat "$marker")" HEAD -- docs-site/; then
            echo "docs-site/ unchanged since $(cat "$marker") - skipping the docs build"
            exit 0
          fi
          cd docs-site
          npm ci
          npm run build
          cp -r dist/. /var/www/timberdoodle-docs/
          git rev-parse HEAD > "$marker"

  # Post-deploy verification (#178, docs-site/pages/post-deploy-verify.mdx):
  # tools/live-check against the live install, read-only (only GETs, the
  # login and named edge-node reads leave the runner). Report-only: it never
  # rolls back or blocks anything, it turns its own job red and files,
  # updates or closes `live-check` issues. Cold phase right after the deploy,
  # warm phase 5 minutes later.
  #
  # Its own queue (#260): verify-nash-srv, so it never holds up the next
  # deploy. A newer deploy that is queued, running or done *supersedes* it
  # (tools/live-check/supersede.mjs): it stops cleanly, files or closes no
  # issue, keeps the phase it finished in the artifact, and doesn't count for
  # perf damping. The newest deploy of a burst is never superseded, so it
  # always gets the complete cold + warm verification. cancel-in-progress is
  # only a backstop (the supersede check normally stops it first): a newer
  # verify can't start until its own deploy has finished, and by then this
  # one has seen that deploy.
  #
  # Runner: the repo variable BALER_VERIFY_RUNNER names the runner label to
  # use. Set to baler-verify once the second runner instance is installed
  # (deploy/nash-srv/setup-runner.sh, step 8), verify runs beside the
  # deploy runner. Unset, it shares the deploy runner, and a superseded
  # verify gives the runner up as soon as the newer deploy is queued.
  verify:
    needs: deploy
    if: >-
      always() && (needs.deploy.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.verify_only && needs.deploy.result == 'skipped'))
    runs-on: ${{ fromJSON(format('["self-hosted","nash-srv","{0}"]', vars.BALER_VERIFY_RUNNER || 'baler')) }}
    concurrency:
      group: verify-nash-srv
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      # Perf damping reads the previous run's live-verify artifact back
      # (tools/live-check/previous.mjs).
      actions: read
    env:
      # The operator test account. Created by hand on nash-srv (needs sudo and
      # a credential), outside the checkout: actions/checkout's git clean
      # would delete it otherwise. Never printed.
      BALER_TEST_ENV: /home/github-runner/.config/baler/live-check.env
      GH_TOKEN: ${{ github.token }}
      LIVE_CHECK_REPO: ${{ github.repository }}
      LIVE_CHECK_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_START: ${{ needs.deploy.outputs.started_at }}
      DEPLOY_END: ${{ needs.deploy.outputs.finished_at }}
      # This run's deploy commit; empty for verify_only.
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || (!inputs.verify_only && github.sha) || '' }}
      LIVE_CHECK_MARKER: /var/lib/baler/deployed-commit
    steps:
      # Chrome needs writable config/cache dirs. ~github-runner/.config is
      # root-owned on nash-srv (it holds the credentials file above), so
      # Chrome couldn't create ~/.config/google-chrome and the browser pass
      # died at launch. Per-run dirs instead of loosening ~/.config. Set via
      # GITHUB_ENV because the runner context isn't allowed in job-level env.
      - name: Give Chrome writable per-run profile dirs
        run: |
          mkdir -p "$RUNNER_TEMP/live-check-xdg-config" "$RUNNER_TEMP/live-check-xdg-cache"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/live-check-xdg-config" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/live-check-xdg-cache" >> "$GITHUB_ENV"
      - name: Check the live-check credentials
        id: creds
        run: |
          set -euo pipefail
          f="$BALER_TEST_ENV"
          if [ ! -r "$f" ]; then
            echo "::error title=live-check credentials missing::$f is missing or unreadable for $(id -un). Create it on nash-srv (mode 600, owner github-runner) with BALER_TEST_URL, BALER_TEST_EMAIL and BALER_TEST_PASSWORD for the operator test account - see docs-site/pages/post-deploy-verify.mdx, 'One-time setup on nash-srv'."
            exit 1
          fi
          for k in BALER_TEST_URL BALER_TEST_EMAIL BALER_TEST_PASSWORD; do
            grep -q "^[[:space:]]*$k=." "$f" || { echo "::error title=live-check credentials incomplete::$f has no $k= line"; exit 1; }
          done
          if [ -n "$(find "$f" -perm /077)" ]; then
            echo "::warning title=live-check credentials readable by others::$f should be mode 600 (chmod 600 $f)"
          fi
          echo "credentials file present: $f"

      # The commit this run verifies, for the supersede check
      # (supersede.mjs): this run's deploy, or for verify_only whatever is
      # live when it starts. The marker is written by the deploy wrapper,
      # root-owned but world-readable.
      - name: Note the commit this run verifies
        run: |
          expect="$DEPLOYED_SHA"
          [ -n "$expect" ] || expect=$(cat "$LIVE_CHECK_MARKER" 2>/dev/null || true)
          echo "verifying ${expect:-whatever is live (no $LIVE_CHECK_MARKER)}"
          echo "LIVE_CHECK_EXPECT_SHA=$expect" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: steps.creds.outcome == 'success'
        with:
          ref: ${{ env.LIVE_CHECK_SHA }}

      # A newer deploy already queued, running or done: stop before measuring.
      - name: Check this is still the newest deploy
        id: pre
        if: steps.creds.outcome == 'success'
        run: node tools/live-check/supersede.mjs

      - name: Install live-check
        if: steps.creds.outcome == 'success' && steps.pre.outputs.superseded != 'true'
        working-directory: tools/live-check
        run: |
          npm ci
          # Playwright's own Chromium, used only where the box has no Google
          # Chrome (CHROME_PATH in the env file also overrides). Cached in the
          # runner user's ~/.cache, so this is a no-op after the first run.
          command -v google-chrome >/dev/null || npx --no-install playwright-core install chromium

      # live-check checks again before touching issues (step output superseded).
      - name: Verify (cold)
        id: cold
        if: steps.creds.outcome == 'success' && steps.pre.outputs.superseded != 'true'
        working-directory: tools/live-check
        run: |
          window=()
          if [ -n "$DEPLOY_START" ] && [ -n "$DEPLOY_END" ]; then window=(--deploy-start "$DEPLOY_START" --deploy-end "$DEPLOY_END"); fi
          node live-check.mjs --phase cold "${window[@]}"

      # Five minutes, polling every 15 s: stops early (superseded) as soon as a
      # newer deploy is queued or running, which also frees a shared runner.
      - name: Let the install warm up
        id: wait
        if: ${{ !cancelled() && steps.creds.outcome == 'success' && steps.pre.outputs.superseded != 'true' && steps.cold.outputs.superseded != 'true' }}
        run: node tools/live-check/supersede.mjs --wait 300 --interval 15

      - name: Verify (warm)
        id: warm
        if: ${{ !cancelled() && steps.creds.outcome == 'success' && steps.pre.outputs.superseded != 'true' && steps.cold.outputs.superseded != 'true' && steps.wait.outputs.superseded != 'true' }}
        working-directory: tools/live-check
        run: node live-check.mjs --phase warm

      # A visible step, so the run's step list says why it stopped early.
      - name: Superseded by a newer deploy
        if: ${{ steps.pre.outputs.superseded == 'true' || steps.cold.outputs.superseded == 'true' || steps.wait.outputs.superseded == 'true' || steps.warm.outputs.superseded == 'true' }}
        env:
          REASON: ${{ steps.pre.outputs.reason || steps.cold.outputs.reason || steps.wait.outputs.reason || steps.warm.outputs.reason }}
        run: |
          echo "Superseded: $REASON."
          echo "No issue was filed or closed, and this run doesn't count for perf damping. Any phase it finished is in the artifact."

      # always(): a cold result is kept even if a newer verify cancels this one.
      - name: Upload the verification artifact
        if: ${{ always() && steps.creds.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-verify-${{ env.LIVE_CHECK_SHA }}
          path: |
            tools/live-check/out/live-verify-*.json
            tools/live-check/out/summary-*.md
            tools/live-check/out/*.png
          retention-days: 30
          # Superseded before the cold phase: nothing to upload.
          if-no-files-found: ignore
