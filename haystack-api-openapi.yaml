openapi: 3.1.0
info:
  title: Baler Haystack API
  version: 0.1.0
  summary: The Project Haystack HTTP API over Baler's entity graph and historian.
  description: |
    Standard Project Haystack ops, so SkySpark, Haxall, nhaystack, pyhaystack,
    phable and openhay clients can point at Baler by changing only the
    host. Both URL layouts are served: `/api/{project}/{op}` (SkySpark) and
    `/api/{op}` (Haxall). `{project}` is accepted but not yet used for scoping.

    Every op takes either `GET` with Zinc-encoded query parameters
    (`?filter=point%20and%20temp`, `?id=@urn:point:...`) or `POST` with a
    request grid in Zinc, JSON (Haystack 3 or Hayson), or Trio. Responses
    follow `Accept`: `text/zinc` (default), `application/json`, `text/trio`,
    `text/csv`. A JSON request is answered in the same JSON flavor. Op-level
    failures are Haystack error grids (HTTP 200 with `err` in grid meta), per
    the Haystack spec.

    **Auth.** Through the gateway, every op needs a session JWT or API key,
    sent as `Authorization: Bearer <token>` (OAuth style) or
    `Authorization: BEARER authToken=<token>` (Haystack style). Haystack
    clients obtain one with the standard HELLO / SCRAM-SHA-256 handshake
    against any op (normally `about`), using their Baler email and
    password; the final 200 carries `Authentication-Info: authToken=<jwt>`.
    Read-type ops need role `viewer`; `hisWrite`/`pointWrite`/`invokeAction`
    need `operator`.

    **Ids.** Record ids are entity URIs with every character outside
    Haystack's ref alphabet escaped as `~XX`, e.g.
    `@urn:point:windrow~2Fahu-1~2FanalogInput~2C1`.

    **pointWrite** commands BACnet points through the owning Windrow
    instance (see docs-site/pages/haystack-api.mdx); without a `level` it
    returns Baler's 17-level array (17 = BACnet relinquish-default). A
    level-8 write with a `duration` is a timed override.

    **Deliberately unsupported:** `invokeAction` answers with an error grid
    (Baler records define no actions) and isn't listed by `ops`.
servers:
  - url: http://localhost:8080
    description: through the gateway
paths:
  /api/{project}/{op}:
    parameters:
      - $ref: "#/components/parameters/project"
      - $ref: "#/components/parameters/op"
    get:
      summary: Call a Haystack op with Zinc-encoded query parameters
      operationId: haystackGet
      parameters:
        - name: filter
          in: query
          required: false
          description: "`read`: Haystack filter, e.g. `point and temp and equipRef`."
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer}
        - name: id
          in: query
          required: false
          description: "`read`/`hisRead`: a Zinc ref, e.g. `@urn:point:x`."
          schema: {type: string}
        - name: range
          in: query
          required: false
          description: "`hisRead`: `today`, `yesterday`, `2026-09-08`, or `2026-09-01,2026-09-07`."
          schema: {type: string}
        - name: navId
          in: query
          required: false
          schema: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Grid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "Role does not satisfy the op, or the SCRAM proof was wrong."}
        "404": {description: Unknown op.}
    post:
      summary: Call a Haystack op with a request grid
      operationId: haystackPost
      requestBody:
        required: false
        content:
          text/zinc:
            schema: {type: string}
            example: "ver:\"3.0\"\nfilter\n\"point and temp\"\n"
          application/json:
            schema: {type: object}
          text/trio:
            schema: {type: string}
      responses:
        "200": {$ref: "#/components/responses/Grid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: "Role does not satisfy the op, or the SCRAM proof was wrong."}
        "404": {description: Unknown op.}
  /api/{op}:
    parameters:
      - $ref: "#/components/parameters/op"
    get:
      summary: Same as /api/{project}/{op} (Haxall layout)
      operationId: haystackGetFlat
      responses:
        "200": {$ref: "#/components/responses/Grid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      summary: Same as /api/{project}/{op} (Haxall layout)
      operationId: haystackPostFlat
      responses:
        "200": {$ref: "#/components/responses/Grid"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/openapi.yaml:
    get:
      summary: This document
      operationId: haystackOpenapi
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema: {type: string}
components:
  parameters:
    project:
      name: project
      in: path
      required: true
      description: SkySpark-style project name. Accepted, not yet used for scoping.
      schema: {type: string}
    op:
      name: op
      in: path
      required: true
      schema:
        type: string
        enum: [about, ops, formats, read, nav, hisRead, hisWrite, pointWrite, watchSub, watchUnsub, watchPoll, invokeAction, close, defs, libs, filetypes]
  responses:
    Grid:
      description: A Haystack grid. Error grids have `err` in their meta.
      content:
        text/zinc:
          schema: {type: string}
        application/json:
          schema: {type: object}
        text/trio:
          schema: {type: string}
        text/csv:
          schema: {type: string}
    Unauthorized:
      description: |
        No/invalid token, or a HELLO/SCRAM handshake step. Handshake steps
        carry `WWW-Authenticate: SCRAM handshakeToken=..., hash=SHA-256[, data=...]`.
      headers:
        WWW-Authenticate:
          schema: {type: string}
