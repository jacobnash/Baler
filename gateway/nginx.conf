load_module modules/ngx_http_js_module.so;

# main context only - http{} rejects this directive.
env BALER_JWT_SECRET;
env BALER_GATEWAY_SECRET;

# Default level is "error" - ngx.log(ngx.WARN/INFO, ...) calls from
# gateway/njs/main.js (revocation-cache refresh outcomes) would be
# silently dropped without this.
error_log /dev/stderr warn;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Without this, nginx's default_type (text/plain) applies to every
    # static file /ui/ serves - Chrome silently refuses to apply a
    # stylesheet served as text/plain (strict MIME checking for CSS), so
    # every page under /ui/ rendered completely unstyled. Discovered
    # live verifying the alarms/derivations UI pages in a real browser -
    # ships with nginx:alpine at this exact path, just never included.
    include mime.types;

    # API answers are JSON/Zinc text that compresses ~10x: /api/read of
    # every point is ~600 KB raw, an unfiltered /fault/faults was 5 MB
    # (Baler#107). Only for clients that ask (Accept-Encoding: browsers do).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/yaml text/zinc text/trio text/csv text/css application/javascript;

    # njs gateway-enforced auth (see gateway/njs/ and the plan doc's
    # Phase 2). Landed here as pure infra first - no location below is
    # wired to `js_access main.authorize;` yet. That happens location by
    # location in later commits; until then this block is inert.

    # Docker Compose's embedded per-project DNS. Used by the `resolve`
    # upstreams below, the variable proxy_passes (/derivation/, /windrow/)
    # and ngx.fetch() (main.refreshRevoked - "no resolver defined"
    # without it). valid=5s bounds how long a recreated container's old
    # address is kept.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Backends, re-resolved while nginx runs (Baler#108). A literal
    # `proxy_pass http://ingest_api:8000/` resolves once at startup and
    # keeps that address forever, so a backend recreated on its own (a
    # deploy, `up -d --build ingest_api`) got 502s until the gateway was
    # restarted. `resolve` re-queries the resolver above (needs the shared
    # `zone`, nginx 1.27.3+), and the gateway also boots while a backend is
    # down. max_fails=0: with a single server, nginx's default (1 failure
    # = out for 10 s) would keep returning 502 for up to 10 s after the
    # backend is back. Upstream blocks rather than `proxy_pass
    # http://$var` keep proxy_pass's prefix replacement (/ingest/x -> /x)
    # without a `rewrite`, which would change r.uri under njs's policy.
    upstream ingest_api        { zone backends 256k; server ingest_api:8000 resolve max_fails=0; }
    upstream fault_api         { zone backends; server fault_api:8002 resolve max_fails=0; }
    upstream validate_api      { zone backends; server validate_api:8005 resolve max_fails=0; }
    upstream auth_api          { zone backends; server auth_api:8006 resolve max_fails=0; }
    upstream ops_api           { zone backends; server ops_api:8007 resolve max_fails=0; }
    upstream haystack_api      { zone backends; server haystack_api:8008 resolve max_fails=0; }
    upstream commissioning_api { zone backends; server commissioning_api:8009 resolve max_fails=0; }

    # Every request still goes to the container's stdout (the image's
    # access.log is a symlink to it). Declaring any access_log here replaces
    # nginx's implicit default, so it is restated explicitly.
    access_log /var/log/nginx/access.log combined;
    # ...and every 5xx the gateway answers also goes, one JSON line each, to
    # a file on the gateway-logs volume, which ops_api reads for
    # GET /ops/gateway-errors (Baler#178: no 5xx during a deploy). 5xx only,
    # so it stays small; path only ($uri), never the query string or headers.
    map $status $gateway_5xx {
        ~^5     1;
        default 0;
    }
    log_format gateway_5xx escape=json '{"ts":"$time_iso8601","status":$status,"method":"$request_method",'
                                       '"uri":"$uri","upstream_status":"$upstream_status","rt":$request_time}';
    access_log /var/log/baler-gateway/5xx.log gateway_5xx if=$gateway_5xx;

    js_path "njs/";
    js_import main from njs/main.js;

    js_shared_dict_zone zone=revoked:1m timeout=120s;              # jti denylist cache, refreshed by js_periodic below
    js_shared_dict_zone zone=ratelimit:10m type=number timeout=60s; # per-token request counters - timeout= is required for .incr()'s own TTL argument to work at all

    js_var $user;             # set by main.authorize(), forwarded as X-User (logging/tracing only)
    js_var $gateway_secret;   # set by main.authorize(), forwarded as X-Gateway-Secret (backend defense-in-depth)

    # Brute-force throttling for /auth/login specifically - plain nginx,
    # no njs needed (that route can't require a JWT to get a JWT).
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # /derivation/ forwards the *raw* request URI (prefix stripped): its
    # targets/{target}/enable route carries a URI with %2F in it, and a
    # `proxy_pass .../;` forwards nginx's decoded, normalized URI instead,
    # which no backend route matches. A variable proxy_pass resolves per
    # request through the resolver above.
    map $request_uri $derivation_uri {
        "~^/derivation(/.*)$" $1;
        default /;
    }
    # Same raw-URI forwarding for Windrow's API (the Devices page). The
    # variable proxy_pass also resolves windrow_api per request, so the
    # gateway still starts where Windrow isn't deployed (a 502 on /windrow/
    # there, not a failed boot).
    map $request_uri $windrow_uri {
        "~^/windrow(/.*)$" $1;
        default /;
    }

    # Same idea for /auth/orgs - it's the other route policy.js marks
    # public (a brand-new org has to be creatable with no prior
    # credentials), so it's the other place per-IP abuse throttling
    # matters more than it does for a plain unauthenticated GET.
    limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;

    # Haystack SCRAM login on /api/ - only the HELLO/SCRAM handshake
    # requests get a key (an empty key is never counted), so ordinary
    # BEARER traffic to the same location is untouched. One login is 3
    # requests, so 30r/m is ~10 logins/minute per IP.
    map $http_authorization $haystack_login_key {
        "~*^(hello|scram)\s" $binary_remote_addr;
        default              "";
    }
    limit_req_zone $haystack_login_key zone=haystack_login:10m rate=30r/m;
    limit_req_status 429; # default is 503, which reads as "the server is down", not "slow down"

    server {
        listen 80;

        # nginx only ever sees plain HTTP here (Caddy terminates TLS and
        # proxies to it over HTTP) - nginx's default absolute_redirect on
        # would build this and every other relative Location using
        # $scheme, which is "http" from nginx's point of view even when
        # the actual visitor is on https://. off makes it emit the bare
        # path instead, so the browser keeps whatever scheme it's already
        # using instead of getting redirected down to plain HTTP.
        absolute_redirect off;

        location = / {
            return 302 /ui/;
        }

        # The docs site is static and served on its own docs.<host> name
        # (nash-srv: docs.timberdoodle.nash.engineering via Caddy, see
        # docs-site/pages/nash-srv-deploy.mdx); /docs is the easy-to-guess
        # way there. Per-API docs stay at /<api>/docs.
        location ~ ^/docs/?$ {
            return 302 https://docs.$host/;
        }
        # ...and /docs/<page> to that page, so the UI can link a how-to
        # (e.g. /docs/connectors from the Connectors page) without knowing
        # the docs host.
        location ~ ^/docs/([a-z0-9-]+)/?$ {
            return 302 https://docs.$host/$1;
        }

        # An API's bare prefix is the natural thing to try: send it to that
        # API's reference instead of a 404 (#69).
        location ~ ^/(ingest|fault|windrow|derivation|validate|ops|cx|auth)/?$ {
            return 302 /$1/docs;
        }

        # js_periodic needs *a* location to be declared in but doesn't
        # need real traffic there - /ui/ is already unauthenticated, so
        # it's a reasonable place to hang this rather than inventing an
        # empty one. Refreshes ngx.shared.revoked from auth_api every 30s.
        location /ui/ {
            js_periodic main.refreshRevoked interval=30s;
            alias /usr/share/nginx/ui/;
            index index.html;
        }

        # Backends go through the `resolve` upstreams above (or a variable
        # proxy_pass), so restarting one never needs a gateway restart.

        # Cut over to gateway-enforced auth (Phase 2 migration path, step
        # 6, the last of the four - htpasswd is fully retired now that
        # this one's done).
        location /ingest/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://ingest_api/;
        }

        # Cut over to gateway-enforced auth (Phase 2 migration path, step 5).
        location /fault/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://fault_api/;
        }

        # Cut over to gateway-enforced auth (Phase 2 migration path, step 4).
        location /windrow/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://windrow_api:8001$windrow_uri;
        }

        location /derivation/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://derivation_api:8003$derivation_uri;
        }

        # Cut over to gateway-enforced auth (Phase 2 migration path,
        # step 3 - smallest/newest/lowest-traffic surface, first to move).
        location /validate/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://validate_api/;
        }

        # Project Haystack HTTP API (haystack_api.py). No trailing-slash
        # strip on proxy_pass: the backend routes on the full /api/... path,
        # which is exactly what SkySpark/Haxall clients send.
        location /api/ {
            limit_req zone=haystack_login burst=15 nodelay;
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://haystack_api;
        }

        # COBie workbooks (#204) arrive base64 in JSON: ops_api refuses a
        # workbook over 30 MB, ~40 MB on the wire. nginx's default is 1 MB.
        location /ops/cobie/ {
            client_max_body_size 45m;
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://ops_api/cobie/;
        }

        location /ops/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://ops_api/;
        }

        # Commissioning (Baler#37). Ids have no "/" in them, so the plain
        # prefix strip is enough (no $uri variable like /derivation/).
        location /cx/ {
            # Spec documents (Cx 7) arrive as base64 in JSON: a 30 MB PDF
            # is ~40 MB on the wire. nginx's default is 1 MB.
            client_max_body_size 45m;
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://commissioning_api/;
        }

        # auth_api is new - no legacy htpasswd behavior to preserve, so
        # it goes straight to js_access from day one.

        # Exact match wins over the /auth/ prefix location below
        # regardless of declaration order - login can't require a JWT to
        # get a JWT, so no js_access here, just brute-force throttling.
        location = /auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auth_api/login;
        }

        # Also public (policy.js: POST /auth/orgs has minRole null), but
        # unlike login it still runs through js_access - that's what
        # actually executes the "this route is public" branch in
        # main.authorize() rather than skipping the policy table
        # entirely the way login's own bypass does.
        location = /auth/orgs {
            limit_req zone=signup burst=5 nodelay;
            js_access main.authorize;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://auth_api/orgs;
        }

        location /auth/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://auth_api/;
        }
    }
}
