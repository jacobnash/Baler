apiVersion: 1

datasources:
  - name: Baler Postgres
    uid: baler-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${BALER_PG_DB}
    user: ${BALER_PG_USER}
    isDefault: true
    editable: true
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
