openapi: 3.1.0
info:
  title: Baler Auth API
  version: "1.0.0"
  description: |
    Identity: login, API-key issuance/revocation, org/site directory CRUD.
    Separate process/port from ingest/fault/derivation/validate - this
    document is served by the process it actually describes.

    Role/site/rate-limit enforcement for every route below (except
    `POST /auth/login`, which can't require a token to get a token)
    happens in the gateway itself (nginx + njs), not in this service -
    see `gateway/njs/policy.js` for the actual per-route role
    requirements. This spec documents the request/response shapes, not
    the authorization policy.
servers:
  - url: http://localhost:8080/auth
    description: >-
      Via the gateway (docker-compose) - the actual externally-reachable
      path.
  - url: http://localhost:8006
    description: >-
      Direct - only reachable if you're running this process bare-metal
      or from inside the Docker network. docker-compose.yml does not
      publish this port to the host in the normal containerized setup.
tags:
  - name: Auth
    description: Login, logout, "who am I".
  - name: API keys
    description: Long-lived service-account credentials.
  - name: Directory
    description: Org/site CRUD.
paths:
  /login:
    post:
      operationId: login
      tags: [Auth]
      summary: Exchange email/password for a session JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: A session JWT, 12h TTL.
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: string }
                      org_id: { type: string }
                      role: { type: string, enum: [admin, operator, viewer] }
                      site_ids: { type: array, items: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the caller's own token, if revocable
      description: >-
        Only meaningful for `kind: "api_key"` tokens (added to the
        revocation denylist). Session tokens are short-lived enough that
        this is a no-op for them - always returns 204 either way.
      responses:
        "204":
          description: Always, whether or not there was anything to revoke.
  /me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Decode and return the caller's own token claims
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api-keys:
    post:
      operationId: createApiKey
      tags: [API keys]
      summary: Issue a long-lived service-account token
      description: The raw token is only ever returned here, at creation time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [admin, operator, viewer, service] }
                site_ids:
                  type: ["array", "null"]
                  items: { type: string }
                  description: Omit or null for whole-org access.
                expires_in_seconds:
                  type: ["integer", "null"]
                  description: Omit or null for no expiry.
      responses:
        "201":
          description: Created. `token` is shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  role: { type: string }
                  site_ids: { type: array, items: { type: string } }
                  token: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listApiKeys
      tags: [API keys]
      summary: List API keys for the caller's org
      description: Raw tokens are never returned again after creation.
      responses:
        "200":
          description: Every API key in the caller's org.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [API keys]
      summary: Revoke an API key
      description: >-
        Marks the key revoked and adds its `jti` to the denylist the
        gateway's periodic poller consumes - takes effect gateway-side
        within one poll interval (default 30s), not instantly.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked. No response body.
        "404":
          description: No API key with that id.
  /orgs:
    post:
      operationId: createOrg
      tags: [Directory]
      summary: Create a new org, plus its first admin user, in one call
      description: >-
        **Public - no token required.** A brand-new org has to be
        creatable with zero prior credentials; there's no other admin
        who could have authorized it. Rate-limited per source IP at the
        gateway (5/min) since it's the one mutating route this API
        exposes without a token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, admin_email, admin_password]
              properties:
                name: { type: string }
                admin_email: { type: string, format: email }
                admin_password: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  admin_user_id: { type: string }
  /sites:
    get:
      operationId: listSites
      tags: [Directory]
      summary: The caller's org's sites
      description: admin-only. For picking the sites a user is limited to.
      responses:
        "200":
          description: Sites, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    topic_prefixes: { type: array, items: { type: string } }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSite
      tags: [Directory]
      summary: Create a site under the caller's own org
      description: admin-only. `org_id` is the caller's own org, taken from their token - not a request field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                topic_prefixes:
                  type: array
                  items: { type: string }
                  description: >-
                    Topic prefixes this site owns (e.g. `fbf/hospital-a`): its points
                    and equipment are the ones under them. Once any site has a prefix,
                    reads are scoped to the caller's sites. Must not overlap another
                    org's prefixes.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Site"
                  - type: object
                    properties:
                      broker_accounts_updated:
                        type: integer
                        description: The site's edge-node broker accounts re-applied with the new prefixes.
                      broker_error:
                        type: string
                        description: >-
                          Set when the prefixes were saved but the MQTT broker couldn't be
                          updated; the site's edge nodes keep their old permissions until the
                          next change.
        "400":
          description: A topic prefix overlaps one owned by another org, or the body is malformed.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sites/{site_id}/topic-prefixes:
    put:
      operationId: setSiteTopicPrefixes
      tags: [Directory]
      summary: Replace the topic prefixes a site owns
      description: admin-only, for a site in the caller's own org. Prefixes must not overlap another org's.
      parameters:
        - name: site_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic_prefixes]
              properties:
                topic_prefixes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: A topic prefix overlaps one owned by another org, or the body is malformed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such site in the caller's org.
  /users:
    post:
      operationId: createUser
      tags: [Directory]
      summary: Add a user to the caller's own org
      description: >-
        admin-only. `org_id` is the caller's own org, taken from their
        token. For a brand-new org's *first* user, use `POST /orgs`
        instead - this endpoint needs an existing admin to call it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string, format: email, description: Trimmed and lower-cased. }
                password: { type: string, minLength: 12 }
                role: { type: string, enum: [admin, operator, viewer] }
                display_name: { type: [string, "null"], maxLength: 120, description: "How the person signs, e.g. Jacob Nash (Cx waivers name them by it)" }
                site_ids:
                  type: array
                  items: { type: string }
                  description: Limit the user to these sites (from GET /sites). Omit or empty for the whole org.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  org_id: { type: string }
                  email: { type: string }
                  role: { type: string }
                  display_name: { type: [string, "null"] }
                  site_ids: { type: array, items: { type: string } }
        "400":
          description: Bad role (only admin, operator, viewer), email, password (12+ characters) or site.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: That email can't be used (it's already taken; emails are unique across all orgs).
    get:
      operationId: listUsers
      tags: [Directory]
      summary: The users in the caller's own org
      description: admin-only. Never includes password hashes.
      responses:
        "200":
          description: Users, by email.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    email: { type: string }
                    role: { type: string }
                    created_at: { type: string, format: date-time }
                    site_ids: { type: array, items: { type: string } }
                    disabled: { type: boolean, description: "Can't log in until enabled again." }
                    display_name: { type: [string, "null"], description: How the person signs; null when unset }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{user_id}:
    patch:
      operationId: updateUser
      tags: [Directory]
      summary: Change a user's role, sites or display name, or disable/enable them
      description: >-
        admin-only, own org only. Role and sites are carried in the user's
        session token, so their sessions end and they log in again (a
        display_name change alone leaves them signed in); disabling
        also ends them, and a disabled user's login (password or Haystack
        SCRAM) fails exactly like a wrong password. You can't change your own
        role or disable yourself, and the org's last active admin can't be
        demoted or disabled.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, operator, viewer] }
                site_ids:
                  type: array
                  items: { type: string }
                  description: Empty = the whole org.
                disabled: { type: boolean }
                display_name: { type: [string, "null"], maxLength: 120, description: "How the person signs, e.g. Jacob Nash; null or blank clears it" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  role: { type: string }
                  site_ids: { type: array, items: { type: string } }
                  disabled: { type: boolean }
                  display_name: { type: [string, "null"] }
        "400":
          description: Nothing to change, a bad role or site, or your own role or account.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user in the caller's org.
        "409":
          description: It would leave the org with no admin.
    delete:
      operationId: deleteUser
      tags: [Directory]
      summary: Remove a user from the caller's org
      description: >-
        admin-only, own org only. Also ends the user's live sessions at the
        gateway (within its 30s denylist refresh). You can't delete your
        own account.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted.
        "400":
          description: That's the caller's own account.
        "409":
          description: That's the org's last admin.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user in the caller's org.
  /users/{user_id}/password:
    put:
      operationId: setUserPassword
      tags: [Directory]
      summary: Set a user's password (admin reset)
      description: >-
        admin-only, own org only. Ends every session the user had; they log
        in again with the new password.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204":
          description: Changed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user in the caller's org.
  /me/password:
    post:
      operationId: changeOwnPassword
      tags: [Auth]
      summary: Change your own password
      description: >-
        Any logged-in user (session tokens only, not API keys). Ends all of
        your sessions, this one included, and returns a fresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "200":
          description: Changed; use the returned token from now on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400":
          description: The caller is an API key.
        "401":
          description: Current password wrong, or no valid token.
  /broker-accounts:
    get:
      operationId: listBrokerAccounts
      tags: [Edge nodes]
      summary: The org's edge-node MQTT broker accounts
      description: >-
        admin-only. Per-site accounts for Windrows publishing from outside this
        host. Each may publish only under its site's topic prefixes and use its
        own command channel `cmd/<username>/#`. Passwords are never returned here.
      responses:
        "200":
          description: Accounts, and where nodes connect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts: { type: array, items: { $ref: "#/components/schemas/BrokerAccount" } }
                  connect: { $ref: "#/components/schemas/BrokerConnect" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBrokerAccount
      tags: [Edge nodes]
      summary: Create an edge-node broker account for a site
      description: admin-only. The site needs at least one topic prefix. The generated password is returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, username]
              properties:
                site_id: { type: string }
                username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,62}$" }
                description: { type: [string, "null"] }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerAccountSecret" }
        "400":
          description: Bad or taken username, or the site has no topic prefix.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such site in the caller's org.
        "502":
          description: The MQTT broker refused or didn't answer; nothing was created.
  /broker-accounts/{id}/rotate:
    post:
      operationId: rotateBrokerAccount
      tags: [Edge nodes]
      summary: Give an edge node a new password
      description: admin-only. The old password stops working immediately; returned once.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerAccountSecret" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such account in the caller's org.
        "502":
          description: The MQTT broker refused or didn't answer; the password is unchanged.
  /broker-accounts/{id}:
    delete:
      operationId: revokeBrokerAccount
      tags: [Edge nodes]
      summary: Revoke an edge node's broker account
      description: admin-only. Deletes it from the broker, which disconnects the node.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such account in the caller's org.
        "502":
          description: The MQTT broker refused or didn't answer; the account is unchanged.
  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: This document
      description: Served raw, straight off disk - the same file you're reading right now.
      responses:
        "200":
          description: The OpenAPI 3.1 spec for this API, as YAML.
          content:
            application/yaml:
              schema:
                type: string
components:
  schemas:
    Site:
      type: object
      properties:
        id: { type: string }
        org_id: { type: string }
        name: { type: string }
        topic_prefixes:
          type: array
          items: { type: string }
    Principal:
      type: object
      required: [sub, org_id, role]
      properties:
        sub: { type: string }
        org_id: { type: string }
        role: { type: string, enum: [admin, operator, viewer, service] }
        site_ids: { type: array, items: { type: string } }
        kind: { type: string, enum: [session, api_key] }
        email: { type: [string, "null"], description: "The login's email; null for an API key." }
        display_name: { type: [string, "null"], description: "How the login signs (set by an admin); null when unset or for an API key." }
    ApiKey:
      type: object
      required: [id, org_id, role]
      properties:
        id: { type: string }
        org_id: { type: string }
        site_ids: { type: array, items: { type: string } }
        role: { type: string }
        expires_at: { type: ["string", "null"], format: date-time }
        revoked_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }
        last_used_at: { type: ["string", "null"], format: date-time }
    BrokerAccount:
      type: object
      required: [id, site_id, username, created_at]
      properties:
        id: { type: string }
        site_id: { type: string }
        username: { type: string }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        rotated_at: { type: [string, "null"], format: date-time }
    BrokerConnect:
      type: object
      description: Where an edge node connects (BALER_MQTT_PUBLIC_* in .env).
      properties:
        host: { type: [string, "null"] }
        port: { type: integer }
        tls_port: { type: [integer, "null"] }
    BrokerAccountSecret:
      type: object
      required: [account, password]
      properties:
        account: { $ref: "#/components/schemas/BrokerAccount" }
        password: { type: string, description: Shown once. }
        connect: { $ref: "#/components/schemas/BrokerConnect" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    Unauthorized:
      description: Missing, invalid, or expired token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
