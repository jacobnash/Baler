# nash-srv is a shared box running other projects behind one Caddy
# instance - Caddy is the only thing allowed to listen on 0.0.0.0 there
# (see docs-site/pages/nash-srv-deploy.mdx). This rebinds every port the
# base docker-compose.yml publishes to loopback-only, so nothing but
# `gateway` (fronted by Caddy) is reachable from outside the box. Apply
# with a second -f, never edit docker-compose.yml itself:
#   docker compose -f docker-compose.yml -f deploy/nash-srv/docker-compose.override.yml ...
## Compose appends `ports:` lists across -f files by default instead of
## replacing them - without `!override` here, both the base file's 0.0.0.0
## binding and this loopback one would end up published side by side,
## silently defeating the whole point of this file. `!override` forces a
## full replace (needs Compose 2.24+; confirmed against 5.3.1 on nash-srv
## and 5.3.0 here).
services:
  mosquitto:
    ports: !override
      - "127.0.0.1:1883:1883"
      # The one public exception besides Caddy: edge nodes (Raspberry Pis at
      # sites) publish over MQTT/TLS with per-site accounts (Baler#36). Plain
      # 1883 stays loopback-only. Caddy can't proxy MQTT, so mosquitto
      # terminates TLS itself with Caddy's Let's Encrypt cert, copied in by
      # baler-mqtt-tls-sync (setup-runner.sh step 7).
      - "8883:8883"

  oxigraph:
    ports: !override
      - "127.0.0.1:7878:7878"

  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"

  jaeger:
    ports: !override
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  grafana:
    ports: !override
      - "127.0.0.1:3033:3000"

  gateway:
    ports: !override
      - "127.0.0.1:8080:80"

# nash-srv's data volumes predate the rename: they were created by the
# `timberdoodle` compose project (BALER_VOLUME_PREFIX=timberdoodle and
# WINDROW_STATE_VOLUME=fbf-state in nash-srv.env keep their names, see
# deploy/MIGRATING-TO-BALER.md). Compose labels a volume with the project
# that created it, so every deploy under project `baler` warned
#   volume "timberdoodle_postgres-data" already exists but was created for
#   project "timberdoodle" (expected "baler"). Use `external: true` ...
# `external: true` tells compose the volume is managed outside this project:
# it uses it as-is, skips the label check, and never creates or removes it
# (`down -v` leaves it alone, which suits the one copy of the live data).
#
# Only these five, the ones that warning names on nash-srv. app-data and
# gateway-logs were first created under project `baler`, so compose owns
# them without complaint. `name:` repeats the base file's on purpose: an
# external volume is looked up by that exact name, and the
# ${BALER_VOLUME_PREFIX:-baler} / ${WINDROW_STATE_VOLUME:-windrow-state}
# fallbacks must keep resolving the same way.
#
# Here and not in docker-compose.yml, because compose refuses to start with
# a missing external volume and `external:` can't be made conditional on the
# prefix (an empty value isn't a boolean). A fresh install has none of these
# volumes and must keep creating its own, so the base file stays as it was.
# A from-scratch nash-srv (no timberdoodle volumes) creates them once before
# its first deploy; docs-site/pages/nash-srv-deploy.mdx has the command.
# windrow-state is defined in docker-compose.windrow.yml, always loaded after
# this file on nash-srv; compose merges the two definitions.
volumes:
  postgres-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_postgres-data
    external: true
  oxigraph-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_oxigraph-data
    external: true
  grafana-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_grafana-data
    external: true
  mosquitto-data:
    name: ${BALER_VOLUME_PREFIX:-baler}_mosquitto-data
    external: true
  windrow-state:
    name: ${BALER_VOLUME_PREFIX:-baler}_${WINDROW_STATE_VOLUME:-windrow-state}
    external: true
