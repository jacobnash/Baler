# Demo-data pipeline: a simulated BACnet device (windrow.mock_device) plus
# Windrow's own discovery/API service (windrow.api), so the public demo has real
# equipment/points/history to show instead of an empty app. Not part of
# baler's own core stack - a separate concern, kept in its own file.
#
# windrow.api discovers/polls windrow_mock_device over real BACnet/IP, which needs
# a fixed, known local address on both sides (bacpypes3 requires a literal
# IP, not a hostname) - a custom network with static IPs, rather than the
# default bridge's dynamic ones, gives it that. Confirmed working locally:
# BACnet unicast (not broadcast) crosses a normal Docker bridge network
# fine, no network_mode: host needed.
#
# windrow_api also joins the default network (no `networks:` override there)
# so it can reach `mosquitto` by service name, same as every other daemon.
#
# One-time provisioning (`python -m windrow.mock_hospital provision ...`,
# `baler.autotag`, `scripts/seed_derivations_and_faults.py`) is
# deliberately NOT run automatically on every deploy - see
# deploy/nash-srv/seed-demo-data.sh, run once by hand.
networks:
  bacnet-mock:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  windrow_mock_device:
    build:
      context: windrow
      dockerfile: ../deploy/nash-srv/windrow.Dockerfile
    command: python -m windrow.mock_device --address 172.30.0.10/24:47808 --instance 3456 --site-spec /app/hospital_site_spec.json
    networks:
      bacnet-mock:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  windrow_api:
    build:
      context: windrow
      dockerfile: ../deploy/nash-srv/windrow.Dockerfile
    command: >
      python -m windrow.api
      --address 172.30.0.11/24:47820 --host 0.0.0.0 --port 8001
      --mqtt-host mosquitto --mqtt-port 1883
      --state-file /app/state/windrow-connections.json
      --devices-state-file /app/state/windrow-devices.json
      --modbus-state-file /app/state/windrow-modbus-connections.json
      --announce-port 47900 --announce-allow ${WINDROW_ANNOUNCE_ALLOW:-192.168.128.0/24}
      --announce-state-file /app/state/windrow-announced.json
    # Device announce (Windrow docs/edge-nodes.md): devices on the LAN send
    # "I am here" over UDP, and connections with a matching device_name
    # follow them to a new address. Only sources inside
    # WINDROW_ANNOUNCE_ALLOW are heard; the address is the datagram's
    # source IP, never its payload.
    ports:
      - "${WINDROW_ANNOUNCE_PORT:-47900}:47900/udp"
    environment:
      # Credentials as env, not flags: a --mqtt-password argument shows in
      # ps / docker top to anyone on the host (#49). windrow.api reads both.
      MQTT_USERNAME: baler
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set in nash-srv.env}
      # Traces to the stack's Jaeger, not the container's own localhost (#48).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      # Only requests the gateway forwarded (its /windrow/ route checks the
      # login and role, then adds X-Gateway-Secret) - Baler#14.
      WINDROW_GATEWAY_SECRET: ${BALER_GATEWAY_SECRET:-${TIMBERDOODLE_GATEWAY_SECRET:?set BALER_GATEWAY_SECRET in .env}}
    networks:
      bacnet-mock:
        ipv4_address: 172.30.0.11
      default:
    volumes:
      - windrow-state:/app/state
    restart: unless-stopped
    depends_on:
      - windrow_mock_device

  # The Connectors page reaches this windrow_api through ops_api (baler.edges).
  ops_api:
    environment:
      WINDROW_API_URL: http://windrow_api:8001

# Pinned name, like the core volumes in docker-compose.yml. A box set up
# before the rename keeps its provisioned connections with
# BALER_VOLUME_PREFIX=timberdoodle and WINDROW_STATE_VOLUME=fbf-state; Windrow
# itself then moves the old fbf-*.json files to their windrow-* names.
volumes:
  windrow-state:
    name: ${BALER_VOLUME_PREFIX:-baler}_${WINDROW_STATE_VOLUME:-windrow-state}
